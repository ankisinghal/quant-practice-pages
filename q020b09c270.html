<script>const D={"id":"q020b09c270","date":"2026-11-24","type":"QA","level":1,"qs":[{"id":"A-divisibility_count-r20261124","q":"How many integers between 100 and 300 (both inclusive) are divisible by both 4 and 6?","o":["15","16","17","18"],"a":2,"x":"A number divisible by both 4 and 6 is divisible by their LCM, 12. The qualifying integers run from 108 to 300, giving (300 - 108)/12 + 1 = 17.","cn":"Use the stated conditions.","sl":"Original practice item","t":"divisibility_count"},{"id":"A-probability_cards-r20261124","q":"One card is drawn from a well-shuffled standard deck of 52 cards. What is the probability that it is a red face card?","o":["3/26","1/13","1/26","3/13"],"a":0,"x":"The red face cards are the Jack, Queen and King of hearts and diamonds, which is 6 cards out of 52. The probability is 6/52 = 3/26.","cn":"Use the stated conditions.","sl":"Original practice item","t":"probability_cards"},{"id":"A-percent_of_number-r20261124","q":"If 18% of a number is 54, what is 45% of the same number?","o":["125","135","140","150"],"a":1,"x":"The number is 54 / 0.18 = 300, and 45% of 300 is 135.","cn":"Use the stated conditions.","sl":"Original practice item","t":"percent_of_number"},{"id":"A-sum_first_n-r20261124","q":"What is the sum of the first 40 positive integers?","o":["780","800","840","820"],"a":3,"x":"The sum of the first n positive integers is n(n+1)/2, so 40 x 41 / 2 = 820.","cn":"Use the stated conditions.","sl":"Original practice item","t":"sum_first_n"},{"id":"A-election_votes-r20261124","q":"In an election between two candidates, the winner received 62% of the votes and won by 240 votes. How many votes were cast in total?","o":["1000","960","1200","800"],"a":0,"x":"The winner led by 62% - 38% = 24% of the votes. If 24% of the total is 240, the total is 240 / 0.24 = 1000.","cn":"Use the stated conditions.","sl":"Original practice item","t":"election_votes"},{"id":"A-statistics_median-r20261124","q":"Eight observations are 12, 19, 25, 17, 22, 19, 28 and 15. What is the median?","o":["18","19","20","21"],"a":1,"x":"In order the observations are 12, 15, 17, 19, 19, 22, 25 and 28. The median is the average of the 4th and 5th values: (19 + 19)/2 = 19.","cn":"Use the stated conditions.","sl":"Original practice item","t":"statistics_median"},{"id":"A-pass_marks-r20261124","q":"A student must score 40% of the maximum marks to pass. He scored 180 marks and failed by 20 marks. What are the maximum marks?","o":["450","520","500","550"],"a":2,"x":"The passing mark is 180 + 20 = 200, which is 40% of the maximum. The maximum is 200 / 0.40 = 500.","cn":"Use the stated conditions.","sl":"Original practice item","t":"pass_marks"},{"id":"A-probability_coins-r20261124","q":"Three fair coins are tossed together. What is the probability of getting exactly two heads?","o":["1/4","1/2","5/8","3/8"],"a":3,"x":"Of the 8 equally likely outcomes, exactly two heads occur in HHT, HTH and THH, which is 3 outcomes. The probability is 3/8.","cn":"Use the stated conditions.","sl":"Original practice item","t":"probability_coins"},{"id":"A-digit_reversal-r20261124","q":"The sum of the digits of a two-digit number is 11. The number exceeds the number obtained by reversing its digits by 27. What is the number?","o":["74","65","83","92"],"a":0,"x":"If the digits are a and b, then a + b = 11 and (10a + b) - (10b + a) = 9(a - b) = 27, so a - b = 3. Solving gives a = 7 and b = 4, so the number is 74.","cn":"Use the stated conditions.","sl":"Original practice item","t":"digit_reversal"},{"id":"A-cube_painted-r20261124","q":"A wooden cube is painted on all its faces and then cut into 64 identical smaller cubes. How many of the smaller cubes have exactly two painted faces?","o":["16","24","32","36"],"a":1,"x":"The cube is cut into 4 x 4 x 4 pieces. Cubes with exactly two painted faces lie on the 12 edges, excluding corners, giving 12 x (4 - 2) = 24.","cn":"Use the stated conditions.","sl":"Original practice item","t":"cube_painted"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
