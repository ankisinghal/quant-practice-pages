<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Quant practice q0d0080f4e7</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "q0d0080f4e7", "date": "2026-11-20", "type": "QA", "level": 1, "qs": [{"id": "V-units_digit-4", "q": "Find the last digit of 2 raised to the power 16.", "o": ["3", "1", "2", "6"], "a": 3, "x": "Units digits of powers of 2 repeat as 2, 4, 8, 6. 16 divided by 4 leaves remainder 0; a remainder of 0 means it sits at the last place of the cycle, so the digit is 6.", "cn": "Units digits of powers repeat in a short cycle. Find the remainder of the power divided by the cycle length.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Units digit of a power"}, {"id": "V-pct_up_down-6", "q": "The price of a phone increases by 30% and then decreases by 10%. What is the net percentage change?", "o": ["20% increase", "17% increase", "18% increase", "20% decrease"], "a": 1, "x": "Rise 30% then fall 10%: net = 30 - 10 - (30 x 10)/100 = 17%, so a 17% increase.", "cn": "Percent changes multiply. If a quantity rises by x% and then falls by y% (x and y as positive numbers), net change = x - y - xy/100 percent. With signed changes it is x + y + xy/100.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Successive increase and decrease"}, {"id": "V-l0_ratio_share-7", "q": "Rs 210 are shared between Dev and Asha in the ratio 5 : 2. How many does Dev get?", "o": ["Rs 60", "Rs 105", "Rs 150", "Rs 180"], "a": 2, "x": "Total parts = 5 + 2 = 7. One part = 210 / 7 = 30. Dev gets 5 x 30 = 150.", "cn": "Add the ratio parts, find the value of one part, then multiply.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Sharing in a ratio (L0)"}, {"id": "V-l0_average-7", "q": "Find the average of 32, 40, 44, 36, 38.", "o": ["38", "39", "37", "40"], "a": 0, "x": "Sum = 190. Number of values = 5. Average = 190 / 5 = 38.", "cn": "Average = sum of the values / number of values.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Average of numbers (L0)"}, {"id": "V-ages_ratio_sum-5", "q": "The ages of Meena and Sana are in the ratio 3 : 4 and their ages add up to 56 years. What will Meena's age be after 4 years?", "o": ["24 years", "20 years", "28 years", "36 years"], "a": 2, "x": "Total parts = 3 + 4 = 7, so one part = 56 / 7 = 8 years. Meena is 3 x 8 = 24 years now, so 24 + 4 = 28 years after 4 years.", "cn": "Split the total in the ratio to get the present ages first, then add the years that pass.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Ages from a ratio and a total"}, {"id": "V-probability_dice-6", "q": "Two fair dice are thrown together. What is the probability that the sum of the numbers is 9? (Options are fractions out of 36.)", "o": ["4/36", "5/36", "6/36", "3/36"], "a": 0, "x": "Total outcomes = 36. Pairs with sum 9: (3,6), (4,5), (5,4), (6,3), which is 4 outcomes. Probability = 4/36.", "cn": "Probability = favourable outcomes / total outcomes. Two dice have 36 equally likely outcomes; list the pairs that give the sum.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two dice, sum probability"}, {"id": "V-venn_two_sets-6", "q": "In a group of 100 people, 35 like tea, 38 like coffee and 12 like both. How many like neither?", "o": ["45", "39", "27", "51"], "a": 1, "x": "Like at least one = 35 + 38 - 12 (both counted twice) = 61. Neither = 100 - 61 = 39.", "cn": "At least one = A + B - both. Neither = total - at least one.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two overlapping groups"}, {"id": "V-word_arrangements-10", "q": "In how many different ways can the letters of the word APPLE be arranged?", "o": ["120", "65", "30", "60"], "a": 3, "x": "5 letters with repeats (P repeats twice): 5! divided by the repeat factorials = 60.", "cn": "n distinct letters can be arranged in n! ways. Divide by the factorial of each repeated count.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Arrangements of letters"}, {"id": "V-l0_bodmas-3", "q": "Find the value of 12 + 5 x 5 - 10.", "o": ["27", "75", "47", "32"], "a": 0, "x": "Multiply first: 5 x 5 = 25. Then 12 + 25 = 37, and 37 - 10 = 27.", "cn": "Do multiplication before addition and subtraction. Working left to right ignores that rule.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Order of operations (L0)"}, {"id": "V-di_growth-5", "q": "Sales (in tickets) of three products:\nProduct   2022   2023\nP   240   384\nQ   120   210\nS   250   300\nThe percentage growth of Q from 2022 to 2023 is higher than that of S by how many percentage points?", "o": ["95", "55", "40", "60"], "a": 1, "x": "Q grew 90/120 = 75%. S grew 50/250 = 20%. The difference is 75 - 20 = 55 percentage points.", "cn": "Percentage growth = change / old value x 100. A difference between two growth rates is in percentage points.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Percentage growth and percentage-point gap"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=async()=>{const b=document.getElementById("copy"),c=document.getElementById("code").textContent;try{await navigator.clipboard.writeText(c);b.textContent="Copied"}catch(e){b.textContent="Copy failed - code selected; copy it manually";const r=document.createRange();r.selectNodeContents(document.getElementById("code"));const s=window.getSelection();s.removeAllRanges();s.addRange(r)}};
</script></body></html>
