<script>const D={"id": "q0db0885ada", "date": "2026-10-12", "type": "QA", "level": 1, "qs": [{"id": "V-pct_up_down-12", "q": "The salary of a worker increases by 10% and then decreases by 40%. What is the net percentage change?", "o": ["30% increase", "34% decrease", "30% decrease", "35% decrease"], "a": 1, "x": "Net = 10 - 40 - (10 x 40)/100 = -34%, so a 34% decrease.", "cn": "Percent changes multiply. Net change = x - y - xy/100 (with signs).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Successive increase and decrease"}, {"id": "V-average_new_member-12", "q": "The average of 6 numbers is 44. When one more number is included, the average rises by 5. What is the number that was included?", "o": ["49", "74", "79", "84"], "a": 2, "x": "New total = (6+1) x (44+5) = 343. Old total = 6 x 44 = 264. The new number is 343 - 264 = 79.", "cn": "Total = average x count. The new value is the new total minus the old total.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Average after a new value is added"}, {"id": "V-simple_interest-12", "q": "Rs 10500 is lent at 5% simple interest per annum. Find the interest earned in 4 years.", "o": ["Rs 2625", "Rs 1575", "Rs 210", "Rs 2100"], "a": 3, "x": "SI = P x R x T / 100 = 10500 x 5 x 4 / 100 = Rs 2100.", "cn": "Simple interest uses the original principal every year: SI = PRT/100.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Simple interest amount"}, {"id": "V-units_digit-12", "q": "What is the units digit of 8^24?", "o": ["1", "2", "6", "3"], "a": 2, "x": "Units digits of powers of 8 repeat as 8, 4, 2, 6. 24 leaves remainder 4 in a cycle of 4, so the digit is 6.", "cn": "Units digits of powers repeat in a short cycle. Find the remainder of the power divided by the cycle length.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Units digit of a power"}, {"id": "V-time_work_two-12", "q": "Neha can finish a painting task in 20 days and Kabir can finish it in 30 days. Working together, in how many days will they finish it?", "o": ["12 days", "25 days", "50 days", "13 days"], "a": 0, "x": "Rates are 1/20 and 1/30 per day. Together 1/20 + 1/30 = 50/600, so the time is 600/50 = 12 days.", "cn": "Add the work done per day (rates), not the days. Time together = (a x b)/(a + b).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two workers together"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
