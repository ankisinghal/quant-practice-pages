<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quant practice q0db18f8dc4</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Quant practice q0db18f8dc4</h1><p>5 questions &middot; level L1 &middot; about 10 to 15 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "q0db18f8dc4", "date": "2026-10-12", "type": "QA", "level": 1, "qs": [{"id": "Q001", "q": "A shopkeeper marks an item 40% above its cost price and then gives a 15% discount on the marked price. What is the profit percent?", "o": ["25.5%", "19%", "21%", "25%"], "a": 1, "x": "Take cost = 100. Marked = 140. Selling = 140 x 0.85 = 119. Profit = 19%.", "cn": "Successive percentages multiply. Discount is on the marked price, profit is on the cost price.", "sl": "Original question (checked by code)", "t": "Profit and loss"}, {"id": "Q003", "q": "A can finish a job in 12 days and B can finish it in 18 days. Working together, in how many days will they finish it?", "o": ["7.5 days", "15 days", "6 days", "7.2 days"], "a": 3, "x": "Rates are 1/12 and 1/18 per day. Together 3/36 + 2/36 = 5/36, so the time is 36/5 = 7.2 days.", "cn": "Add the work done per day (rates), not the days. Time together = (a x b)/(a + b).", "sl": "Original question (checked by code)", "t": "Time and work"}, {"id": "Q004", "q": "A 40 litre mixture has milk and water in the ratio 3 : 2. How many litres of water must be added to make the ratio 1 : 1?", "o": ["12 litres", "6 litres", "8 litres", "10 litres"], "a": 2, "x": "Milk = 24 L and water = 16 L. For 1 : 1 the water must also be 24 L, so add 8 L.", "cn": "Adding water does not change the other part. Keep it fixed and make the other part equal to it.", "sl": "Original question (checked by code)", "t": "Mixtures"}, {"id": "Q006", "q": "Sales (in units) of three products:\nProduct   2024   2025\nP         200    250\nQ         300    330\nR         150    210\nThe percentage growth of R from 2024 to 2025 is higher than that of P by how many percentage points?", "o": ["15", "10", "5", "25"], "a": 0, "x": "P grew 50/200 = 25%. R grew 60/150 = 40%. The difference is 40 - 25 = 15 percentage points.", "cn": "Percentage growth = change / old value x 100. A difference between two growth rates is in percentage points.", "sl": "Original question (checked by code)", "t": "Data interpretation"}, {"id": "Q007", "q": "What is the units digit of 7^23?", "o": ["9", "3", "1", "7"], "a": 1, "x": "Units digits of powers of 7 repeat in a cycle of 4: 7, 9, 3, 1. Since 23 leaves remainder 3 when divided by 4, the digit is the third in the cycle: 3.", "cn": "Units digits of powers repeat in a short cycle. Find the remainder of the power divided by the cycle length.", "sl": "Original question (checked by code)", "t": "Number properties"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="QL|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
