<script>const D={"id": "q1075c5e141", "date": "2026-11-26", "type": "QA", "level": 1, "qs": [{"id": "V-ratio_combining-6", "q": "If a : b = 1 : 3 and b : c = 1 : 3, then a : c = ?", "o": ["3 : 3", "9 : 1", "2 : 9", "1 : 9"], "a": 3, "x": "a : c = (a : b) x (b : c) = (1 x 1) : (3 x 3) = 1 : 9 = 1 : 9.", "cn": "Multiply the two ratios term by term, then reduce to lowest terms.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Combining two ratios"}, {"id": "V-average_new_member-7", "q": "The mean of 10 marks is 28. A new mark is added and the mean goes up by 4. Find the new mark.", "o": ["68", "32", "76", "72"], "a": 3, "x": "New total = (10+1) x (28+4) = 352. Old total = 10 x 28 = 280. The new number is 352 - 280 = 72.", "cn": "Total = average x count. The new value is the new total minus the old total.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Average after a new value is added"}, {"id": "V-simple_interest-5", "q": "Rs 15500 is lent at 5% simple interest per annum. Find the interest earned in 4 years.", "o": ["Rs 3100", "Rs 3875", "Rs 310", "Rs 2325"], "a": 0, "x": "SI = P x R x T / 100 = 15500 x 5 x 4 / 100 = Rs 3100.", "cn": "Simple interest uses the original principal every year: SI = PRT/100.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Simple interest amount"}, {"id": "V-statistics_median-6", "q": "Find the median of the data: 52, 49, 5, 6, 29, 26, 33, 54, 30.", "o": ["29", "28", "30", "32"], "a": 2, "x": "Arrange in order: 5, 6, 26, 29, 30, 33, 49, 52, 54. The middle (5th) value is 30.", "cn": "Median = the middle value after arranging in order. With an odd count it is the single middle value.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Median of a data set"}, {"id": "V-remainder_basic-7", "q": "What is the remainder when 16 x 30 is divided by 9?", "o": ["5", "3", "2", "4"], "a": 1, "x": "Remainders multiply: 16 = 9 x 1 + 7 and 30 = 9 x 3 + 3. So the remainder is (7 x 3) mod 9 = 21 mod 9 = 3.", "cn": "Work with remainders first: the remainder of a sum or product is the remainder of the remainders' sum or product.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Remainder of a sum or product"}, {"id": "V-trains_cross_pole-8", "q": "A train 375 metres long is running at 90 km/h. In how much time will it pass a pole?", "o": ["30 seconds", "15 seconds", "17 seconds", "13 seconds"], "a": 1, "x": "Speed = 90 km/h = 90 x 5/18 = 25 m/s. Time to pass a pole = length / speed = 375 / 25 = 15 seconds.", "cn": "Passing a pole means covering the train's own length. Convert km/h to m/s by multiplying by 5/18.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Train passing a pole"}, {"id": "V-compound_interest_2yr-19", "q": "Find the compound interest on Rs 10000 for 2 years at 5% per year, compounded yearly.", "o": ["Rs 1025", "Rs 11025", "Rs 1000", "Rs 1075"], "a": 0, "x": "Amount after 2 years = 10000 x 1.05 x 1.05 = Rs 11025. Compound interest = 11025 - 10000 = Rs 1025. (Simple interest would be Rs 1000.)", "cn": "Compound interest grows on the new amount each year: amount = P x (1 + R/100) for each year. Interest = amount - principal.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Compound interest for 2 years"}, {"id": "V-profit_loss_percent-7", "q": "Riya buys a table for Rs 600 and sells it for Rs 780. Find her profit percent.", "o": ["23.0769%", "35%", "25%", "30%"], "a": 3, "x": "Profit = 780 - 600 = 180. Profit percent = 180 / 600 x 100 = 30%.", "cn": "Profit percent is always on the cost price, not on the selling price. Divide the gain by the cost and multiply by 100.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Profit percent on cost"}, {"id": "V-partnership_two-7", "q": "A and B started a business investing Rs 7500 and Rs 17500. Out of a total profit of Rs 6000, what is A's share?", "o": ["Rs 1800", "Rs 2400", "Rs 3000", "Rs 4200"], "a": 0, "x": "Both investments run for the same period, so the profit is shared in the ratio 3 : 7. A's share = 6000 x 3/10 = Rs 1800.", "cn": "When money is invested for the same time, profit is divided in the ratio of the investments.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Sharing a profit in the ratio of investments"}, {"id": "V-pct_markup_discount-30", "q": "The marked price of a lamp is 60% more than its cost. It is sold after allowing a discount of 5%. Find the profit percent.", "o": ["57%", "52%", "47%", "55%"], "a": 1, "x": "Take cost = 100. Marked price = 160. Selling price = 160 x 95/100 = 152. Profit = 52%.", "cn": "Successive percentages multiply: they do not add or subtract. Discount is on the marked price, profit is on the cost price.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Mark-up and discount"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
