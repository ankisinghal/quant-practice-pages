<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Quant practice q12561d61ff</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "q12561d61ff", "date": "2026-10-28", "type": "QA", "level": 1, "qs": [{"id": "V-boats_streams-148", "q": "The speed of a boat in still water is 9 km/h and the speed of the stream is 5 km/h. Find the time taken by the boat to cover 56 km downstream.", "o": ["14 hours", "6.22222 hours", "5 hours", "4 hours"], "a": 3, "x": "Downstream speed = 9 + 5 = 14 km/h. Time = distance / speed = 56 / 14 = 4 hours.", "cn": "Downstream speeds add (boat + stream), upstream speeds subtract. Time = distance / effective speed, not distance / still-water speed.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Downstream time"}, {"id": "V-logarithm_basic-48", "q": "What is the value of log base 5 of 125?", "o": ["4", "3", "2", "6"], "a": 1, "x": "log base 5 of 125 asks: 5 to what power gives 125? Since 5^3 = 125, the answer is 3.", "cn": "log base b of N = the power p with b^p = N.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Evaluate or invert a logarithm"}, {"id": "V-partnership_two-148", "q": "A and B started a business investing Rs 12000 and Rs 20000. Out of a total profit of Rs 6400, what is A's share?", "o": ["Rs 4000", "Rs 3200", "Rs 2400", "Rs 4800"], "a": 2, "x": "Both investments run for the same period, so the profit is shared in the ratio 3 : 5. A's share = 6400 x 3/8 = Rs 2400.", "cn": "When money is invested for the same time, profit is divided in the ratio of the investments.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Sharing a profit in the ratio of investments"}, {"id": "V-ratio_combining-48", "q": "If a : b = 3 : 5 and b : c = 3 : 4, then a : c = ?", "o": ["10 : 20", "9 : 20", "20 : 9", "12 : 15"], "a": 1, "x": "a : c = (a : b) x (b : c) = (3 x 3) : (5 x 4) = 9 : 20 = 9 : 20.", "cn": "Multiply the two ratios term by term, then reduce to lowest terms.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Combining two ratios"}, {"id": "V-simple_interest-48", "q": "Rs 16500 is lent at 8% simple interest per annum. Find the interest earned in 4 years.", "o": ["Rs 5280", "Rs 3960", "Rs 6600", "Rs 528"], "a": 0, "x": "SI = P x R x T / 100 = 16500 x 8 x 4 / 100 = Rs 5280.", "cn": "Simple interest uses the original principal every year: SI = PRT/100.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Simple interest amount"}, {"id": "V-compound_interest_2yr-148", "q": "Find the compound interest on Rs 2000 for 2 years at 10% per year, compounded yearly.", "o": ["Rs 520", "Rs 2420", "Rs 420", "Rs 400"], "a": 2, "x": "Amount after 2 years = 2000 x 1.1 x 1.1 = Rs 2420. Compound interest = 2420 - 2000 = Rs 420. (Simple interest would be Rs 400.)", "cn": "Compound interest grows on the new amount each year: amount = P x (1 + R/100) for each year. Interest = amount - principal.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Compound interest for 2 years"}, {"id": "V-probability_dice-48", "q": "Two fair dice are thrown together. What is the probability that the sum of the numbers is 8? (Options are fractions out of 36.)", "o": ["4/36", "5/36", "6/36", "7/36"], "a": 1, "x": "Total outcomes = 36. Pairs with sum 8: (2,6), (3,5), (4,4), (5,3), (6,2), which is 5 outcomes. Probability = 5/36.", "cn": "Probability = favourable outcomes / total outcomes. Two dice have 36 equally likely outcomes; list the pairs that give the sum.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two dice, sum probability"}, {"id": "V-venn_two_sets-48", "q": "In a group of 120 people, 45 like tea, 30 like coffee and 18 like both. How many like neither?", "o": ["45", "81", "72", "63"], "a": 3, "x": "Like at least one = 45 + 30 - 18 (both counted twice) = 57. Neither = 120 - 57 = 63.", "cn": "At least one = A + B - both. Neither = total - at least one.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two overlapping groups"}, {"id": "V-average_new_member-48", "q": "The average of 10 numbers is 56. When one more number is included, the average rises by 5. What is the number that was included?", "o": ["106", "116", "61", "111"], "a": 3, "x": "New total = (10+1) x (56+5) = 671. Old total = 10 x 56 = 560. The new number is 671 - 560 = 111.", "cn": "Total = average x count. The new value is the new total minus the old total.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Average after a new value is added"}, {"id": "V-pct_up_down-48", "q": "The price of a phone increases by 40% and then decreases by 10%. What is the net percentage change?", "o": ["26% increase", "30% decrease", "27% increase", "30% increase"], "a": 0, "x": "Rise 40% then fall 10%: net = 40 - 10 - (40 x 10)/100 = 26%, so a 26% increase.", "cn": "Percent changes multiply. If a quantity rises by x% and then falls by y% (x and y as positive numbers), net change = x - y - xy/100 percent. With signed changes it is x + y + xy/100.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Successive increase and decrease"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
