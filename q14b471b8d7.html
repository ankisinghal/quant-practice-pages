<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quant practice q14b471b8d7</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Quant practice q14b471b8d7</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "q14b471b8d7", "date": "2026-10-24", "type": "QA", "level": 1, "qs": [{"id": "V-trains_cross_pole-135", "q": "How long does a train 150 m long, moving at 54 km/h, take to cross a lamp post?", "o": ["10 seconds", "20 seconds", "12 seconds", "8 seconds"], "a": 0, "x": "Speed = 54 km/h = 54 x 5/18 = 15 m/s. Time to pass a pole = length / speed = 150 / 15 = 10 seconds.", "cn": "Passing a pole means covering the train's own length. Convert km/h to m/s by multiplying by 5/18.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Train passing a pole"}, {"id": "V-boats_streams-35", "q": "The speed of a boat in still water is 20 km/h and the speed of the stream is 3 km/h. Find the time taken by the boat to cover 46 km downstream.", "o": ["2.70588 hours", "2.3 hours", "2 hours", "3 hours"], "a": 2, "x": "Downstream speed = 20 + 3 = 23 km/h. Time = distance / speed = 46 / 23 = 2 hours.", "cn": "Downstream speeds add (boat + stream), upstream speeds subtract. Time = distance / effective speed, not distance / still-water speed.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Downstream time"}, {"id": "V-remainder_basic-35", "q": "What is the remainder when 19 + 29 is divided by 11?", "o": ["5", "4", "6", "3"], "a": 1, "x": "19 + 29 = 48. 48 = 11 x 4 + 4, so the remainder is 4.", "cn": "Work with remainders first: the remainder of a sum or product is the remainder of the remainders' sum or product.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Remainder of a sum or product"}, {"id": "V-divisibility_check-35", "q": "The four-digit number 431_ is divisible by 11. What digit fills the blank?", "o": ["2", "3", "4", "5"], "a": 0, "x": "Divisibility by 11 needs (sum of odd-place digits) - (sum of even-place digits) to be 0 or a multiple of 11: (4 + 1) - (3 + d) = 2 - d = 0, so d = 2.", "cn": "Divisibility by 9: digit sum divisible by 9. Divisibility by 11: alternating digit sum is 0 or a multiple of 11.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Divisibility by 9 or 11"}, {"id": "V-factor_count-35", "q": "How many positive factors does 48 have?", "o": ["9", "12", "10", "11"], "a": 2, "x": "48 = 2^4 x 3^1. Number of factors = (4 + 1) x (1 + 1) = 10.", "cn": "Write the number in prime factors p^a x q^b; the factor count is (a+1)(b+1). Listing only works for small numbers.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Counting positive factors"}, {"id": "V-linear_inequality_one-35", "q": "Solve for x: 4x - 2 < 14.", "o": ["x > 4", "x < 5", "x < 3", "x < 4"], "a": 3, "x": "Add 2 to both sides: 4x < 16. Divide by 4: x < 4. Dividing by a positive number keeps the sign.", "cn": "Move constants to one side, divide by the coefficient, and flip the sign ONLY when multiplying or dividing by a negative.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Solve a linear inequality"}, {"id": "V-inequality_word-35", "q": "A taxi charges Rs 30 fixed plus Rs 18 per km. With a budget of Rs 210, at most how many km are possible?", "o": ["9", "10", "11", "12"], "a": 1, "x": "Fixed + per-unit x n <= budget: 30 + 18n <= 210, so n <= (210 - 30)/18 = 10. Largest whole number: 10.", "cn": "Set up fixed + rate x n <= budget, subtract the fixed part, divide, then take the largest whole number that still fits.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Word problem with an upper limit"}, {"id": "V-geometry_lines_angles-35", "q": "Two parallel lines are cut by a transversal. One angle is 35 deg. What is its co-interior angle?", "o": ["45 deg", "90 deg", "55 deg", "145 deg"], "a": 3, "x": "Co-interior angles on parallel lines add to 180 deg: 180 - 35 = 145 deg.", "cn": "Corresponding and vertically opposite angles are equal; co-interior (same-side) angles add to 180 deg.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Angles on parallel lines"}, {"id": "V-geometry_triangle_angles-35", "q": "In triangle ABC, the exterior angle at C is 95 deg and angle A is 50 deg. What is angle B?", "o": ["50 deg", "40 deg", "45 deg", "135 deg"], "a": 2, "x": "An exterior angle equals the sum of the two opposite interior angles: B = 95 - 50 = 45 deg.", "cn": "Interior angles of a triangle add to 180 deg; an exterior angle equals the sum of the two opposite interior angles.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Angle sum of a triangle"}, {"id": "V-geometry_quad_angles-35", "q": "In quadrilateral PQRS, angles P = 100 deg, Q = 80 deg and R = 115 deg. What is angle S?", "o": ["115 deg", "65 deg", "55 deg", "75 deg"], "a": 1, "x": "Angles of a quadrilateral add to 360 deg: S = 360 - 100 - 80 - 115 = 65 deg.", "cn": "A quadrilateral's angles add to 360 deg (two triangles). For a parallelogram, adjacent angles add to 180 deg.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Angle sum of a quadrilateral"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
