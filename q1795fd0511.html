<script>const D={"id": "q1795fd0511", "date": "2026-11-27", "type": "QA", "level": 1, "qs": [{"id": "A-trailing_zeros_factorial-r20261127", "q": "How many zeros does 25! (the product 1 x 2 x 3 x ... x 25) end with?", "o": ["6", "5", "7", "4"], "a": 0, "x": "Each trailing zero comes from a factor of 10 = 2 x 5. Fives are the limit: 25/5 gives 5 multiples of 5, and 25/25 adds 1 more for 25 itself, so there are 5 + 1 = 6 trailing zeros.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "trailing_zeros_factorial"}, {"id": "A-circle_chord_radius-r20261127", "q": "A chord of a circle is 8 cm long and its perpendicular distance from the centre of the circle is 3 cm. What is the radius of the circle?", "o": ["4 cm", "6 cm", "5 cm", "7 cm"], "a": 2, "x": "The perpendicular from the centre halves the chord, giving a right triangle with legs 4 cm and 3 cm. The radius is the hypotenuse: sqrt(16 + 9) = 5 cm.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "circle_chord_radius"}, {"id": "A-average_speed_round_trip-r20261127", "q": "A car travels from one town to another at 30 km/h and returns along the same road at 60 km/h. What is its average speed for the whole journey?", "o": ["45 km/h", "50 km/h", "35 km/h", "40 km/h"], "a": 3, "x": "The distances are equal, so the average speed is the harmonic mean: 2 x 30 x 60 / (30 + 60) = 3600 / 90 = 40 km/h.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "average_speed_round_trip"}, {"id": "A-coin_change_ways-r20261127", "q": "Using only 5-paise, 10-paise and 20-paise coins, with as many of each as needed, in how many different ways can exactly 50 paise be paid? (The order of the coins does not matter.)", "o": ["12", "10", "14", "9"], "a": 0, "x": "Count by the number of 20-paise coins: with none, 10b + 5c = 50 has 6 solutions (b = 0 to 5); with one, 10b + 5c = 30 has 4; with two, 10b + 5c = 10 has 2. Total 6 + 4 + 2 = 12.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "coin_change_ways"}, {"id": "A-sum_difference_two_numbers-r20261127", "q": "The sum of two numbers is 45 and their difference is 13. What is the larger of the two numbers?", "o": ["28", "31", "32", "29"], "a": 3, "x": "The larger number is (sum + difference) / 2 = (45 + 13) / 2 = 58 / 2 = 29.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "sum_difference_two_numbers"}, {"id": "A-speed_late_early-r20261127", "q": "Ravi walks to school at 4 km/h and arrives 10 minutes late. Walking at 6 km/h instead, he arrives 10 minutes early. How far is his school from home?", "o": ["3 km", "5 km", "6 km", "4 km"], "a": 3, "x": "The two times differ by 20 minutes = 1/3 hour, and d/4 - d/6 = d/12. So d/12 = 1/3, giving d = 4 km.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "speed_late_early"}, {"id": "A-regular_polygon_angles-r20261127", "q": "Each interior angle of a regular polygon is 150 degrees. How many sides does the polygon have?", "o": ["10", "15", "12", "9"], "a": 2, "x": "Each exterior angle is 180 - 150 = 30 degrees, and the exterior angles add to 360 degrees, so the number of sides is 360 / 30 = 12.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "regular_polygon_angles"}, {"id": "A-geometry_triangle_midsegment-r20261127", "q": "In triangle ABC, the segment joining the midpoints of sides AB and AC is 7 cm long. How long is the side BC?", "o": ["7 cm", "21 cm", "14 cm", "10.5 cm"], "a": 2, "x": "The segment joining the midpoints of two sides of a triangle is half the third side, so BC = 2 x 7 = 14 cm.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "geometry_triangle_midsegment"}, {"id": "A-probability_without_replacement-r20261127", "q": "A box contains 5 red balls and 3 blue balls. Two balls are drawn one after another without replacement. What is the probability that both balls are red?", "o": ["25/64", "5/14", "5/16", "3/8"], "a": 1, "x": "P(first red) = 5/8, and then P(second red) = 4/7, so the probability is 5/8 x 4/7 = 20/56 = 5/14.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "probability_without_replacement"}, {"id": "A-tax_slab-r20261127", "q": "A city charges income tax as follows: no tax on the first Rs 2,50,000 of yearly income, 5% on the next Rs 2,50,000, and 10% on any income above Rs 5,00,000. What is the total tax on a yearly income of Rs 6,00,000?", "o": ["Rs 30,000", "Rs 22,500", "Rs 17,500", "Rs 25,000"], "a": 1, "x": "The first slab is free, the second slab costs 5% of Rs 2,50,000 = Rs 12,500, and the last Rs 1,00,000 costs 10% = Rs 10,000. Total Rs 22,500.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "tax_slab"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
