<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>

<script>const D={"id": "q1905919f08", "date": "2026-10-15", "type": "QA", "level": 1, "qs": [{"id": "V-pct_up_down-18", "q": "The price of a phone increases by 20% and then decreases by 35%. What is the net percentage change?", "o": ["15% increase", "22% decrease", "23% decrease", "15% decrease"], "a": 1, "x": "Net = 20 - 35 - (20 x 35)/100 = -22%, so a 22% decrease.", "cn": "Percent changes multiply. Net change = x - y - xy/100 (with signs).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Successive increase and decrease"}, {"id": "V-average_new_member-18", "q": "The average of 9 numbers is 42. When one more number is included, the average rises by 2. What is the number that was included?", "o": ["44", "60", "64", "62"], "a": 3, "x": "New total = (9+1) x (42+2) = 440. Old total = 9 x 42 = 378. The new number is 440 - 378 = 62.", "cn": "Total = average x count. The new value is the new total minus the old total.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Average after a new value is added"}, {"id": "V-simple_interest-18", "q": "What is the simple interest on Rs 7000 at 10% per year for 5 years?", "o": ["Rs 2800", "Rs 3500", "Rs 4200", "Rs 350"], "a": 1, "x": "SI = P x R x T / 100 = 7000 x 10 x 5 / 100 = Rs 3500.", "cn": "Simple interest uses the original principal every year: SI = PRT/100.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Simple interest amount"}, {"id": "V-ages_ratio_sum-18", "q": "The ages of Anil and Kabir are in the ratio 3 : 5 and their ages add up to 64 years. What will Anil's age be after 4 years?", "o": ["28 years", "44 years", "36 years", "24 years"], "a": 0, "x": "Total parts = 3 + 5 = 8, so one part = 64 / 8 = 8 years. Anil is 3 x 8 = 24 years now, so 24 + 4 = 28 years after 4 years.", "cn": "Split the total in the ratio to get the present ages first, then add the years that pass.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Ages from a ratio and a total"}, {"id": "V-compound_interest_2yr-18", "q": "Find the compound interest on Rs 8000 for 2 years at 5% per year, compounded yearly.", "o": ["Rs 800", "Rs 870", "Rs 820", "Rs 8820"], "a": 2, "x": "Amount after 2 years = 8000 x 1.05 x 1.05 = Rs 8820. Compound interest = 8820 - 8000 = Rs 820. (Simple interest would be Rs 800.)", "cn": "Compound interest grows on the new amount each year: amount = P x (1 + R/100) for each year. Interest = amount - principal.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Compound interest for 2 years"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
