<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quant practice q1905919f08</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Quant practice q1905919f08</h1><p>5 questions &middot; level L1 &middot; about 10 to 15 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "q1905919f08", "date": "2026-10-15", "type": "QA", "level": 1, "qs": [{"id": "V-simple_interest-18", "q": "What is the simple interest on Rs 7000 at 10% per year for 5 years?", "o": ["Rs 2800", "Rs 3500", "Rs 350", "Rs 4200"], "a": 1, "x": "SI = P x R x T / 100 = 7000 x 10 x 5 / 100 = Rs 3500.", "cn": "Simple interest uses the original principal every year: SI = PRT/100.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Simple interest amount"}, {"id": "V-compound_interest_2yr-18", "q": "Find the compound interest on Rs 8000 for 2 years at 5% per year, compounded yearly.", "o": ["Rs 800", "Rs 8820", "Rs 870", "Rs 820"], "a": 3, "x": "Amount after 2 years = 8000 x 1.05 x 1.05 = Rs 8820. Compound interest = 8820 - 8000 = Rs 820. (Simple interest would be Rs 800.)", "cn": "Compound interest grows on the new amount each year: amount = P x (1 + R/100) for each year. Interest = amount - principal.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Compound interest for 2 years"}, {"id": "V-probability_dice-18", "q": "Two fair dice are thrown together. What is the probability that the sum of the numbers is 4? (Options are fractions out of 36.)", "o": ["2/36", "3/36", "4/36", "5/36"], "a": 1, "x": "Total outcomes = 36. Pairs with sum 4: (1,3), (2,2), (3,1), which is 3 outcomes. Probability = 3/36.", "cn": "Probability = favourable outcomes / total outcomes. Two dice have 36 equally likely outcomes; list the pairs that give the sum.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two dice, sum probability"}, {"id": "V-venn_two_sets-18", "q": "In a group of 100 people, 50 like tea, 30 like coffee and 12 like both. How many like neither?", "o": ["32", "44", "38", "20"], "a": 0, "x": "Like at least one = 50 + 30 - 12 (both counted twice) = 68. Neither = 100 - 68 = 32.", "cn": "At least one = A + B - both. Neither = total - at least one.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two overlapping groups"}, {"id": "V-word_arrangements-18", "q": "In how many different ways can the letters of the word BRICK be arranged?", "o": ["240", "125", "120", "60"], "a": 2, "x": "5 letters, all different: 5! = 120.", "cn": "n distinct letters can be arranged in n! ways. Divide by the factorial of each repeated count.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Arrangements of letters"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
