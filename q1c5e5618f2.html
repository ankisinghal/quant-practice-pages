<h1>Quant practice q1c5e5618f2</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>

<script>const D={"id": "q1c5e5618f2", "date": "2026-11-03", "type": "QA", "level": 1, "qs": [{"id": "V-probability_dice-54", "q": "Two fair dice are thrown together. What is the probability that the sum of the numbers is 6? (Options are fractions out of 36.)", "o": ["4/36", "6/36", "7/36", "5/36"], "a": 3, "x": "Total outcomes = 36. Pairs with sum 6: (1,5), (2,4), (3,3), (4,2), (5,1), which is 5 outcomes. Probability = 5/36.", "cn": "Probability = favourable outcomes / total outcomes. Two dice have 36 equally likely outcomes; list the pairs that give the sum.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two dice, sum probability"}, {"id": "V-venn_two_sets-58", "q": "In a group of 80 people, 35 like tea, 30 like coffee and 12 like both. How many like neither?", "o": ["33", "27", "15", "39"], "a": 1, "x": "Like at least one = 35 + 30 - 12 (both counted twice) = 53. Neither = 80 - 53 = 27.", "cn": "At least one = A + B - both. Neither = total - at least one.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two overlapping groups"}, {"id": "V-compound_interest_2yr-54", "q": "Find the compound interest on Rs 4000 for 2 years at 10% per year, compounded yearly.", "o": ["Rs 940", "Rs 4840", "Rs 840", "Rs 800"], "a": 2, "x": "Amount after 2 years = 4000 x 1.1 x 1.1 = Rs 4840. Compound interest = 4840 - 4000 = Rs 840. (Simple interest would be Rs 800.)", "cn": "Compound interest grows on the new amount each year: amount = P x (1 + R/100) for each year. Interest = amount - principal.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Compound interest for 2 years"}, {"id": "V-boats_streams-54", "q": "The speed of a boat in still water is 9 km/h and the speed of the stream is 4 km/h. Find the time taken by the boat to cover 65 km downstream.", "o": ["7.22222 hours", "6 hours", "13 hours", "5 hours"], "a": 3, "x": "Downstream speed = 9 + 4 = 13 km/h. Time = distance / speed = 65 / 13 = 5 hours.", "cn": "Downstream speeds add (boat + stream), upstream speeds subtract. Time = distance / effective speed, not distance / still-water speed.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Downstream time"}, {"id": "V-pipes_cistern_two-54", "q": "Pipe A can fill a tank in 12 hours and pipe B can fill it in 18 hours. How long will both pipes together take to fill the tank?", "o": ["7.2 hours", "30 hours", "15 hours", "8.2 hours"], "a": 0, "x": "Together they fill 1/12 + 1/18 of the tank per hour, so the time is 12 x 18 / (12 + 18) = 7.2 hours.", "cn": "Add the rates (fraction of the tank per hour), not the times. Time together = (x x y)/(x + y).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two pipes together"}, {"id": "V-partnership_two-54", "q": "A and B started a business investing Rs 15000 and Rs 21000. Out of a total profit of Rs 3600, what is A's share?", "o": ["Rs 1800", "Rs 2400", "Rs 1500", "Rs 2100"], "a": 2, "x": "Both investments run for the same period, so the profit is shared in the ratio 5 : 7. A's share = 3600 x 5/12 = Rs 1500.", "cn": "When money is invested for the same time, profit is divided in the ratio of the investments.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Sharing a profit in the ratio of investments"}, {"id": "V-profit_loss_percent-54", "q": "A shopkeeper buys a bag for Rs 700 and sells it for Rs 784. What is the profit percent?", "o": ["12%", "7%", "17%", "10.7143%"], "a": 0, "x": "Profit = 784 - 700 = 84. Profit percent = 84 / 700 x 100 = 12%.", "cn": "Profit percent is always on the cost price, not on the selling price. Divide the gain by the cost and multiply by 100.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Profit percent on cost"}, {"id": "V-geometric_progression-56", "q": "The first term of a geometric progression is 3 and the common ratio is 2. What is its 6th term?", "o": ["48", "30", "192", "96"], "a": 3, "x": "nth term = a x r^(n-1) = 3 x 2^(6-1) = 3 x 32 = 96.", "cn": "The nth term of a GP is a x r^(n-1). The exponent is n-1, one less than the position.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "GP nth term"}, {"id": "V-surds_indices-55", "q": "Simplify: 3^3 x 3^5 / 3^2", "o": ["2187", "729", "6561", "243"], "a": 1, "x": "Add powers on multiplying, subtract on dividing: 3^(3 + 5 - 2) = 3^6 = 729.", "cn": "Same base: a^m x a^n = a^(m+n) and a^m / a^n = a^(m-n). Do the powers step by step.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Product and quotient of powers"}, {"id": "V-races-59", "q": "In a 200 m race, A beats B by 20 m and B beats C by 40 m. By how many metres does A beat C in the same race?", "o": ["61 m", "60 m", "56 m", "59 m"], "a": 2, "x": "When A runs 200 m, B runs 180 m. When B runs 200 m, C runs 160 m, so C runs (180) x (160) / 200 = 144 m when A runs 200 m. A beats C by 200 - 144 = 56 m.", "cn": "Do not add the margins. Chain the distances: C covers (D - x) x (D - y) / D in the time A covers D.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "A beats B, B beats C"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
