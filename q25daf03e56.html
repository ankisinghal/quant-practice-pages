<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quant practice q25daf03e56</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Quant practice q25daf03e56</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "q25daf03e56", "date": "2026-11-16", "type": "QA", "level": 1, "qs": [{"id": "V-l0_percent_of-19", "q": "What is 30% of 160?", "o": ["48", "112", "96", "63"], "a": 0, "x": "30% of 160 = 30/100 x 160 = 48.", "cn": "Percent means per hundred: p% of n = p/100 x n.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Percentage of a number (L0)"}, {"id": "V-l0_speed_distance-20", "q": "A bus travels at 40 km per hour for 4 hours. How far does it travel?", "o": ["160 km", "200 km", "44 km", "120 km"], "a": 0, "x": "Distance = speed x time = 40 x 4 = 160 km.", "cn": "Distance = speed x time.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Distance = speed x time (L0)"}, {"id": "V-l0_profit_simple-38", "q": "An article bought for Rs 200 is sold for Rs 260. What is the profit percent?", "o": ["25%", "35%", "30%", "40%"], "a": 2, "x": "Profit = 260 - 200 = 60. Profit percent = 60/200 x 100 = 30%.", "cn": "Profit percent = profit / cost price x 100 (always on the cost price).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Profit percent, one step (L0)"}, {"id": "V-pct_markup_discount-20", "q": "A shopkeeper marks a pair of shoes 40% above its cost price and then gives a 25% discount on the marked price. What is the profit percent?", "o": ["15%", "16%", "5%", "10%"], "a": 2, "x": "Take cost = 100. Marked price = 140. Selling price = 140 x 75/100 = 105. Profit = 5%.", "cn": "Successive percentages multiply: they do not add or subtract. Discount is on the marked price, profit is on the cost price.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Mark-up and discount"}, {"id": "V-algebra_identity-17", "q": "If x + y = 15 and xy = 56, what is the value of x^2 + y^2?", "o": ["113", "225", "337", "169"], "a": 0, "x": "x^2 + y^2 = (x + y)^2 - 2xy = 15^2 - 2 x 56 = 225 - 112 = 113.", "cn": "Use the identity x^2 + y^2 = (x + y)^2 - 2xy instead of finding x and y separately.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Square of a sum identity"}, {"id": "V-mixture_add_water-19", "q": "A 96 litre mixture has syrup and water in the ratio 7 : 5. How many litres of water must be added to make the ratio 1 : 1?", "o": ["14 litres", "16 litres", "20 litres", "18 litres"], "a": 1, "x": "Syrup = 56 L and water = 40 L. For 1 : 1 the water must also be 56 L, so add 56-40 = 16 L.", "cn": "Adding water does not change the other part. Keep it fixed and make the other part equal to it.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Adding to change a ratio"}, {"id": "V-quad_root_k-16", "q": "2 is a root of x^2 - 3x + k = 0. Find k.", "o": ["1", "3", "4", "2"], "a": 3, "x": "Put x = 2: 4 - 6 + k = 0, so k = 2. (The other root is 1, and 2 x 1 = 2.)", "cn": "A root satisfies the equation. Substitute it, or use: product of roots = k, sum of roots = coefficient.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Using a known root of a quadratic"}, {"id": "V-l0_area_rect-18", "q": "A rectangular card is 25 cm long and 10 cm wide. What is its area?", "o": ["70 sq cm", "250 sq cm", "500 sq cm", "35 sq cm"], "a": 1, "x": "Area of a rectangle = length x width = 25 x 10 = 250 sq cm.", "cn": "Area of a rectangle = length x width. Perimeter is a different thing (the distance around).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Area of a rectangle (L0)"}, {"id": "V-l0_simple_interest-16", "q": "What is the simple interest on Rs 5000 at 5% per year for 2 years?", "o": ["Rs 250", "Rs 500", "Rs 5500", "Rs 1000"], "a": 1, "x": "Simple interest = P x R x T / 100 = 5000 x 5 x 2 / 100 = Rs 500.", "cn": "Simple interest = principal x rate x time / 100. It is the interest only, not the total amount.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Simple interest, one step (L0)"}, {"id": "A-l0_lcm-an20261116-1", "q": "A ferry leaves a jetty every 24 minutes and a bus leaves the same stop every 36 minutes. They leave together now. After how many minutes will they next leave together?", "o": ["48 minutes", "144 minutes", "60 minutes", "72 minutes"], "a": 3, "x": "They next leave together after LCM(24,36). Since 24 = 2^3 x 3 and 36 = 2^2 x 3^2, their LCM is 2^3 x 3^2 = 72 minutes.", "cn": "LCM = the smallest number that both numbers divide into. Do not just multiply the numbers unless they share no factor.", "sl": "Original practice item", "t": "LCM of two numbers (L0)"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
