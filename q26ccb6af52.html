<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quant practice q26ccb6af52</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Quant practice q26ccb6af52</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "q26ccb6af52", "date": "2026-11-17", "type": "QA", "level": 1, "qs": [{"id": "V-l0_percent_of-20", "q": "What is 40% of 80?", "o": ["48", "52", "32", "64"], "a": 2, "x": "40% of 80 = 40/100 x 80 = 32.", "cn": "Percent means per hundred: p% of n = p/100 x n.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Percentage of a number (L0)"}, {"id": "V-l0_speed_distance-24", "q": "A bus travels at 60 km per hour for 4 hours. How far does it travel?", "o": ["240 km", "64 km", "180 km", "300 km"], "a": 0, "x": "Distance = speed x time = 60 x 4 = 240 km.", "cn": "Distance = speed x time.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Distance = speed x time (L0)"}, {"id": "V-l0_profit_simple-39", "q": "An article bought for Rs 100 is sold for Rs 110. What is the profit percent?", "o": ["20%", "15%", "5%", "10%"], "a": 3, "x": "Profit = 110 - 100 = 10. Profit percent = 10/100 x 100 = 10%.", "cn": "Profit percent = profit / cost price x 100 (always on the cost price).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Profit percent, one step (L0)"}, {"id": "V-pct_markup_discount-21", "q": "The marked price of a shirt is 15% more than its cost. It is sold after allowing a discount of 10%. Find the profit percent.", "o": ["6%", "3.5%", "5%", "8.5%"], "a": 1, "x": "Take cost = 100. Marked price = 115. Selling price = 115 x 90/100 = 103.5. Profit = 3.5%.", "cn": "Successive percentages multiply: they do not add or subtract. Discount is on the marked price, profit is on the cost price.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Mark-up and discount"}, {"id": "V-algebra_identity-19", "q": "If x + y = 9 and xy = 18, what is the value of x^2 + y^2?", "o": ["45", "81", "117", "63"], "a": 0, "x": "x^2 + y^2 = (x + y)^2 - 2xy = 9^2 - 2 x 18 = 81 - 36 = 45.", "cn": "Use the identity x^2 + y^2 = (x + y)^2 - 2xy instead of finding x and y separately.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Square of a sum identity"}, {"id": "V-mixture_add_water-21", "q": "A 120 litre mixture has juice and water in the ratio 7 : 5. How many litres of water must be added to make the ratio 1 : 1?", "o": ["18 litres", "20 litres", "24 litres", "22 litres"], "a": 1, "x": "Juice = 70 L and water = 50 L. For 1 : 1 the water must also be 70 L, so add 70-50 = 20 L.", "cn": "Adding water does not change the other part. Keep it fixed and make the other part equal to it.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Adding to change a ratio"}, {"id": "V-quad_root_k-17", "q": "One root of the equation x^2 - 5x + k = 0 is 4. What is the value of k?", "o": ["8", "5", "4", "3"], "a": 2, "x": "Put x = 4: 16 - 20 + k = 0, so k = 4. (The other root is 1, and 4 x 1 = 4.)", "cn": "A root satisfies the equation. Substitute it, or use: product of roots = k, sum of roots = coefficient.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Using a known root of a quadratic"}, {"id": "V-l0_area_rect-19", "q": "A rectangular card is 15 cm long and 6 cm wide. What is its area?", "o": ["180 sq cm", "21 sq cm", "42 sq cm", "90 sq cm"], "a": 3, "x": "Area of a rectangle = length x width = 15 x 6 = 90 sq cm.", "cn": "Area of a rectangle = length x width. Perimeter is a different thing (the distance around).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Area of a rectangle (L0)"}, {"id": "V-l0_simple_interest-18", "q": "What is the simple interest on Rs 5000 at 5% per year for 4 years?", "o": ["Rs 2000", "Rs 1000", "Rs 250", "Rs 6000"], "a": 1, "x": "Simple interest = P x R x T / 100 = 5000 x 5 x 4 / 100 = Rs 1000.", "cn": "Simple interest = principal x rate x time / 100. It is the interest only, not the total amount.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Simple interest, one step (L0)"}, {"id": "A-l0_lcm-an20261117-1", "q": "A row of identical square tiles must have a total length that is an exact multiple of BOTH 16 cm and 28 cm. What is the SMALLEST positive total length possible?", "o": ["44 cm", "56 cm", "112 cm", "448 cm"], "a": 2, "x": "The least positive length divisible by both 16 and 28 is LCM(16,28). Since 16=2^4 and 28=2^2 x 7, the LCM is 2^4 x 7=112 cm.", "cn": "LCM = the smallest number that both numbers divide into. Do not just multiply the numbers unless they share no factor.", "sl": "Original practice item", "t": "LCM of two numbers (L0)"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
