<h1>Quant practice q2f9259e21e</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>

<script>const D={"id": "q2f9259e21e", "date": "2026-10-24", "type": "QA", "level": 1, "qs": [{"id": "V-l0_ratio_share-134", "q": "Rs 180 are shared between Mira and Asha in the ratio 5 : 4. How many does Mira get?", "o": ["Rs 90", "Rs 100", "Rs 120", "Rs 80"], "a": 1, "x": "Total parts = 5 + 4 = 9. One part = 180 / 9 = 20. Mira gets 5 x 20 = 100.", "cn": "Add the ratio parts, find the value of one part, then multiply.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Sharing in a ratio (L0)"}, {"id": "V-l0_average-135", "q": "Find the average of 42, 26, 42, 38, 32.", "o": ["36", "38", "35", "37"], "a": 0, "x": "Sum = 180. Number of values = 5. Average = 180 / 5 = 36.", "cn": "Average = sum of the values / number of values.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Average of numbers (L0)"}, {"id": "V-l0_area_rect-134", "q": "A sheet of paper is 18 cm long and 9 cm wide. What is its area?", "o": ["54 sq cm", "162 sq cm", "27 sq cm", "324 sq cm"], "a": 1, "x": "Area of a rectangle = length x width = 18 x 9 = 162 sq cm.", "cn": "Area of a rectangle = length x width. Perimeter is a different thing (the distance around).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Area of a rectangle (L0)"}, {"id": "V-probability_dice-34", "q": "Two fair dice are thrown together. What is the probability that the sum of the numbers is 11? (Options are fractions out of 36.)", "o": ["3/36", "4/36", "2/36", "1/36"], "a": 2, "x": "Total outcomes = 36. Pairs with sum 11: (5,6), (6,5), which is 2 outcomes. Probability = 2/36.", "cn": "Probability = favourable outcomes / total outcomes. Two dice have 36 equally likely outcomes; list the pairs that give the sum.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two dice, sum probability"}, {"id": "V-venn_two_sets-34", "q": "In a group of 100 people, 40 like tea, 30 like coffee and 18 like both. How many like neither?", "o": ["57", "30", "66", "48"], "a": 3, "x": "Like at least one = 40 + 30 - 18 (both counted twice) = 52. Neither = 100 - 52 = 48.", "cn": "At least one = A + B - both. Neither = total - at least one.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two overlapping groups"}, {"id": "V-word_arrangements-34", "q": "In how many different ways can the letters of the word BRICK be arranged?", "o": ["60", "240", "125", "120"], "a": 3, "x": "5 letters, all different: 5! = 120.", "cn": "n distinct letters can be arranged in n! ways. Divide by the factorial of each repeated count.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Arrangements of letters"}, {"id": "V-compound_interest_2yr-34", "q": "Find the compound interest on Rs 10000 for 2 years at 10% per year, compounded yearly.", "o": ["Rs 2000", "Rs 12100", "Rs 2100", "Rs 2200"], "a": 2, "x": "Amount after 2 years = 10000 x 1.1 x 1.1 = Rs 12100. Compound interest = 12100 - 10000 = Rs 2100. (Simple interest would be Rs 2000.)", "cn": "Compound interest grows on the new amount each year: amount = P x (1 + R/100) for each year. Interest = amount - principal.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Compound interest for 2 years"}, {"id": "V-boats_streams-34", "q": "A steamer can travel at 8 km/h in still water. If the speed of the stream is 4 km/h, how many hours will it take to go 24 km downstream?", "o": ["2.5 hours", "6 hours", "2 hours", "3 hours"], "a": 2, "x": "Downstream speed = 8 + 4 = 12 km/h. Time = distance / speed = 24 / 12 = 2 hours.", "cn": "Downstream speeds add (boat + stream), upstream speeds subtract. Time = distance / effective speed, not distance / still-water speed.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Downstream time"}, {"id": "V-pipes_cistern_two-34", "q": "Pipe A can fill a tank in 6 hours and pipe B can fill it in 12 hours. How long will both pipes together take to fill the tank?", "o": ["4 hours", "18 hours", "5 hours", "9 hours"], "a": 0, "x": "Together they fill 1/6 + 1/12 of the tank per hour, so the time is 6 x 12 / (6 + 12) = 4 hours.", "cn": "Add the rates (fraction of the tank per hour), not the times. Time together = (x x y)/(x + y).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two pipes together"}, {"id": "V-trains_cross_pole-34", "q": "How long does a train 480 m long, moving at 108 km/h, take to cross a lamp post?", "o": ["16 seconds", "18 seconds", "32 seconds", "14 seconds"], "a": 0, "x": "Speed = 108 km/h = 108 x 5/18 = 30 m/s. Time to pass a pole = length / speed = 480 / 30 = 16 seconds.", "cn": "Passing a pole means covering the train's own length. Convert km/h to m/s by multiplying by 5/18.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Train passing a pole"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
