speed minus stream speed, so the boat's still-water speed is 6 + 2 = 8 km/h.", "cn": "Downstream speeds add (boat + stream), upstream speeds subtract. Time = distance / effective speed, not distance / still-water speed.", "sl": "Authored item for a concept (new construction and wording)", "t": "Downstream time"}, {"id": "A-pipes_cistern_two-a1", "q": "Two pipes A and B together can fill a tank in 6 hours. Pipe A alone can fill it in 10 hours. How long will pipe B alone take to fill the tank?", "o": ["12 hours", "30 hours", "15 hours", "4 hours"], "a": 2, "x": "Together they fill 1/6 of the tank per hour and pipe A alone fills 1/10. B's share per hour is 1/6 - 1/10 = 5/30 - 3/30 = 2/30 = 1/15, so B alone needs 15 hours.", "cn": "Work with rates (fraction of the tank per hour), not times. Pipe B's rate is the combined rate minus pipe A's rate.", "sl": "Authored item for a concept (new construction and wording)", "t": "Two pipes together"}, {"id": "A-logarithm_basic-a3", "q": "If log base 2 of x is 3, what is the value of log base 2 of x^2?", "o": ["3", "5", "9", "6"], "a": 3, "x": "log base 2 of x = 3 means x = 2^3 = 8. Then x^2 = 64, and log base 2 of 64 = 6 because 2^6 = 64.", "cn": "log base b of N = the power p with b^p = N.", "sl": "Authored item for a concept (new construction and wording)", "t": "Evaluate or invert a logarithm"}, {"id": "A-races-a1", "q": "In a 100 m race, A runs the distance in 20 seconds and B runs it in 25 seconds. If they start together, by how many metres does A beat B?", "o": ["10 m", "25 m", "20 m", "5 m"], "a": 2, "x": "When A finishes in 20 seconds, B has run for 20 seconds at 100/25 = 4 m/s, covering 80 m. So A beats B by 100 - 80 = 20 m.", "cn": "Both runners run for the same time. Find how far the slower runner covers in the winner's time; the margin is the gap left.", "sl": "Authored item for a concept (new construction and wording)", "t": "A beats B, B beats C"}, {"id": "A-geometry_quad_angles-a1", "q": "The four angles of a quadrilateral are in the ratio 2:3:4:6. What is the largest angle?", "o": ["48 deg", "120 deg", "96 deg", "144 deg"], "a": 3, "x": "The angles of a quadrilateral add to 360 deg. The ratio parts total 2+3+4+6 = 15, so one part is 24 deg and the largest angle is 6 x 24 = 144 deg.", "cn": "A quadrilateral's angles add to 360 deg (two triangles). For a parallelogram, adjacent angles add to 180 deg.", "sl": "Authored item for a concept (new construction and wording)", "t": "Angle sum of a quadrilateral"}, {"id": "A-average_new_member-a2", "q": "The average of 4 numbers is 10. When two more numbers, 14 and 18, are added, what is the new average?", "o": ["11", "12", "13", "14"], "a": 1, "x": "The 4 numbers total 4 x 10 = 40. Adding 14 and 18 gives 40 + 32 = 72 across 6 numbers, so the new average is 72/6 = 12.", "cn": "Total = average x count. Find the new total and the new count, then divide.", "sl": "Authored item for a concept (new construction and wording)", "t": "Average after a new value is added"}, {"id": "A-pct_up_down-a2", "q": "After a 10% increase followed by a 10% decrease, the price of a bag is Rs 495. What was the original price?", "o": ["Rs 505", "Rs 500", "Rs 490", "Rs 495"], "a": 1, "x": "The two changes multiply the price by 1.10 x 0.90 = 0.99. So the original price is 495 / 0.99 = Rs 500.", "cn": "Percent changes multiply, so undo them by dividing: original = final / (1.10 x 0.90).", "sl": "Authored item for a concept (new construction and wording)", "t": "Successive increase and decrease"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
