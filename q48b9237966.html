<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Quant practice q48b9237966</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "q48b9237966", "date": "2026-11-24", "type": "QA", "level": 1, "qs": [{"id": "V-ages_ratio_sum-6", "q": "The ages of Meena and Kabir are in the ratio 2 : 5 and their ages add up to 56 years. What will Meena's age be after 6 years?", "o": ["46 years", "22 years", "16 years", "30 years"], "a": 1, "x": "Total parts = 2 + 5 = 7, so one part = 56 / 7 = 8 years. Meena is 2 x 8 = 16 years now, so 16 + 6 = 22 years after 6 years.", "cn": "Split the total in the ratio to get the present ages first, then add the years that pass.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Ages from a ratio and a total"}, {"id": "V-algebra_identity-23", "q": "If x + y = 25 and xy = 150, what is the value of x^2 + y^2?", "o": ["475", "625", "325", "925"], "a": 2, "x": "x^2 + y^2 = (x + y)^2 - 2xy = 25^2 - 2 x 150 = 625 - 300 = 325.", "cn": "Use the identity x^2 + y^2 = (x + y)^2 - 2xy instead of finding x and y separately.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Square of a sum identity"}, {"id": "V-arithmetic_progression-6", "q": "The first term of an arithmetic progression is 8 and the common difference is 9. What is its 10th term?", "o": ["98", "90", "80", "89"], "a": 3, "x": "nth term = a + (n - 1) x d = 8 + (10 - 1) x 9 = 8 + 81 = 89.", "cn": "The nth term of an AP is a + (n-1)d. Count the gaps between terms: there are n-1 of them, not n.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "AP nth term"}, {"id": "V-boats_streams-6", "q": "The speed of a boat in still water is 14 km/h and the speed of the stream is 2 km/h. Find the time taken by the boat to cover 80 km downstream.", "o": ["5 hours", "6.66667 hours", "5.71429 hours", "6 hours"], "a": 0, "x": "Downstream speed = 14 + 2 = 16 km/h. Time = distance / speed = 80 / 16 = 5 hours.", "cn": "Downstream speeds add (boat + stream), upstream speeds subtract. Time = distance / effective speed, not distance / still-water speed.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Downstream time"}, {"id": "V-coordinate_distance-6", "q": "What is the distance between the points (-1, 1) and (-9, 16)?", "o": ["23", "17", "19", "16"], "a": 1, "x": "Distance = root of ((-8)^2 + (15)^2) = root of (64 + 225) = root of 289 = 17.", "cn": "Distance = square root of ((x2 - x1)^2 + (y2 - y1)^2). Signs do not matter after squaring.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Distance between two points"}, {"id": "V-divisibility_check-5", "q": "The four-digit number 157_ is divisible by 11. What digit fills the blank?", "o": ["5", "6", "3", "4"], "a": 2, "x": "Divisibility by 11 needs (sum of odd-place digits) - (sum of even-place digits) to be 0 or a multiple of 11: (1 + 7) - (5 + d) = 3 - d = 0, so d = 3.", "cn": "Divisibility by 9: digit sum divisible by 9. Divisibility by 11: alternating digit sum is 0 or a multiple of 11.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Divisibility by 9 or 11"}, {"id": "V-factor_count-10", "q": "How many positive factors does 392 have?", "o": ["13", "11", "14", "12"], "a": 3, "x": "392 = 2^3 x 7^2. Number of factors = (3 + 1) x (2 + 1) = 12.", "cn": "Write the number in prime factors p^a x q^b; the factor count is (a+1)(b+1). Listing only works for small numbers.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Counting positive factors"}, {"id": "V-geometry_triangle_angles-5", "q": "In triangle ABC, the exterior angle at C is 80 deg and angle A is 40 deg. What is angle B?", "o": ["40 deg", "45 deg", "35 deg", "140 deg"], "a": 0, "x": "An exterior angle equals the sum of the two opposite interior angles: B = 80 - 40 = 40 deg.", "cn": "Interior angles of a triangle add to 180 deg; an exterior angle equals the sum of the two opposite interior angles.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Angle sum of a triangle"}, {"id": "V-inequality_word-4", "q": "A courier charges Rs 30 fixed plus Rs 18 per parcel. With a budget of Rs 282, at most how many parcels are possible?", "o": ["16", "14", "13", "15"], "a": 1, "x": "Fixed + per-unit x n <= budget: 30 + 18n <= 282, so n <= (282 - 30)/18 = 14. Largest whole number: 14.", "cn": "Set up fixed + rate x n <= budget, subtract the fixed part, divide, then take the largest whole number that still fits.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Word problem with an upper limit"}, {"id": "V-logarithm_basic-6", "q": "If log base 5 of x = 2, what is the value of x?", "o": ["25", "7", "10", "125"], "a": 0, "x": "log base 5 of x = 2 means x = 5^2 = 25.", "cn": "log base b of N = the power p with b^p = N.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Evaluate or invert a logarithm"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=async()=>{const b=document.getElementById("copy"),c=document.getElementById("code").textContent;try{await navigator.clipboard.writeText(c);b.textContent="Copied"}catch(e){b.textContent="Copy failed - code selected; copy it manually";const r=document.createRange();r.selectNodeContents(document.getElementById("code"));const s=window.getSelection();s.removeAllRanges();s.addRange(r)}};
</script></body></html>
