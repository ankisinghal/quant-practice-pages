{"id": "V-average_new_member-43", "q": "The average of 4 numbers is 52. When one more number is included, the average rises by 3. What is the number that was included?", "o": ["70", "55", "67", "64"], "a": 2, "x": "New total = (4+1) x (52+3) = 275. Old total = 4 x 52 = 208. The new number is 275 - 208 = 67.", "cn": "Total = average x count. The new value is the new total minus the old total.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Average after a new value is added"},
{"id": "V-pct_up_down-43", "q": "The price of a phone increases by 20% and then decreases by 20%. What is the net percentage change?", "o": ["5% increase", "5% decrease", "3% decrease", "4% decrease"], "a": 3, "x": "Rise 20% then fall 20%: net = 20 - 20 - (20 x 20)/100 = -4%, so a 4% decrease.", "cn": "Percent changes multiply. If a quantity rises by x% and then falls by y% (x and y as positive numbers), net change = x - y - xy/100 percent. With signed changes it is x + y + xy/100.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Successive increase and decrease"},
{"id": "V-pct_markup_discount-43", "q": "A shopkeeper marks a shirt 40% above its cost price and then gives a 10% discount on the marked price. What is the profit percent?", "o": ["30%", "31%", "26%", "21%"], "a": 2, "x": "Take cost = 100. Marked price = 140. Selling price = 140 x 90/100 = 126. Profit = 26%.", "cn": "Successive percentages multiply: they do not add or subtract. Discount is on the marked price, profit is on the cost price.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Mark-up and discount"},
{"id": "V-simple_interest-43", "q": "Rs 2500 is lent at 5% simple interest per annum. Find the interest earned in 4 years.", "o": ["Rs 625", "Rs 500", "Rs 50", "Rs 375"], "a": 1, "x": "SI = P x R x T / 100 = 2500 x 5 x 4 / 100 = Rs 500.", "cn": "Simple interest uses the original principal every year: SI = PRT/100.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Simple interest amount"},
{"id": "V-l0_speed_distance-43", "q": "A train travels at 40 km per hour for 5 hours. How far does it travel?", "o": ["45 km", "200 km", "240 km", "160 km"], "a": 1, "x": "Distance = speed x time = 40 x 5 = 200 km.", "cn": "Distance = speed x time.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Distance = speed x time (L0)"},
{"id": "V-l0_profit_simple-43", "q": "An article bought for Rs 1000 is sold for Rs 1250. What is the profit percent?", "o": ["25%", "35%", "30%", "20%"], "a": 0, "x": "Profit = 1250 - 1000 = 250. Profit percent = 250/1000 x 100 = 25%.", "cn": "Profit percent = profit / cost price x 100 (always on the cost price).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Profit percent, one step (L0)"},
{"id": "V-l0_lcm-43", "q": "Find the LCM of 10 and 15.", "o": ["150", "40", "5", "30"], "a": 3, "x": "Multiples of 10: 10, 20, 30, ... Multiples of 15: 15, 30, ... The smallest common multiple is 30.", "cn": "LCM = the smallest number that both numbers divide into. Do not just multiply the numbers unless they share no factor.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "LCM of two numbers (L0)"},
{"id": "V-algebra_identity-43", "q": "Given a + b = 16 and ab = 63, find a^2 + b^2.", "o": ["382", "130", "193", "256"], "a": 1, "x": "x^2 + y^2 = (x + y)^2 - 2xy = 16^2 - 2 x 63 = 256 - 126 = 130.", "cn": "Use the identity x^2 + y^2 = (x + y)^2 - 2xy instead of finding x and y separately.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Square of a sum identity"},
{"id": "V-quad_root_k-43", "q": "One root of the equation x^2 - 13x + k = 0 is 7. What is the value of k?", "o": ["49", "36", "13", "42"], "a": 3, "x": "Put x = 7: 49 - 91 + k = 0, so k = 42. (The other root is 6, and 7 x 6 = 42.)", "cn": "A root satisfies the equation. Substitute it, or use: product of roots = k, sum of roots = coefficient.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Using a known root of a quadratic"},
