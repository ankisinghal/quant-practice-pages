<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quant practice q4aa0447fc1</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>

<script>const D={"id": "q4aa0447fc1", "date": "2026-10-22", "type": "QA", "level": 0, "qs": [{"id": "V-l0_ratio_share-32", "q": "140 marbles are shared between Imran and Mira in the ratio 4 : 3. How many does Imran get?", "o": ["60", "80", "70", "100"], "a": 1, "x": "Total parts = 4 + 3 = 7. One part = 140 / 7 = 20. Imran gets 4 x 20 = 80.", "cn": "Add the ratio parts, find the value of one part, then multiply.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Sharing in a ratio (L0)"}, {"id": "V-l0_average-32", "q": "Find the average of 44, 30, 40, 42, 44.", "o": ["39", "42", "41", "40"], "a": 3, "x": "Sum = 200. Number of values = 5. Average = 200 / 5 = 40.", "cn": "Average = sum of the values / number of values.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Average of numbers (L0)"}, {"id": "V-l0_profit_simple-32", "q": "An article bought for Rs 800 is sold for Rs 1040. What is the profit percent?", "o": ["25%", "35%", "30%", "40%"], "a": 2, "x": "Profit = 1040 - 800 = 240. Profit percent = 240/800 x 100 = 30%.", "cn": "Profit percent = profit / cost price x 100 (always on the cost price).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Profit percent, one step (L0)"}, {"id": "V-l0_simplify_ratio-32", "q": "Which of these is the ratio 30 : 36 in its simplest form?", "o": ["5 : 6", "5 : 7", "6 : 6", "6 : 5"], "a": 0, "x": "Divide both terms by their highest common factor. HCF of 30 and 36 is 6: 30 / 6 = 5 and 36 / 6 = 6, so 30 : 36 = 5 : 6.", "cn": "A ratio is simplified by dividing both terms by the same number, until no common factor is left.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Simplifying a ratio (L0)"}, {"id": "V-l0_sum_diff-32", "q": "Two numbers add up to 78. Their difference is 14. Find the bigger number.", "o": ["46", "28", "39", "32"], "a": 0, "x": "Larger = (sum + difference) / 2 = (78 + 14) / 2 = 92 / 2 = 46. (Smaller = 46 - 14 = 32.)", "cn": "Larger number = (sum + difference) / 2; smaller = (sum - difference) / 2.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Sum and difference (L0)"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
