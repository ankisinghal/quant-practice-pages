<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quant practice q4f1aa8815e</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Quant practice q4f1aa8815e</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "q4f1aa8815e", "date": "2026-10-22", "type": "QA", "level": 1, "qs": [{"id": "V-time_work_two-33", "q": "A can finish a painting task in 12 days and B can finish it in 18 days. Working together, in how many days will they finish it?", "o": ["8.2 days", "7.2 days", "30 days", "15 days"], "a": 1, "x": "Rates are 1/12 and 1/18 per day. Together 1/12 + 1/18 = 30/216, so the time is 216/30 = 7.2 days.", "cn": "Add the work done per day (rates), not the days. Time together = (a x b)/(a + b).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two workers together"}, {"id": "V-algebra_identity-33", "q": "Given a + b = 13 and ab = 36, find a^2 + b^2.", "o": ["241", "169", "133", "97"], "a": 3, "x": "x^2 + y^2 = (x + y)^2 - 2xy = 13^2 - 2 x 36 = 169 - 72 = 97.", "cn": "Use the identity x^2 + y^2 = (x + y)^2 - 2xy instead of finding x and y separately.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Square of a sum identity"}, {"id": "V-quad_root_k-33", "q": "7 is a root of x^2 - 10x + k = 0. Find k.", "o": ["10", "21", "18", "28"], "a": 1, "x": "Put x = 7: 49 - 70 + k = 0, so k = 21. (The other root is 3, and 7 x 3 = 21.)", "cn": "A root satisfies the equation. Substitute it, or use: product of roots = k, sum of roots = coefficient.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Using a known root of a quadratic"}, {"id": "V-mensuration_rect-33", "q": "The length of a rectangle is 4 times its width. If the perimeter of the rectangle is 70 cm, what is its area?", "o": ["196 sq cm", "49 sq cm", "245 sq cm", "140 sq cm"], "a": 0, "x": "Perimeter = 2 x (length + width) = 2 x (4w + w) = 10w = 70, so width w = 7 cm and length = 28 cm. Area = 28 x 7 = 196 sq cm.", "cn": "Put length and width in terms of one letter, use the perimeter to solve, then multiply for the area.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Rectangle: length as a multiple of width"}, {"id": "V-l0_percent_of-33", "q": "What is 60% of 120?", "o": ["72", "102", "48", "144"], "a": 0, "x": "60% of 120 = 60/100 x 120 = 72.", "cn": "Percent means per hundred: p% of n = p/100 x n.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Percentage of a number (L0)"}, {"id": "V-l0_ratio_share-33", "q": "150 pencils are shared between Mira and Ravi in the ratio 4 : 1. How many does Mira get?", "o": ["75", "150", "120", "30"], "a": 2, "x": "Total parts = 4 + 1 = 5. One part = 150 / 5 = 30. Mira gets 4 x 30 = 120.", "cn": "Add the ratio parts, find the value of one part, then multiply.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Sharing in a ratio (L0)"}, {"id": "V-l0_average-33", "q": "Find the average of 28, 28, 42, 38.", "o": ["35", "33", "36", "34"], "a": 3, "x": "Sum = 136. Number of values = 4. Average = 136 / 4 = 34.", "cn": "Average = sum of the values / number of values.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Average of numbers (L0)"}, {"id": "V-l0_speed_distance-33", "q": "A cyclist travels at 18 km per hour for 4 hours. How far does it travel?", "o": ["22 km", "90 km", "54 km", "72 km"], "a": 3, "x": "Distance = speed x time = 18 x 4 = 72 km.", "cn": "Distance = speed x time.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Distance = speed x time (L0)"}, {"id": "V-l0_profit_simple-33", "q": "An article bought for Rs 800 is sold for Rs 1040. What is the profit percent?", "o": ["35%", "30%", "25%", "40%"], "a": 1, "x": "Profit = 1040 - 800 = 240. Profit percent = 240/800 x 100 = 30%.", "cn": "Profit percent = profit / cost price x 100 (always on the cost price).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Profit percent, one step (L0)"}, {"id": "V-ages_ratio_sum-33", "q": "The ages of Meena and Ravi are in the ratio 2 : 3 and their ages add up to 40 years. What will Meena's age be after 4 years?", "o": ["20 years", "12 years", "28 years", "16 years"], "a": 0, "x": "Total parts = 2 + 3 = 5, so one part = 40 / 5 = 8 years. Meena is 2 x 8 = 16 years now, so 16 + 4 = 20 years after 4 years.", "cn": "Split the total in the ratio to get the present ages first, then add the years that pass.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Ages from a ratio and a total"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
