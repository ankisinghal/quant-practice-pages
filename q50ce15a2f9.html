<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quant practice q50ce15a2f9</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Quant practice q50ce15a2f9</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "q50ce15a2f9", "date": "2026-11-09", "type": "QA", "level": 1, "qs": [{"id": "A-trains_cross_pole-r2", "q": "A train running at 126 km/h crosses a pole in 5 seconds. Running at 90 km/h, how long will the same train take to cross a pole?", "o": ["7 s", "3.5 s", "5 s", "6 s"], "a": 0, "x": "At 126 km/h = 35 m/s, the train's length is 35 x 5 = 175 m. At 90 km/h = 25 m/s, crossing time = 175 / 25 = 7 s.", "cn": "A pole crossing covers exactly the train's own length. Find the length from the first run, then divide it by the second speed.", "sl": "Original practice item", "t": "Train passing a pole"}, {"id": "A-logarithm_basic-r1", "q": "If log base 2 of 3 is approximately 1.585, what is the value of log base 2 of 81?", "o": ["6.34", "3.17", "4.755", "7.925"], "a": 0, "x": "81 = 3^4, so log base 2 of 81 = 4 x log base 2 of 3 = 4 x 1.585 = 6.34.", "cn": "Use the power rule: 81 is 3^4, so its log is 4 times the log of 3.", "sl": "Original practice item", "t": "Logarithms"}, {"id": "A-word_arrangements-r1", "q": "In how many different ways can the letters of the word SCHOOL be arranged?", "o": ["720", "120", "240", "360"], "a": 3, "x": "SCHOOL has 6 letters with O repeated twice, so arrangements = 6! / 2! = 720 / 2 = 360.", "cn": "When letters repeat, divide the total arrangements by the factorial of each repeat count.", "sl": "Original practice item", "t": "Arrangements of letters"}, {"id": "V-remainder_basic-4", "q": "What is the remainder when 39 x 29 is divided by 13?", "o": ["2", "0", "1", "6"], "a": 1, "x": "Remainders multiply: 39 = 13 x 3 + 0 and 29 = 13 x 2 + 3. So the remainder is (0 x 3) mod 13 = 0 mod 13 = 0.", "cn": "Work with remainders first: the remainder of a sum or product is the remainder of the remainders' sum or product.", "sl": "Original practice item", "t": "Remainder of a sum or product"}, {"id": "V-factor_count-6", "q": "How many positive factors does 135 have?", "o": ["10", "9", "8", "7"], "a": 2, "x": "135 = 3^3 x 5^1. Number of factors = (3 + 1) x (1 + 1) = 8.", "cn": "Write the number in prime factors p^a x q^b; the factor count is (a+1)(b+1). Listing only works for small numbers.", "sl": "Original practice item", "t": "Counting positive factors"}, {"id": "A-time_work_two-r2", "q": "Neha can knit a shawl in 21 days and Kabir can knit it in 28 days. Working together, in how many days will they finish it?", "o": ["14 days", "24 days", "10 days", "12 days"], "a": 3, "x": "Rates are 1/21 and 1/28 per day. Together 1/21 + 1/28 = 7/84 = 1/12, so the time is 12 days.", "cn": "Add the two daily rates, then flip the combined rate to get the time.", "sl": "Original practice item", "t": "Two workers together"}, {"id": "V-algebra_identity-10", "q": "If x + y = 24 and xy = 140, what is the value of x^2 + y^2?", "o": ["296", "576", "436", "856"], "a": 0, "x": "x^2 + y^2 = (x + y)^2 - 2xy = 24^2 - 2 x 140 = 576 - 280 = 296.", "cn": "Use the identity x^2 + y^2 = (x + y)^2 - 2xy instead of finding x and y separately.", "sl": "Original practice item", "t": "Square of a sum identity"}, {"id": "V-boats_streams-4", "q": "The speed of a boat in still water is 12 km/h and the speed of the stream is 4 km/h. Find the time taken by the boat to cover 96 km downstream.", "o": ["7 hours", "6 hours", "12 hours", "8 hours"], "a": 1, "x": "Downstream speed = 12 + 4 = 16 km/h. Time = distance / speed = 96 / 16 = 6 hours.", "cn": "Downstream speeds add (boat + stream), upstream speeds subtract. Time = distance / effective speed, not distance / still-water speed.", "sl": "Original practice item", "t": "Downstream time"}, {"id": "V-divisibility_check-4", "q": "The four-digit number 853_ is divisible by 11. What digit fills the blank?", "o": ["7", "8", "6", "9"], "a": 2, "x": "Divisibility by 11 needs (sum of odd-place digits) - (sum of even-place digits) to be 0 or a multiple of 11: (8 + 3) - (5 + d) = 6 - d = 0, so d = 6.", "cn": "Divisibility by 9: digit sum divisible by 9. Divisibility by 11: alternating digit sum is 0 or a multiple of 11.", "sl": "Original practice item", "t": "Divisibility by 9 or 11"}, {"id": "V-linear_inequality_one-4", "q": "Solve for x: 5x - 9 > 16.", "o": ["x > 6", "x > 4", "x < 5", "x > 5"], "a": 3, "x": "Add 9 to both sides: 5x > 25. Divide by 5: x > 5. Dividing by a positive number keeps the sign.", "cn": "Move constants to one side, divide by the coefficient, and flip the sign ONLY when multiplying or dividing by a negative.", "sl": "Original practice item", "t": "Solve a linear inequality"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
