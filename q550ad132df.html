<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quant practice q550ad132df</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Quant practice q550ad132df</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "q550ad132df", "date": "2026-10-23", "type": "QA", "level": 1, "qs": [{"id": "V-trains_cross_pole-34", "q": "How long does a train 480 m long, moving at 108 km/h, take to cross a lamp post?", "o": ["32 seconds", "18 seconds", "16 seconds", "14 seconds"], "a": 2, "x": "Speed = 108 km/h = 108 x 5/18 = 30 m/s. Time to pass a pole = length / speed = 480 / 30 = 16 seconds.", "cn": "Passing a pole means covering the train's own length. Convert km/h to m/s by multiplying by 5/18.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Train passing a pole"}, {"id": "V-boats_streams-34", "q": "A steamer can travel at 8 km/h in still water. If the speed of the stream is 4 km/h, how many hours will it take to go 24 km downstream?", "o": ["6 hours", "2 hours", "3 hours", "2.5 hours"], "a": 1, "x": "Downstream speed = 8 + 4 = 12 km/h. Time = distance / speed = 24 / 12 = 2 hours.", "cn": "Downstream speeds add (boat + stream), upstream speeds subtract. Time = distance / effective speed, not distance / still-water speed.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Downstream time"}, {"id": "V-arithmetic_progression-34", "q": "The first term of an arithmetic progression is 9 and the common difference is 4. What is its 15th term?", "o": ["69", "61", "65", "66"], "a": 2, "x": "nth term = a + (n - 1) x d = 9 + (15 - 1) x 4 = 9 + 56 = 65.", "cn": "The nth term of an AP is a + (n-1)d. Count the gaps between terms: there are n-1 of them, not n.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "AP nth term"}, {"id": "V-geometric_progression-34", "q": "The first term of a geometric progression is 2 and the common ratio is 2. What is its 5th term?", "o": ["34", "16", "64", "32"], "a": 3, "x": "nth term = a x r^(n-1) = 2 x 2^(5-1) = 2 x 16 = 32.", "cn": "The nth term of a GP is a x r^(n-1). The exponent is n-1, one less than the position.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "GP nth term"}, {"id": "V-logarithm_basic-34", "q": "If log base 2 of x = 6, what is the value of x?", "o": ["128", "64", "12", "8"], "a": 1, "x": "log base 2 of x = 6 means x = 2^6 = 64.", "cn": "log base b of N = the power p with b^p = N.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Evaluate or invert a logarithm"}, {"id": "V-surds_indices-34", "q": "Simplify: 3^5 x 3^2 / 3^2", "o": ["2187", "729", "243", "81"], "a": 2, "x": "Add powers on multiplying, subtract on dividing: 3^(5 + 2 - 2) = 3^5 = 243.", "cn": "Same base: a^m x a^n = a^(m+n) and a^m / a^n = a^(m-n). Do the powers step by step.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Product and quotient of powers"}, {"id": "V-coordinate_distance-34", "q": "What is the distance between the points (4, -3) and (8, -6)?", "o": ["5", "4", "7", "10"], "a": 0, "x": "Distance = root of ((4)^2 + (-3)^2) = root of (16 + 9) = root of 25 = 5.", "cn": "Distance = square root of ((x2 - x1)^2 + (y2 - y1)^2). Signs do not matter after squaring.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Distance between two points"}, {"id": "V-races-34", "q": "In a 100 m race, A beats B by 10 m and B beats C by 20 m. By how many metres does A beat C in the same race?", "o": ["30 m", "29 m", "33 m", "28 m"], "a": 3, "x": "When A runs 100 m, B runs 90 m. When B runs 100 m, C runs 80 m, so C runs (90) x (80) / 100 = 72 m when A runs 100 m. A beats C by 100 - 72 = 28 m.", "cn": "Do not add the margins. Chain the distances: C covers (D - x) x (D - y) / D in the time A covers D.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "A beats B, B beats C"}, {"id": "V-function_evaluation-34", "q": "If f(x) = 6x + 4, what is the value of f(6)?", "o": ["37", "45", "44", "40"], "a": 3, "x": "f(6) = 6 x 6 + 4 = 36 + 4 = 40.", "cn": "Substitute the number for x everywhere and follow the order of operations.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Evaluate f(x) at a point"}, {"id": "V-statistics_median-34", "q": "Find the median of the data: 53, 60, 48, 58, 24, 43, 27.", "o": ["48", "46", "45", "50"], "a": 0, "x": "Arrange in order: 24, 27, 43, 48, 53, 58, 60. The middle (4th) value is 48.", "cn": "Median = the middle value after arranging in order. With an odd count it is the single middle value.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Median of a data set"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
