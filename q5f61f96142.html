<script>const D={"id":"q5f61f96142","date":"2026-11-19","type":"QA","level":1,"qs":[{"id":"A-remainder_basic-r20261119","q":"When a positive integer N is divided by 7, the remainder is 3. What is the remainder when 4N is divided by 7?","o":["2","5","4","6"],"a":1,"x":"If N leaves remainder 3 on division by 7, then 4N leaves the same remainder as 4 x 3 = 12. Since 12 = 7 + 5, the remainder is 5.","cn":"Use the stated conditions.","sl":"Original practice item","t":"remainder_basic"},{"id":"A-compound_interest_2yr-r20261119","q":"A sum of Rs 20,000 is invested at compound interest, compounded annually. The rate is 5% for the first year and 10% for the second year. How much interest is earned during the second year alone?","o":["Rs 2,000","Rs 3,000","Rs 3,100","Rs 2,100"],"a":3,"x":"After one year the amount is 20000 x 1.05 = 21000. The second-year interest is 10% of that amount: 21000 x 0.10 = Rs 2100.","cn":"Use the stated conditions.","sl":"Original practice item","t":"compound_interest_2yr"},{"id":"A-linear_inequality_one-r20261119","q":"What is the largest integer x that satisfies 5x + 4 < 39?","o":["5","7","6","8"],"a":2,"x":"Subtract 4 to get 5x < 35, so x < 7. The largest integer less than 7 is 6.","cn":"Use the stated conditions.","sl":"Original practice item","t":"linear_inequality_one"},{"id":"A-geometry_quad_angles-r20261119","q":"In convex quadrilateral ABCD, diagonal AC makes angle BAC = 41\u00b0, angle CAD = 54\u00b0, angle BCA = 59\u00b0 and angle ACD = 52\u00b0. Angle ABC is 80\u00b0. What is angle ADC?","o":["74\u00b0","70\u00b0","78\u00b0","84\u00b0"],"a":0,"x":"In triangle ABC, 41+59+80=180\u00b0. In triangle ACD, angle ADC = 180-54-52 = 74\u00b0. The quadrilateral angles are A=95\u00b0, B=80\u00b0, C=111\u00b0 and D=74\u00b0, totaling 360\u00b0.","cn":"Use the stated conditions.","sl":"Original practice item","t":"geometry_quad_angles"},{"id":"A-trains_cross_pole-r20261119","q":"A train 280 m long passes a lamp post in 14 seconds. At the same speed, how long does it take to cross a 420 m platform completely?","o":["21 seconds","35 seconds","28 seconds","49 seconds"],"a":1,"x":"Passing the lamp post means the train covers 280 m, so its speed is 280/14 = 20 m/s. To cross the platform completely it covers 280+420 = 700 m, taking 700/20 = 35 seconds.","cn":"Use the stated conditions.","sl":"Original practice item","t":"trains_cross_pole"},{"id":"A-pipes_cistern_two-r20261119","q":"Pipe A can fill a tank in 8 hours. Pipe B can empty the full tank in 12 hours. With both pipes open, what fraction of the tank remains empty after 2 hours?","o":["11/12","1/12","5/6","7/12"],"a":0,"x":"The net fill rate is 1/8 - 1/12 = 1/24 of the tank per hour. In 2 hours, 1/12 is filled, so 11/12 remains empty.","cn":"Use the stated conditions.","sl":"Original practice item","t":"pipes_cistern_two"},{"id":"A-boats_streams-r20261119","q":"A boat travels at 14 km/h in still water and the stream flows at 2 km/h. The boat goes 32 km downstream and then 24 km upstream. What is the total travel time?","o":["3.5 hours","4.5 hours","4 hours","5 hours"],"a":2,"x":"Downstream speed is 16 km/h, taking 32/16 = 2 hours. Upstream speed is 12 km/h, taking 24/12 = 2 hours. Total time is 4 hours.","cn":"Use the stated conditions.","sl":"Original practice item","t":"boats_streams"},{"id":"A-average_new_member-r20261119","q":"The average score of 11 students is 72. After one student leaves, the average score of the remaining 10 students is 70. What was the score of the student who left?","o":["80","82","90","92"],"a":3,"x":"The original total is 11 x 72 = 792. The remaining total is 10 x 70 = 700. The student who left scored 792-700 = 92.","cn":"Use the stated conditions.","sl":"Original practice item","t":"average_new_member"},{"id":"A-factor_count-r20261119","q":"What is the sum of all the positive even factors of 72?","o":["182","168","180","194"],"a":0,"x":"The positive even factors of 72 are 2, 4, 6, 8, 12, 18, 24, 36 and 72. Their sum is 182.","cn":"Use the stated conditions.","sl":"Original practice item","t":"factor_count"},{"id":"A-races-r20261119","q":"In a 600 m race, A beats B by 60 m. In a separate 500 m race, B beats C by 50 m. If A and C start a 600 m race together and run at the same relative speeds, how far has C run when A finishes?","o":["480 m","486 m","490 m","500 m"],"a":1,"x":"When A runs 600 m, B runs 540 m. B and C cover distances in the ratio 500:450 = 10:9, so when B has run 540 m, C has run 486 m.","cn":"Use the stated conditions.","sl":"Original practice item","t":"races"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
