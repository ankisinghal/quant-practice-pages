<script>const D={"id":"q60184e628e","date":"2026-11-23","type":"QA","level":1,"qs":[{"id":"A-arithmetic_progression-r20261123","q":"In an arithmetic progression, the 4th term is 17 and the 9th term is 42. What is the 13th term?","o":["57","60","61","62"],"a":3,"x":"The common difference is (42 - 17)/(9 - 4) = 5. The 13th term is 17 + 9 x 5 = 62.","cn":"Use the stated conditions.","sl":"Original practice item","t":"arithmetic_progression"},{"id":"A-decimal_fraction-r20261123","q":"A team won 0.64 of its 50 matches. How many matches did it win?","o":["32","28","30","34"],"a":0,"x":"0.64 of 50 is 0.64 x 50 = 32 matches.","cn":"Use the stated conditions.","sl":"Original practice item","t":"decimal_fraction"},{"id":"A-ratio_share-r20261123","q":"Divide Rs 1,782 among A, B and C in the ratio 2 : 3 : 4. What is B's share?","o":["Rs 396","Rs 594","Rs 495","Rs 792"],"a":1,"x":"The ratio has 9 parts, so one part is 1782/9 = 198. B receives 3 x 198 = 594.","cn":"Use the stated conditions.","sl":"Original practice item","t":"ratio_share"},{"id":"A-geometry_quad_angles-r20261123","q":"Three angles of a quadrilateral are 78\u00b0, 112\u00b0 and 96\u00b0. What is the fourth angle?","o":["64\u00b0","84\u00b0","74\u00b0","94\u00b0"],"a":2,"x":"The angles of a quadrilateral total 360 degrees, so the fourth angle is 360 - (78 + 112 + 96) = 74 degrees.","cn":"Use the stated conditions.","sl":"Original practice item","t":"geometry_quad_angles"},{"id":"A-time_work_two-r20261123","q":"A can complete a job in 12 days and B can complete it in 18 days. They work together for 4 days, after which A leaves. How many more days does B need to finish the job?","o":["8","6","7","9"],"a":0,"x":"In 4 days they complete 4 x (1/12 + 1/18) = 5/9 of the job. B completes the remaining 4/9 at 1/18 per day, taking (4/9)/(1/18) = 8 days.","cn":"Use the stated conditions.","sl":"Original practice item","t":"time_work_two"},{"id":"A-probability_bag-r20261123","q":"A bag contains 5 red balls and 4 blue balls. Two balls are drawn at random without replacement. What is the probability that both are blue?","o":["1/9","5/36","2/9","1/6"],"a":3,"x":"The probability is (4/9) x (3/8) = 12/72 = 1/6.","cn":"Use the stated conditions.","sl":"Original practice item","t":"probability_bag"},{"id":"A-profit_loss_percent-r20261123","q":"An article costing Rs 640 is sold at a profit of 12.5%. What is the selling price?","o":["Rs 704","Rs 712","Rs 720","Rs 728"],"a":2,"x":"Profit = 12.5% of 640 = 80. Selling price = 640 + 80 = 720.","cn":"Use the stated conditions.","sl":"Original practice item","t":"profit_loss_percent"},{"id":"A-probability_dice-r20261123","q":"Two fair dice are rolled. What is the probability that the sum is less than 5?","o":["1/9","1/6","1/8","2/9"],"a":1,"x":"The favorable sums are 2, 3 and 4, with 1 + 2 + 3 = 6 outcomes out of 36. The probability is 6/36 = 1/6.","cn":"Use the stated conditions.","sl":"Original practice item","t":"probability_dice"},{"id":"A-remainder_basic-r20261123","q":"What is the remainder when 5^4 + 4^3 is divided by 7?","o":["1","2","3","5"],"a":2,"x":"5^4 = 625 and 4^3 = 64. Their sum is 689, and 689 = 7 x 98 + 3, so the remainder is 3.","cn":"Use the stated conditions.","sl":"Original practice item","t":"remainder_basic"},{"id":"A-l0_square_root-r20261123","q":"If 5 is added to the square root of x, the result is 14. What is the value of x?","o":["81","64","72","100"],"a":0,"x":"The square root of x is 14 - 5 = 9, so x = 9^2 = 81.","cn":"Use the stated conditions.","sl":"Original practice item","t":"l0_square_root"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
