<script>const D={"id": "q61ad484e9a", "date": "2026-11-05", "type": "QA", "level": 1, "qs": [{"id": "V-profit_loss_percent-93", "q": "A shopkeeper buys a bag for Rs 1500 and sells it for Rs 1800. What is the profit percent?", "o": ["20%", "15%", "25%", "16.6667%"], "a": 0, "x": "Profit = 1800 - 1500 = 300. Profit percent = 300 / 1500 x 100 = 20%.", "cn": "Profit percent is always on the cost price, not on the selling price. Divide the gain by the cost and multiply by 100.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Profit percent on cost"}, {"id": "V-remainder_basic-91", "q": "What is the remainder when 47 x 48 is divided by 13?", "o": ["8", "9", "6", "7"], "a": 3, "x": "Remainders multiply: 47 = 13 x 3 + 8 and 48 = 13 x 3 + 9. So the remainder is (8 x 9) mod 13 = 72 mod 13 = 7.", "cn": "Work with remainders first: the remainder of a sum or product is the remainder of the remainders' sum or product.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Remainder of a sum or product"}, {"id": "V-divisibility_check-93", "q": "The four-digit number 715_ is divisible by 11. What digit fills the blank?", "o": ["1", "2", "0", "3"], "a": 2, "x": "Divisibility by 11 needs (sum of odd-place digits) - (sum of even-place digits) to be 0 or a multiple of 11: (7 + 5) - (1 + d) = 11 - d = 0, so d = 0.", "cn": "Divisibility by 9: digit sum divisible by 9. Divisibility by 11: alternating digit sum is 0 or a multiple of 11.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Divisibility by 9 or 11"}, {"id": "V-factor_count-91", "q": "How many positive factors does 441 have?", "o": ["11", "10", "9", "8"], "a": 2, "x": "441 = 3^2 x 7^2. Number of factors = (2 + 1) x (2 + 1) = 9.", "cn": "Write the number in prime factors p^a x q^b; the factor count is (a+1)(b+1). Listing only works for small numbers.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Counting positive factors"}, {"id": "V-linear_inequality_one-91", "q": "Solve for x: 3x - 7 < 17.", "o": ["x < 9", "x < 8", "x > 8", "x < 7"], "a": 1, "x": "Add 7 to both sides: 3x < 24. Divide by 3: x < 8. Dividing by a positive number keeps the sign.", "cn": "Move constants to one side, divide by the coefficient, and flip the sign ONLY when multiplying or dividing by a negative.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Solve a linear inequality"}, {"id": "V-geometry_triangle_angles-94", "q": "In triangle ABC, angle A = 70 deg and angle B = 45 deg. What is angle C?", "o": ["60 deg", "65 deg", "115 deg", "70 deg"], "a": 1, "x": "Angles of a triangle add to 180 deg: C = 180 - 70 - 45 = 65 deg.", "cn": "Interior angles of a triangle add to 180 deg; an exterior angle equals the sum of the two opposite interior angles.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Angle sum of a triangle"}, {"id": "V-time_work_two-94", "q": "A can finish a job in 20 days and B can finish it in 30 days. Working together, in how many days will they finish it?", "o": ["25 days", "50 days", "12 days", "13 days"], "a": 2, "x": "Rates are 1/20 and 1/30 per day. Together 1/20 + 1/30 = 50/600, so the time is 600/50 = 12 days.", "cn": "Add the work done per day (rates), not the days. Time together = (a x b)/(a + b).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two workers together"}, {"id": "V-algebra_identity-91", "q": "Given a + b = 23 and ab = 132, find a^2 + b^2.", "o": ["265", "529", "793", "397"], "a": 0, "x": "x^2 + y^2 = (x + y)^2 - 2xy = 23^2 - 2 x 132 = 529 - 264 = 265.", "cn": "Use the identity x^2 + y^2 = (x + y)^2 - 2xy instead of finding x and y separately.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Square of a sum identity"}, {"id": "V-boats_streams-91", "q": "The speed of a boat in still water is 20 km/h and the speed of the stream is 4 km/h. Find the time taken by the boat to cover 48 km downstream.", "o": ["3 hours", "2.5 hours", "2.4 hours", "2 hours"], "a": 3, "x": "Downstream speed = 20 + 4 = 24 km/h. Time = distance / speed = 48 / 24 = 2 hours.", "cn": "Downstream speeds add (boat + stream), upstream speeds subtract. Time = distance / effective speed, not distance / still-water speed.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Downstream time"}, {"id": "V-races-93", "q": "In a 400 m race, A beats B by 40 m and B beats C by 20 m. By how many metres does A beat C in the same race?", "o": ["59 m", "58 m", "63 m", "60 m"], "a": 1, "x": "When A runs 400 m, B runs 360 m. When B runs 400 m, C runs 380 m, so C runs (360) x (380) / 400 = 342 m when A runs 400 m. A beats C by 400 - 342 = 58 m.", "cn": "Do not add the margins. Chain the distances: C covers (D - x) x (D - y) / D in the time A covers D.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "A beats B, B beats C"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
