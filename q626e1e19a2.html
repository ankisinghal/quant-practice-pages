<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quant practice q626e1e19a2</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Quant practice q626e1e19a2</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "q626e1e19a2", "date": "2026-11-19", "type": "QA", "level": 1, "qs": [{"id": "V-l0_percent_of-26", "q": "What is 50% of 60?", "o": ["55", "60", "30", "40"], "a": 2, "x": "50% of 60 = 50/100 x 60 = 30.", "cn": "Percent means per hundred: p% of n = p/100 x n.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Percentage of a number (L0)"}, {"id": "V-l0_speed_distance-28", "q": "A car travels at 72 km per hour for 4 hours. How far does it travel?", "o": ["360 km", "216 km", "76 km", "288 km"], "a": 3, "x": "Distance = speed x time = 72 x 4 = 288 km.", "cn": "Distance = speed x time.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Distance = speed x time (L0)"}, {"id": "V-l0_profit_simple-50", "q": "An article bought for Rs 200 is sold for Rs 250. What is the profit percent?", "o": ["30%", "25%", "35%", "20%"], "a": 1, "x": "Profit = 250 - 200 = 50. Profit percent = 50/200 x 100 = 25%.", "cn": "Profit percent = profit / cost price x 100 (always on the cost price).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Profit percent, one step (L0)"}, {"id": "V-pct_markup_discount-28", "q": "A shopkeeper marks a watch 30% above its cost price and then gives a 15% discount on the marked price. What is the profit percent?", "o": ["10.5%", "15%", "15.5%", "5.5%"], "a": 0, "x": "Take cost = 100. Marked price = 130. Selling price = 130 x 85/100 = 110.5. Profit = 10.5%.", "cn": "Successive percentages multiply: they do not add or subtract. Discount is on the marked price, profit is on the cost price.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Mark-up and discount"}, {"id": "V-algebra_identity-21", "q": "Given a + b = 22 and ab = 120, find a^2 + b^2.", "o": ["364", "484", "244", "724"], "a": 2, "x": "x^2 + y^2 = (x + y)^2 - 2xy = 22^2 - 2 x 120 = 484 - 240 = 244.", "cn": "Use the identity x^2 + y^2 = (x + y)^2 - 2xy instead of finding x and y separately.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Square of a sum identity"}, {"id": "V-mixture_add_water-23", "q": "A 40 litre mixture has milk and water in the ratio 4 : 1. How many litres of water must be added to make the ratio 1 : 1?", "o": ["24 litres", "26 litres", "22 litres", "28 litres"], "a": 0, "x": "Milk = 32 L and water = 8 L. For 1 : 1 the water must also be 32 L, so add 32-8 = 24 L.", "cn": "Adding water does not change the other part. Keep it fixed and make the other part equal to it.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Adding to change a ratio"}, {"id": "V-quad_root_k-19", "q": "One root of the equation x^2 - 12x + k = 0 is 7. What is the value of k?", "o": ["42", "35", "30", "12"], "a": 1, "x": "Put x = 7: 49 - 84 + k = 0, so k = 35. (The other root is 5, and 7 x 5 = 35.)", "cn": "A root satisfies the equation. Substitute it, or use: product of roots = k, sum of roots = coefficient.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Using a known root of a quadratic"}, {"id": "V-l0_area_rect-23", "q": "A sheet of paper is 24 cm long and 9 cm wide. What is its area?", "o": ["432 sq cm", "66 sq cm", "33 sq cm", "216 sq cm"], "a": 3, "x": "Area of a rectangle = length x width = 24 x 9 = 216 sq cm.", "cn": "Area of a rectangle = length x width. Perimeter is a different thing (the distance around).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Area of a rectangle (L0)"}, {"id": "V-l0_simple_interest-21", "q": "What is the simple interest on Rs 3000 at 5% per year for 2 years?", "o": ["Rs 150", "Rs 3300", "Rs 300", "Rs 600"], "a": 2, "x": "Simple interest = P x R x T / 100 = 3000 x 5 x 2 / 100 = Rs 300.", "cn": "Simple interest = principal x rate x time / 100. It is the interest only, not the total amount.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Simple interest, one step (L0)"}, {"id": "A-l0_lcm-an20261119-1", "q": "Along a walking trail, distance markers are placed every 14 m and water stations are placed every 35 m, with both kinds at the start. What is the smallest positive distance from the start where a distance marker and a water station are at the same place?", "o": ["49 m", "70 m", "35 m", "140 m"], "a": 1, "x": "The distance must be a common multiple of 14 and 35. LCM(14,35)=70, so the first shared location is 70 m from the start.", "cn": "LCM = the smallest number that both numbers divide into. Do not just multiply the numbers unless they share no factor.", "sl": "Original practice item", "t": "LCM of two numbers (L0)"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=async()=>{const b=document.getElementById("copy"),c=document.getElementById("code").textContent;try{await navigator.clipboard.writeText(c);b.textContent="Copied"}catch(e){b.textContent="Copy failed - code selected; copy it manually";const r=document.createRange();r.selectNodeContents(document.getElementById("code"));const s=window.getSelection();s.removeAllRanges();s.addRange(r)}};
</script></body></html>
