<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quant practice q692b331170</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Quant practice q692b331170</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "q692b331170", "date": "2026-10-25", "type": "QA", "level": 1, "qs": [{"id": "V-units_digit-35", "q": "Find the last digit of 2 raised to the power 34.", "o": ["4", "3", "2", "1"], "a": 0, "x": "Units digits of powers of 2 repeat as 2, 4, 8, 6. 34 divided by 4 leaves remainder 2; a remainder of 2 means place 2 of the cycle, so the digit is 4.", "cn": "Units digits of powers repeat in a short cycle. Find the remainder of the power divided by the cycle length.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Units digit of a power"}, {"id": "V-time_work_two-135", "q": "A tap can finish a tank in 8 days and another tap can finish it in 12 days. Working together, in how many days will they finish it?", "o": ["5.8 days", "10 days", "4.8 days", "20 days"], "a": 2, "x": "Rates are 1/8 and 1/12 per day. Together 1/8 + 1/12 = 20/96, so the time is 96/20 = 4.8 days.", "cn": "Add the work done per day (rates), not the days. Time together = (a x b)/(a + b).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two workers together"}, {"id": "V-partnership_two-35", "q": "A and B started a business investing Rs 12000 and Rs 28000. Out of a total profit of Rs 4000, what is A's share?", "o": ["Rs 2000", "Rs 1200", "Rs 1600", "Rs 2800"], "a": 1, "x": "Both investments run for the same period, so the profit is shared in the ratio 3 : 7. A's share = 4000 x 3/10 = Rs 1200.", "cn": "When money is invested for the same time, profit is divided in the ratio of the investments.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Sharing a profit in the ratio of investments"}, {"id": "V-profit_loss_percent-35", "q": "Riya buys a table for Rs 700 and sells it for Rs 910. Find her profit percent.", "o": ["23.0769%", "35%", "25%", "30%"], "a": 3, "x": "Profit = 910 - 700 = 210. Profit percent = 210 / 700 x 100 = 30%.", "cn": "Profit percent is always on the cost price, not on the selling price. Divide the gain by the cost and multiply by 100.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Profit percent on cost"}, {"id": "V-arithmetic_progression-35", "q": "In the AP 5, 8, 11, ..., which term is in position 12?", "o": ["35", "39", "38", "41"], "a": 2, "x": "nth term = a + (n - 1) x d = 5 + (12 - 1) x 3 = 5 + 33 = 38.", "cn": "The nth term of an AP is a + (n-1)d. Count the gaps between terms: there are n-1 of them, not n.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "AP nth term"}, {"id": "V-geometric_progression-35", "q": "In the GP 5, 10, 20, ..., which term is in position 6?", "o": ["160", "320", "50", "80"], "a": 0, "x": "nth term = a x r^(n-1) = 5 x 2^(6-1) = 5 x 32 = 160.", "cn": "The nth term of a GP is a x r^(n-1). The exponent is n-1, one less than the position.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "GP nth term"}, {"id": "V-logarithm_basic-35", "q": "If log base 3 of x = 5, what is the value of x?", "o": ["15", "8", "243", "729"], "a": 2, "x": "log base 3 of x = 5 means x = 3^5 = 243.", "cn": "log base b of N = the power p with b^p = N.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Evaluate or invert a logarithm"}, {"id": "V-surds_indices-35", "q": "What is the value of (5^4 x 5^5) / 5^1?", "o": ["78125", "390625", "15625", "1953125"], "a": 1, "x": "Add powers on multiplying, subtract on dividing: 5^(4 + 5 - 1) = 5^8 = 390625.", "cn": "Same base: a^m x a^n = a^(m+n) and a^m / a^n = a^(m-n). Do the powers step by step.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Product and quotient of powers"}, {"id": "V-coordinate_distance-35", "q": "What is the distance between the points (-4, 2) and (-1, -2)?", "o": ["5", "7", "4", "10"], "a": 0, "x": "Distance = root of ((3)^2 + (-4)^2) = root of (9 + 16) = root of 25 = 5.", "cn": "Distance = square root of ((x2 - x1)^2 + (y2 - y1)^2). Signs do not matter after squaring.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Distance between two points"}, {"id": "V-races-35", "q": "In a 100 m race, A beats B by 10 m and B beats C by 10 m. By how many metres does A beat C in the same race?", "o": ["20 m", "19 m", "14 m", "24 m"], "a": 1, "x": "When A runs 100 m, B runs 90 m. When B runs 100 m, C runs 90 m, so C runs (90) x (90) / 100 = 81 m when A runs 100 m. A beats C by 100 - 81 = 19 m.", "cn": "Do not add the margins. Chain the distances: C covers (D - x) x (D - y) / D in the time A covers D.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "A beats B, B beats C"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
