<script>const D={"id":"q69d9cc8666","date":"2026-11-20","type":"QA","level":1,"qs":[{"id":"A-remainder_basic-r20261120","q":"When a positive integer N is divided by 9, the remainder is 5. What is the remainder when 7N is divided by 9?","o":["2","5","6","8"],"a":3,"x":"If N leaves remainder 5 on division by 9, then 7N leaves the same remainder as 7 x 5 = 35. Since 35 = 27 + 8, the remainder is 8.","cn":"Use the stated conditions.","sl":"Original practice item","t":"remainder_basic"},{"id":"A-compound_interest_2yr-r20261120","q":"A sum of Rs 30,000 is invested at compound interest, compounded annually. The rate is 8% for the first year and 5% for the second year. How much interest is earned during the second year alone?","o":["Rs 1,500","Rs 1,620","Rs 1,600","Rs 2,400"],"a":1,"x":"After one year the amount is 30000 x 1.08 = 32400. The second-year interest is 5% of that amount: 32400 x 0.05 = Rs 1620.","cn":"Use the stated conditions.","sl":"Original practice item","t":"compound_interest_2yr"},{"id":"A-linear_inequality_one-r20261120","q":"What is the largest integer x that satisfies 7x - 5 < 44?","o":["5","7","6","8"],"a":2,"x":"Add 5 to get 7x < 49, so x < 7. The largest integer less than 7 is 6.","cn":"Use the stated conditions.","sl":"Original practice item","t":"linear_inequality_one"},{"id":"A-geometry_triangle_angles-r20261120","q":"In triangle ABC, angle A = 47\u00b0 and the exterior angle at C is 118\u00b0. What is angle B?","o":["71\u00b0","61\u00b0","62\u00b0","72\u00b0"],"a":0,"x":"An exterior angle equals the sum of the two opposite interior angles, so B = 118\u00b0 - 47\u00b0 = 71\u00b0. The interior angle C is 62\u00b0, and 47+71+62=180\u00b0.","cn":"Use the stated conditions.","sl":"Original practice item","t":"geometry_triangle_angles"},{"id":"A-trains_cross_pole-r20261120","q":"A train 240 m long passes a signal pole in 12 seconds. At the same speed, how long does it take to cross a 360 m bridge completely?","o":["18 seconds","24 seconds","30 seconds","42 seconds"],"a":2,"x":"Passing the pole means the train covers 240 m, so its speed is 240/12 = 20 m/s. To cross the bridge completely it covers 240+360 = 600 m, taking 600/20 = 30 seconds.","cn":"Use the stated conditions.","sl":"Original practice item","t":"trains_cross_pole"},{"id":"A-pipes_cistern_two-r20261120","q":"Pipe A can fill a tank in 6 hours. Pipe B can empty the full tank in 9 hours. With both pipes open, what fraction of the tank remains empty after 3 hours?","o":["5/6","1/6","2/3","1/3"],"a":0,"x":"The net fill rate is 1/6 - 1/9 = 1/18 of the tank per hour. In 3 hours, 3/18 = 1/6 is filled, so 5/6 remains empty.","cn":"Use the stated conditions.","sl":"Original practice item","t":"pipes_cistern_two"},{"id":"A-boats_streams-r20261120","q":"A boat travels at 18 km/h in still water and the stream flows at 3 km/h. The boat goes 42 km downstream and then 30 km upstream. What is the total travel time?","o":["3.5 hours","4 hours","4.5 hours","5 hours"],"a":1,"x":"Downstream speed is 21 km/h, taking 42/21 = 2 hours. Upstream speed is 15 km/h, taking 30/15 = 2 hours. Total time is 4 hours.","cn":"Use the stated conditions.","sl":"Original practice item","t":"boats_streams"},{"id":"A-average_new_member-r20261120","q":"The average score of 12 students is 68. After one more student joins, the average score of the 13 students is 69. What is the new student's score?","o":["72","78","84","81"],"a":3,"x":"The original total is 12 x 68 = 816. The new total is 13 x 69 = 897. The new student scored 897-816 = 81.","cn":"Use the stated conditions.","sl":"Original practice item","t":"average_new_member"},{"id":"A-factor_count-r20261120","q":"What is the sum of all the positive odd factors of 90?","o":["78","72","90","108"],"a":0,"x":"The positive odd factors of 90 are 1, 3, 5, 9, 15 and 45. Their sum is 78.","cn":"Use the stated conditions.","sl":"Original practice item","t":"factor_count"},{"id":"A-races-r20261120","q":"In an 800 m race, A beats B by 80 m. In a separate 600 m race, B beats C by 60 m. If A and C start an 800 m race together and run at the same relative speeds, how far has C run when A finishes?","o":["630 m","648 m","660 m","720 m"],"a":1,"x":"When A runs 800 m, B runs 720 m. B and C cover distances in the ratio 600:540 = 10:9, so when B has run 720 m, C has run 648 m.","cn":"Use the stated conditions.","sl":"Original practice item","t":"races"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
