<script>const D={"id": "q6d077cf4ab", "date": "2026-10-30", "type": "QA", "level": 1, "qs": [{"id": "V-pipes_cistern_two-49", "q": "A farmer's large pump can flood a field in 10 hours. A smaller pump needs 15 hours to flood the same field. If both pumps run together, in how many hours will the field be flooded?", "o": ["25 hours", "7 hours", "6 hours", "12.5 hours"], "a": 2, "x": "In 1 hour the two pumps together flood 1/10 + 1/15 = 3/30 + 2/30 = 5/30 = 1/6 of the field, so they need 6 hours.", "cn": "Add the rates (fraction of the tank per hour), not the times. Time together = (x x y)/(x + y).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two pipes together"}, {"id": "V-races-49", "q": "In a 100 m butterfly race at the school meet, Asha touches the wall 10 m ahead of Bina, and Bina finishes 10 m ahead of Chitra. How many metres ahead of Chitra does Asha finish?", "o": ["19 m", "24 m", "14 m", "20 m"], "a": 0, "x": "When Asha swims 100 m, Bina swims 90 m. In the time Bina swims 90 m, Chitra swims 90 x 90/100 = 81 m. So Asha finishes 100 - 81 = 19 m ahead of Chitra.", "cn": "Do not add the margins. Chain the distances: C covers (D - x) x (D - y) / D in the time A covers D.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "A beats B, B beats C"}, {"id": "V-ages_ratio_sum-49", "q": "Two cousins, Priya and Kavya, have their ages in the ratio 2 : 5, and their ages add up to 35 years. What will Priya's age be 6 years from now?", "o": ["16 years", "31 years", "10 years", "21 years"], "a": 0, "x": "Priya's present age = 35 x 2/7 = 10 years; 6 years from now she will be 10 + 6 = 16 years.", "cn": "Split the total in the ratio to get the present ages first, then add the years that pass.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Ages from a ratio and a total"}, {"id": "V-arithmetic_progression-49", "q": "A staircase is built so that each step is 4 cm higher than the step before it, and the first step is 3 cm above the floor. How high above the floor is the 11th step?", "o": ["44 cm", "39 cm", "47 cm", "43 cm"], "a": 3, "x": "The 11th step is 10 rises above the first: 3 + 10 x 4 = 3 + 40 = 43.", "cn": "The nth term of an AP is a + (n-1)d. Count the gaps between terms: there are n-1 of them, not n.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "AP nth term"}, {"id": "V-geometric_progression-49", "q": "A bacterial colony triples in size every hour. It starts at 3 bacteria in hour 1. How many bacteria are there in hour 5?", "o": ["729", "81", "243", "36"], "a": 2, "x": "Each hour multiplies by 3: hour 5 = 3 x 3^4 = 3 x 81 = 243.", "cn": "The nth term of a GP is a x r^(n-1). The exponent is n-1, one less than the position.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "GP nth term"}, {"id": "V-surds_indices-49", "q": "Simplify to a single number: 3^4 x 3^4 / 3", "o": ["729", "6561", "243", "2187"], "a": 3, "x": "3^4 x 3^4 = 3^8; dividing by 3 gives 3^7 = 2187.", "cn": "Same base: a^m x a^n = a^(m+n) and a^m / a^n = a^(m-n). Do the powers step by step.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Product and quotient of powers"}, {"id": "V-coordinate_distance-49", "q": "On a grid map, a drone flies in a straight line from the point (4, 0) to the point (-3, -24). What distance does it cover?", "o": ["31", "24", "27", "25"], "a": 3, "x": "Distance = sqrt((4-(-3))^2 + (0-(-24))^2) = sqrt(7^2 + 24^2) = sqrt(49 + 576) = sqrt(625) = 25.", "cn": "Distance = square root of ((x2 - x1)^2 + (y2 - y1)^2). Signs do not matter after squaring.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Distance between two points"}, {"id": "V-function_evaluation-49", "q": "A number machine squares whatever number is fed into it and then adds 5. What output does it give when 5 is fed in?", "o": ["32", "30", "35", "27"], "a": 1, "x": "Output = 5^2 + 5 = 25 + 5 = 30.", "cn": "Substitute the number for x everywhere and follow the order of operations.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Evaluate f(x) at a point"}, {"id": "V-statistics_median-49", "q": "Seven bowlers took these wicket counts across a season: 32, 13, 30, 48, 54, 10, 15. What is the median wicket count?", "o": ["28", "32", "30", "29"], "a": 2, "x": "In order: 10, 13, 15, 30, 32, 48, 54. The middle (4th) value is 30.", "cn": "Median = the middle value after arranging in order. With an odd count it is the single middle value.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Median of a data set"}, {"id": "V-partnership_two-49", "q": "Two friends, Meera and Farhan, pooled Rs 5000 and Rs 7500 to print a comic book, agreeing to split the earnings in proportion to what each put in. The first print run earned Rs 1500. How much should Meera get?", "o": ["Rs 600", "Rs 750", "Rs 1200", "Rs 900"], "a": 0, "x": "Investment ratio 5000 : 7500 = 2 : 3, so Meera gets 1500 x 2/5 = Rs 600.", "cn": "When money is invested for the same time, profit is divided in the ratio of the investments.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Sharing a profit in the ratio of investments"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
