<h1>Quant practice q747c9a81d8</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>

<script>const D={"id": "q747c9a81d8", "date": "2026-11-10", "type": "QA", "level": 1, "qs": [{"id": "V-quad_root_k-10", "q": "7 is a root of x^2 - 13x + k = 0. Find k.", "o": ["36", "42", "49", "13"], "a": 1, "x": "Put x = 7: 49 - 91 + k = 0, so k = 42. (The other root is 6, and 7 x 6 = 42.)", "cn": "A root satisfies the equation. Substitute it, or use: product of roots = k, sum of roots = coefficient.", "sl": "Original practice item", "t": "Using a known root of a quadratic"}, {"id": "V-mensuration_rect-6", "q": "A rectangle's length is 3 times its breadth and its perimeter is 40 cm. Find the area of the rectangle.", "o": ["25 sq cm", "100 sq cm", "75 sq cm", "60 sq cm"], "a": 2, "x": "Perimeter = 2 x (length + width) = 2 x (3w + w) = 8w = 40, so width w = 5 cm and length = 15 cm. Area = 15 x 5 = 75 sq cm.", "cn": "Put length and width in terms of one letter, use the perimeter to solve, then multiply for the area.", "sl": "Original practice item", "t": "Rectangle: length as a multiple of width"}, {"id": "V-l0_ratio_share-5", "q": "Rs 30 are shared between Mira and Asha in the ratio 2 : 1. How many does Mira get?", "o": ["Rs 10", "Rs 20", "Rs 15", "Rs 30"], "a": 1, "x": "Total parts = 2 + 1 = 3. One part = 30 / 3 = 10. Mira gets 2 x 10 = 20.", "cn": "Add the ratio parts, find the value of one part, then multiply.", "sl": "Original practice item", "t": "Sharing in a ratio (L0)"}, {"id": "V-geometry_quad_angles-5", "q": "In quadrilateral PQRS, angles P = 70 deg, Q = 80 deg and R = 100 deg. What is angle S?", "o": ["110 deg", "120 deg", "70 deg", "100 deg"], "a": 0, "x": "Angles of a quadrilateral add to 360 deg: S = 360 - 70 - 80 - 100 = 110 deg.", "cn": "A quadrilateral's angles add to 360 deg (two triangles). For a parallelogram, adjacent angles add to 180 deg.", "sl": "Original practice item", "t": "Angle sum of a quadrilateral"}, {"id": "V-average_new_member-5", "q": "The average of 4 numbers is 50. When one more number is included, the average rises by 5. What is the number that was included?", "o": ["70", "80", "55", "75"], "a": 3, "x": "New total = (4+1) x (50+5) = 275. Old total = 4 x 50 = 200. The new number is 275 - 200 = 75.", "cn": "Total = average x count. The new value is the new total minus the old total.", "sl": "Original practice item", "t": "Average after a new value is added"}, {"id": "V-pct_up_down-5", "q": "The population of a town increases by 35% and then decreases by 30%. What is the net percentage change?", "o": ["5.5% decrease", "6.5% decrease", "5% increase", "5% decrease"], "a": 0, "x": "Rise 35% then fall 30%: net = 35 - 30 - (35 x 30)/100 = -5.5%, so a 5.5% decrease.", "cn": "Percent changes multiply. If a quantity rises by x% and then falls by y% (x and y as positive numbers), net change = x - y - xy/100 percent. With signed changes it is x + y + xy/100.", "sl": "Original practice item", "t": "Successive increase and decrease"}, {"id": "V-venn_two_sets-5", "q": "In a group of 80 people, 50 like tea, 30 like coffee and 15 like both. How many like neither?", "o": ["65", "18", "15", "30"], "a": 2, "x": "Like at least one = 50 + 30 - 15 (both counted twice) = 65. Neither = 80 - 65 = 15.", "cn": "At least one = A + B - both. Neither = total - at least one.", "sl": "Original practice item", "t": "Two overlapping groups"}, {"id": "V-pipes_cistern_two-9", "q": "One tap fills a cistern in 20 hours and another tap fills it in 30 hours. If both taps are opened together, in how many hours will the cistern be full?", "o": ["50 hours", "13 hours", "25 hours", "12 hours"], "a": 3, "x": "Together they fill 1/20 + 1/30 of the tank per hour, so the time is 20 x 30 / (20 + 30) = 12 hours.", "cn": "Add the rates (fraction of the tank per hour), not the times. Time together = (x x y)/(x + y).", "sl": "Original practice item", "t": "Two pipes together"}, {"id": "V-compound_interest_2yr-10", "q": "Find the compound interest on Rs 5000 for 2 years at 10% per year, compounded yearly.", "o": ["Rs 1150", "Rs 1050", "Rs 6050", "Rs 1000"], "a": 1, "x": "Amount after 2 years = 5000 x 1.1 x 1.1 = Rs 6050. Compound interest = 6050 - 5000 = Rs 1050. (Simple interest would be Rs 1000.)", "cn": "Compound interest grows on the new amount each year: amount = P x (1 + R/100) for each year. Interest = amount - principal.", "sl": "Original practice item", "t": "Compound interest for 2 years"}, {"id": "V-l0_average-5", "q": "Find the average of 42, 34, 32, 40, 42.", "o": ["39", "40", "38", "37"], "a": 2, "x": "Sum = 190. Number of values = 5. Average = 190 / 5 = 38.", "cn": "Average = sum of the values / number of values.", "sl": "Original practice item", "t": "Average of numbers (L0)"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
