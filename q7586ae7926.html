<script>const D={"id": "q7586ae7926", "date": "2026-11-13", "type": "QA", "level": 1, "qs": [{"id": "A-quad_root_k-r20261113", "q": "One root of x^2 - 8x + k = 0 is twice the other root. What is k?", "o": ["16", "32", "64/9", "128/9"], "a": 3, "x": "Let the roots be r and 2r. Their sum is 8, so r = 8/3. The product is k = 2 x (8/3)^2 = 128/9.", "cn": "Use the given conditions and check the result.", "sl": "Original practice item", "t": "Quad Root K"}, {"id": "A-mensuration_rect-r20261113", "q": "A rectangle has area 96 square cm. If its width is increased by 2 cm while its length stays unchanged, its area becomes 120 square cm. What was its original perimeter?", "o": ["40 cm", "32 cm", "44 cm", "48 cm"], "a": 0, "x": "The added strip has area 120 - 96 = 24 square cm and width 2 cm. The unchanged length is 24/2 = 12 cm. The original width is 96/12 = 8 cm. Perimeter = 2 x (12 + 8) = 40 cm.", "cn": "Use the given conditions and check the result.", "sl": "Original practice item", "t": "Mensuration Rect"}, {"id": "A-trains_cross_pole-r20261113", "q": "The front of a train passes a pole at 10:00:00 and its rear passes the same pole at 10:00:12. The train is 210 m long. At the same constant speed, how far does its front travel between 10:00:12 and 10:00:32?", "o": ["210 m", "350 m", "420 m", "560 m"], "a": 1, "x": "The train covers its own length, 210 m, in 12 seconds. Speed = 210/12 = 17.5 m/s. The later interval lasts 20 seconds. Distance = 17.5 x 20 = 350 m.", "cn": "Use the given conditions and check the result.", "sl": "Original practice item", "t": "Trains Cross Pole"}, {"id": "A-pipes_cistern_two-r20261113", "q": "Pipe A fills a tank in 10 hours. Pipe B fills it in 15 hours. Both start with an empty tank. After some time B is closed, and A continues alone. The tank is full exactly 8 hours after the start. For how many hours was B open?", "o": ["2 hours", "4 hours", "3 hours", "5 hours"], "a": 2, "x": "A works for all 8 hours and fills 8/10 of the tank. B supplies the remaining 1/5. At 1/15 of the tank per hour, B needs (1/5)/(1/15) = 3 hours.", "cn": "Use the given conditions and check the result.", "sl": "Original practice item", "t": "Pipes Cistern Two"}, {"id": "A-boats_streams-r20261113", "q": "A boat has a still-water speed of 8 km/h, and the current is 2 km/h. It travels downstream under engine power for 2 hours. The engine is then switched off and the boat drifts with the current for 1 hour. What total distance does it cover?", "o": ["18 km", "22 km", "20 km", "24 km"], "a": 1, "x": "With the engine on, downstream speed = 8 + 2 = 10 km/h. In 2 hours the boat covers 20 km. Drifting with the current adds 2 km in 1 hour. Total = 22 km.", "cn": "Use the given conditions and check the result.", "sl": "Original practice item", "t": "Boats Streams"}, {"id": "A-divisibility_check-r20261113", "q": "The digits 2, 5 and 7 are each used exactly once to form a three-digit number. How many of the possible numbers are divisible by 11?", "o": ["1", "3", "2", "6"], "a": 2, "x": "The three digits total 14. The alternating digit sum is 14 minus twice the middle digit. It is a multiple of 11 only when the middle digit is 7. The numbers 275 and 572 work, so the count is 2.", "cn": "Use the given conditions and check the result.", "sl": "Original practice item", "t": "Divisibility Check"}, {"id": "A-l0_average-r20261113", "q": "The average of four numbers is 21. The average of the first two numbers is 17, and the third number is 25. What is the fourth number?", "o": ["25", "17", "21", "29"], "a": 0, "x": "All four numbers total 4 x 21 = 84. The first two total 2 x 17 = 34. The fourth is 84 - 34 - 25 = 25.", "cn": "Use the given conditions and check the result.", "sl": "Original practice item", "t": "L0 Average"}, {"id": "A-l0_ratio_share-r20261113", "q": "Three friends share Rs 360. Arun receives twice as much as Bina, and Bina receives three times as much as Charu. How much more does Arun receive than Charu?", "o": ["Rs 120", "Rs 144", "Rs 216", "Rs 180"], "a": 3, "x": "The shares Arun:Bina:Charu are 6:3:1. Ten parts total Rs 360, so one part is Rs 36. The difference between Arun and Charu is 5 parts = Rs 180.", "cn": "Use the given conditions and check the result.", "sl": "Original practice item", "t": "L0 Ratio Share"}, {"id": "A-word_arrangements-r20261113", "q": "How many distinct arrangements of all the letters of COCOON have all three Os consecutive AND N in the last position?", "o": ["3", "12", "6", "9"], "a": 0, "x": "Fix N last and treat OOO as a block. The three remaining objects are the OOO block and two identical Cs. They can be arranged in 3!/2! = 3 ways.", "cn": "Use the given conditions and check the result.", "sl": "Original practice item", "t": "Word Arrangements"}, {"id": "A-time_work_two-r20261113", "q": "A and B together can finish a job in 10 days. If A worked alone for 5 days and B alone for 5 days, what fraction of the job would they complete in total?", "o": ["1", "1/4", "1/2", "1/5"], "a": 2, "x": "Let the daily work rates be a and b. Together they complete 1/10 of the job per day, so a + b = 1/10. Five days of A and five days of B complete 5a + 5b = 5(a + b) = 1/2 of the job.", "cn": "Use the given conditions and check the result.", "sl": "Original practice item", "t": "Time Work Two"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
