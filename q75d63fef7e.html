<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Quant practice q75d63fef7e</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "q75d63fef7e", "date": "2026-11-14", "type": "QA", "level": 1, "qs": [{"id": "V-l0_percent_of-14", "q": "What is 30% of 60?", "o": ["33", "42", "18", "36"], "a": 2, "x": "30% of 60 = 30/100 x 60 = 18.", "cn": "Percent means per hundred: p% of n = p/100 x n.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Percentage of a number (L0)"}, {"id": "V-l0_speed_distance-14", "q": "A train travels at 50 km per hour for 5 hours. How far does it travel?", "o": ["250 km", "200 km", "300 km", "55 km"], "a": 0, "x": "Distance = speed x time = 50 x 5 = 250 km.", "cn": "Distance = speed x time.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Distance = speed x time (L0)"}, {"id": "V-l0_profit_simple-25", "q": "An article bought for Rs 100 is sold for Rs 125. What is the profit percent?", "o": ["20%", "30%", "35%", "25%"], "a": 3, "x": "Profit = 125 - 100 = 25. Profit percent = 25/100 x 100 = 25%.", "cn": "Profit percent = profit / cost price x 100 (always on the cost price).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Profit percent, one step (L0)"}, {"id": "V-pct_markup_discount-16", "q": "A shopkeeper marks a shirt 55% above its cost price and then gives a 10% discount on the marked price. What is the profit percent?", "o": ["45%", "44.5%", "34.5%", "39.5%"], "a": 3, "x": "Take cost = 100. Marked price = 155. Selling price = 155 x 90/100 = 139.5. Profit = 39.5%.", "cn": "Successive percentages multiply: they do not add or subtract. Discount is on the marked price, profit is on the cost price.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Mark-up and discount"}, {"id": "V-algebra_identity-15", "q": "Given a + b = 23 and ab = 120, find a^2 + b^2.", "o": ["529", "289", "409", "769"], "a": 1, "x": "x^2 + y^2 = (x + y)^2 - 2xy = 23^2 - 2 x 120 = 529 - 240 = 289.", "cn": "Use the identity x^2 + y^2 = (x + y)^2 - 2xy instead of finding x and y separately.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Square of a sum identity"}, {"id": "V-mixture_add_water-15", "q": "A 30 litre mixture has syrup and water in the ratio 4 : 1. How many litres of water must be added to make the ratio 1 : 1?", "o": ["22 litres", "20 litres", "18 litres", "16 litres"], "a": 2, "x": "Syrup = 24 L and water = 6 L. For 1 : 1 the water must also be 24 L, so add 24-6 = 18 L.", "cn": "Adding water does not change the other part. Keep it fixed and make the other part equal to it.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Adding to change a ratio"}, {"id": "V-quad_root_k-14", "q": "3 is a root of x^2 - 5x + k = 0. Find k.", "o": ["5", "9", "4", "6"], "a": 3, "x": "Put x = 3: 9 - 15 + k = 0, so k = 6. (The other root is 2, and 3 x 2 = 6.)", "cn": "A root satisfies the equation. Substitute it, or use: product of roots = k, sum of roots = coefficient.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Using a known root of a quadratic"}, {"id": "V-l0_area_rect-12", "q": "A field is 12 m long and 9 m wide. What is its area?", "o": ["108 sq m", "21 sq m", "42 sq m", "216 sq m"], "a": 0, "x": "Area of a rectangle = length x width = 12 x 9 = 108 sq m.", "cn": "Area of a rectangle = length x width. Perimeter is a different thing (the distance around).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Area of a rectangle (L0)"}, {"id": "V-l0_simple_interest-12", "q": "What is the simple interest on Rs 5000 at 4% per year for 4 years?", "o": ["Rs 800", "Rs 5800", "Rs 200", "Rs 1600"], "a": 0, "x": "Simple interest = P x R x T / 100 = 5000 x 4 x 4 / 100 = Rs 800.", "cn": "Simple interest = principal x rate x time / 100. It is the interest only, not the total amount.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Simple interest, one step (L0)"}, {"id": "A-l0_lcm-an20261114-1", "q": "A machine makes one beep every 12 seconds and another machine makes one beep every 20 seconds. Both beep now. How many times will they beep together during the next 3 minutes, NOT counting now but including the instant 3 minutes from now?", "o": ["5", "2", "3", "15"], "a": 2, "x": "They beep together every LCM(12,20) = 60 seconds. In the next 180 seconds they coincide at 60, 120 and 180 seconds, so there are 3 coincidences.", "cn": "LCM = the smallest number that both numbers divide into. Do not just multiply the numbers unless they share no factor.", "sl": "Original practice item", "t": "LCM of two numbers (L0)"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};

</script></body></html>
