<script>const D={"id": "q784ffc0bc1", "date": "2026-11-14", "type": "QA", "level": 1, "qs": [{"id": "A-algebra_identity-r20261114", "q": "For real numbers a and b, a^2 + b^2 = 85 and ab = 42. What is (a - b)^2?", "o": ["169", "1", "43", "7"], "a": 1, "x": "Use (a - b)^2 = a^2 + b^2 - 2ab = 85 - 84 = 1.", "cn": "Use the given conditions and check the result.", "sl": "Original practice item", "t": "Algebra Identity"}, {"id": "A-remainder_basic-r20261114", "q": "An integer greater than 40 leaves a remainder of 3 when divided by 5. What is the smallest possible integer?", "o": ["41", "45", "43", "48"], "a": 2, "x": "The nearby integers with remainder 3 are 38, 43 and 48. The smallest greater than 40 is 43.", "cn": "Use the given conditions and check the result.", "sl": "Original practice item", "t": "Remainder Basic"}, {"id": "A-compound_interest_2yr-r20261114", "q": "Rs 10000 is deposited at 10% compound interest per year, credited at each year end. Immediately AFTER the first year's interest is credited, Rs 1100 is withdrawn. No other money is added or withdrawn. What is the balance after the second year's interest is credited?", "o": ["Rs 10890", "Rs 11000", "Rs 12100", "Rs 9900"], "a": 0, "x": "After year 1 the balance is Rs 11000. Withdrawing Rs 1100 leaves Rs 9900. Year 2 ends with 9900 x 1.10 = Rs 10890.", "cn": "Use the given conditions and check the result.", "sl": "Original practice item", "t": "Compound Interest 2Yr"}, {"id": "A-pct_up_down-r20261114", "q": "A library initially has 500 books. Its collection increases by 20%. It then donates 25% of the enlarged collection. How many books must it add to return to its original 500 books?", "o": ["100", "25", "75", "50"], "a": 3, "x": "After the increase there are 600 books. A quarter of 600 is 150, leaving 450. It must add 500 - 450 = 50 books.", "cn": "Use the given conditions and check the result.", "sl": "Original practice item", "t": "Pct Up Down"}, {"id": "A-venn_two_sets-r20261114", "q": "In a club, 24 members play chess and 18 play tennis. There are 10 members who play chess but NOT tennis. How many members play tennis but NOT chess?", "o": ["4", "14", "6", "8"], "a": 0, "x": "The overlap is 24 - 10 = 14. Tennis only = 18 - 14 = 4. No total club size is needed.", "cn": "Use the given conditions and check the result.", "sl": "Original practice item", "t": "Venn Two Sets"}, {"id": "A-geometry_quad_angles-r20261114", "q": "A parallelogram has two ADJACENT interior angles in the ratio 2 : 3. What is the smaller interior angle?", "o": ["108 degrees", "72 degrees", "60 degrees", "90 degrees"], "a": 1, "x": "Adjacent angles of a parallelogram add to 180 degrees. Five ratio parts equal 180, so one part is 36. The smaller angle is 2 x 36 = 72 degrees.", "cn": "Use the given conditions and check the result.", "sl": "Original practice item", "t": "Geometry Quad Angles"}, {"id": "A-linear_inequality_one-r20261114", "q": "How many integers x satisfy BOTH 5 < 2x + 1 and 2x + 1 <= 13?", "o": ["3", "5", "6", "4"], "a": 3, "x": "Subtract 1, then divide by 2: 2 < x <= 6. The integer values are 3, 4, 5 and 6, giving four values.", "cn": "Use the given conditions and check the result.", "sl": "Original practice item", "t": "Linear Inequality One"}, {"id": "A-average_new_member-r20261114", "q": "A group has an average age of 18 years. A member aged 30 leaves, and the average age of the remaining group becomes 16 years. How many members were in the ORIGINAL group?", "o": ["6", "8", "7", "9"], "a": 2, "x": "If the original count is n, the total age was 18n. Removing 30 leaves 16(n - 1). Thus 18n - 30 = 16n - 16, so 2n = 14 and n = 7.", "cn": "Use the given conditions and check the result.", "sl": "Original practice item", "t": "Average New Member"}, {"id": "A-time_work_two-r20261114", "q": "A alone completes a job in 12 days, and B alone in 24 days. A works alone for some time, measured in days. B then works alone for TWICE as many days as A did, finishing the job. For how many days did A work?", "o": ["6 days", "12 days", "4 days", "8 days"], "a": 0, "x": "Let A work t days and B work 2t days. Completed work is t/12 + 2t/24 = t/6. Setting this to 1 gives t = 6 days.", "cn": "Use the given conditions and check the result.", "sl": "Original practice item", "t": "Time Work Two"}, {"id": "A-boats_streams-r20261114", "q": "A boat has a still-water speed of 9 km/h. In 2 hours downstream it covers 8 km MORE than it covers in 2 hours upstream. What is the current's speed?", "o": ["1 km/h", "2 km/h", "3 km/h", "4 km/h"], "a": 1, "x": "If the current speed is c, the two distances differ by 2(9+c) - 2(9-c) = 4c. Since 4c = 8, c = 2 km/h.", "cn": "Use the given conditions and check the result.", "sl": "Original practice item", "t": "Boats Streams"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
