<script>const D={"id": "q82c070e7aa", "date": "2026-11-15", "type": "QA", "level": 1, "qs": [{"id": "A-word_arrangements-r20261115v2", "q": "All six letters of JACKET are different. In how many arrangements of these six letters are the two vowels NOT next to each other?", "o": ["480", "240", "360", "600"], "a": 0, "x": "There are 6! = 720 arrangements in all. When A and E are together, treat them as one block: 5! x 2 = 240 arrangements. Subtract to get 720 - 240 = 480.", "cn": "Use the stated conditions and check the result.", "sl": "Original practice item", "t": "Word Arrangements"}, {"id": "A-remainder_basic-r20261115", "q": "A positive integer N leaves remainder 8 when divided by 11. What remainder does N squared leave when divided by 11?", "o": ["2", "5", "9", "8"], "a": 2, "x": "N has the same remainder as 8, so N squared has the same remainder as 64. Since 64 = 5 x 11 + 9, the remainder is 9.", "cn": "Use the stated conditions and check the result.", "sl": "Original practice item", "t": "Remainder Basic"}, {"id": "A-factor_count-r20261115", "q": "Which of these numbers has exactly NINE positive factors?", "o": ["24", "30", "40", "36"], "a": 3, "x": "36 = 2^2 x 3^2 has (2+1)(2+1) = 9 factors. Each other option has eight factors.", "cn": "Use the stated conditions and check the result.", "sl": "Original practice item", "t": "Factor Count"}, {"id": "A-divisibility_check-r20261115", "q": "How many positive integers strictly greater than 20 and strictly less than 50 are divisible by 6?", "o": ["4", "5", "6", "7"], "a": 1, "x": "The integers are 24, 30, 36, 42 and 48, giving five.", "cn": "Use the stated conditions and check the result.", "sl": "Original practice item", "t": "Divisibility Check"}, {"id": "A-quad_root_k-r20261115", "q": "The quadratic equation x^2 + kx + 24 = 0 has x = -4 as a root. What is k?", "o": ["12", "6", "10", "8"], "a": 2, "x": "Substitute -4: 16 - 4k + 24 = 0. Thus 4k = 40 and k = 10.", "cn": "Use the stated conditions and check the result.", "sl": "Original practice item", "t": "Quad Root K"}, {"id": "A-mensuration_rect-r20261115", "q": "A rectangle has length three times its width and area 108 square cm. What is its perimeter?", "o": ["48 cm", "36 cm", "54 cm", "72 cm"], "a": 0, "x": "If width is w, then 3w^2 = 108, giving w = 6 cm and length = 18 cm. Perimeter = 2(18+6) = 48 cm.", "cn": "Use the stated conditions and check the result.", "sl": "Original practice item", "t": "Mensuration Rect"}, {"id": "A-l0_ratio_share-r20261115", "q": "Three containers hold water in the ratio 2 : 3 : 5. Together they hold 80 litres. The largest container is emptied completely. How much water remains in the other two containers together?", "o": ["24 litres", "32 litres", "48 litres", "40 litres"], "a": 3, "x": "There are 10 parts in total. The two smaller containers hold 2+3 = 5 parts, so they contain 80 x 5/10 = 40 litres.", "cn": "Use the stated conditions and check the result.", "sl": "Original practice item", "t": "L0 Ratio Share"}, {"id": "A-l0_average-r20261115", "q": "One group of 12 students has an average score of 60. Another group of 8 students has an average score of 70. What is the average score of all 20 students together?", "o": ["62", "64", "65", "66"], "a": 1, "x": "The score totals are 12 x 60 = 720 and 8 x 70 = 560. Their combined total 1280 divided by 20 is 64.", "cn": "Use the stated conditions and check the result.", "sl": "Original practice item", "t": "L0 Average"}, {"id": "A-races-r20261115", "q": "A and B start together and run at constant speeds. When A has run 180 metres, B has run 120 metres. By the time B has run 180 metres, how many metres FARTHER than 180 metres has A run?", "o": ["120 metres", "90 metres", "30 metres", "60 metres"], "a": 1, "x": "Their speed ratio is 180:120 = 3:2. When B runs 180 metres, A runs 180 x 3/2 = 270 metres. A has run 270 - 180 = 90 metres farther.", "cn": "Use the stated conditions and check the result.", "sl": "Original practice item", "t": "Races"}, {"id": "A-time_work_two-r20261115", "q": "A can finish a job alone in 10 days. A and B work together for 2 days, after which A leaves. B then completes the remaining work alone in 6 more days. How many days would B take to do the WHOLE job alone?", "o": ["10 days", "12 days", "15 days", "8 days"], "a": 0, "x": "A completes 2/10 = 1/5 of the job. B works for 2+6 = 8 days in total and completes the other 4/5. Thus B needs 8 divided by 4/5 = 10 days for the whole job.", "cn": "Use the stated conditions and check the result.", "sl": "Original practice item", "t": "Time Work Two"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
