<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quant practice q83bf23d73e</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Quant practice q83bf23d73e</h1><p>10 questions &middot; level L0 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "q83bf23d73e", "date": "2026-10-23", "type": "QA", "level": 0, "qs": [{"id": "V-units_digit-33", "q": "Find the last digit of 8 raised to the power 24.", "o": ["1", "2", "6", "3"], "a": 2, "x": "Units digits of powers of 8 repeat as 8, 4, 2, 6. 24 divided by 4 leaves remainder 0; a remainder of 0 means it sits at the last place of the cycle, so the digit is 6.", "cn": "Units digits of powers repeat in a short cycle. Find the remainder of the power divided by the cycle length.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Units digit of a power"}, {"id": "V-time_work_two-33", "q": "A can finish a painting task in 12 days and B can finish it in 18 days. Working together, in how many days will they finish it?", "o": ["30 days", "8.2 days", "15 days", "7.2 days"], "a": 3, "x": "Rates are 1/12 and 1/18 per day. Together 1/12 + 1/18 = 30/216, so the time is 216/30 = 7.2 days.", "cn": "Add the work done per day (rates), not the days. Time together = (a x b)/(a + b).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two workers together"}, {"id": "V-pct_markup_discount-33", "q": "The marked price of a shirt is 55% more than its cost. It is sold after allowing a discount of 20%. Find the profit percent.", "o": ["29%", "35%", "24%", "19%"], "a": 2, "x": "Take cost = 100. Marked price = 155. Selling price = 155 x 80/100 = 124. Profit = 24%.", "cn": "Successive percentages multiply: they do not add or subtract. Discount is on the marked price, profit is on the cost price.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Mark-up and discount"}, {"id": "V-algebra_identity-33", "q": "Given a + b = 13 and ab = 36, find a^2 + b^2.", "o": ["97", "133", "241", "169"], "a": 0, "x": "x^2 + y^2 = (x + y)^2 - 2xy = 13^2 - 2 x 36 = 169 - 72 = 97.", "cn": "Use the identity x^2 + y^2 = (x + y)^2 - 2xy instead of finding x and y separately.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Square of a sum identity"}, {"id": "V-mixture_add_water-33", "q": "A 48 litre mixture has syrup and water in the ratio 5 : 3. How many litres of water must be added to make the ratio 1 : 1?", "o": ["14 litres", "12 litres", "16 litres", "10 litres"], "a": 1, "x": "Syrup = 30 L and water = 18 L. For 1 : 1 the water must also be 30 L, so add 30-18 = 12 L.", "cn": "Adding water does not change the other part. Keep it fixed and make the other part equal to it.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Adding to change a ratio"}, {"id": "V-quad_root_k-33", "q": "7 is a root of x^2 - 10x + k = 0. Find k.", "o": ["18", "28", "21", "10"], "a": 2, "x": "Put x = 7: 49 - 70 + k = 0, so k = 21. (The other root is 3, and 7 x 3 = 21.)", "cn": "A root satisfies the equation. Substitute it, or use: product of roots = k, sum of roots = coefficient.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Using a known root of a quadratic"}, {"id": "V-di_growth-33", "q": "Sales (in tickets) of three products:\nProduct   2023   2024\nR   240   300\nP   400   520\nS   240   288\nThe percentage growth of P from 2023 to 2024 is higher than that of R by how many percentage points?", "o": ["55", "5", "10", "60"], "a": 1, "x": "P grew 120/400 = 30%. R grew 60/240 = 25%. The difference is 30 - 25 = 5 percentage points.", "cn": "Percentage growth = change / old value x 100. A difference between two growth rates is in percentage points.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Percentage growth and percentage-point gap"}, {"id": "V-mensuration_rect-33", "q": "The length of a rectangle is 4 times its width. If the perimeter of the rectangle is 70 cm, what is its area?", "o": ["49 sq cm", "196 sq cm", "245 sq cm", "140 sq cm"], "a": 1, "x": "Perimeter = 2 x (length + width) = 2 x (4w + w) = 10w = 70, so width w = 7 cm and length = 28 cm. Area = 28 x 7 = 196 sq cm.", "cn": "Put length and width in terms of one letter, use the perimeter to solve, then multiply for the area.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Rectangle: length as a multiple of width"}, {"id": "V-l0_simple_interest-33", "q": "What is the simple interest on Rs 2000 at 4% per year for 4 years?", "o": ["Rs 320", "Rs 80", "Rs 640", "Rs 2320"], "a": 0, "x": "Simple interest = P x R x T / 100 = 2000 x 4 x 4 / 100 = Rs 320.", "cn": "Simple interest = principal x rate x time / 100. It is the interest only, not the total amount.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Simple interest, one step (L0)"}, {"id": "V-l0_lcm-33", "q": "Find the LCM of 8 and 12.", "o": ["32", "96", "4", "24"], "a": 3, "x": "Multiples of 8: 8, 16, 24, ... Multiples of 12: 12, 24, ... The smallest common multiple is 24.", "cn": "LCM = the smallest number that both numbers divide into. Do not just multiply the numbers unless they share no factor.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "LCM of two numbers (L0)"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
