<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>

<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "q86449d004a2", "date": "2026-10-31", "type": "QA", "level": 1, "qs": [{"id": "V-races-51", "q": "In a 200 m sprint at the inter-house sports day, Tara finishes 20 m ahead of Juhi, and Juhi finishes 40 m ahead of Naina. By how many metres does Tara beat Naina?", "o": ["56 m", "59 m", "60 m", "61 m"], "a": 0, "x": "When Tara runs 200 m, Juhi runs 180 m. When Juhi runs 200 m, Naina runs 160 m, so Naina runs 180 x 160 / 200 = 144 m when Tara runs 200 m. Tara beats Naina by 200 - 144 = 56 m.", "cn": "Do not add the margins. Chain the distances: C covers (D - x) x (D - y) / D in the time A covers D.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "A beats B, B beats C"}, {"id": "V-partnership_two-151", "q": "Sana and Vikram invested Rs 15000 and Rs 21000 in a weekend snack stall at the colony fair, agreeing to split the profit in proportion to their investments. Out of a total profit of Rs 4800, what is Sana's share?", "o": ["Rs 2000", "Rs 3200", "Rs 2400", "Rs 2800"], "a": 0, "x": "Both investments run for the same period, so the profit is shared in the ratio 15000 : 21000 = 5 : 7. Sana's share = 4800 x 5/12 = Rs 2000.", "cn": "When money is invested for the same time, profit is divided in the ratio of the investments.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Sharing a profit in the ratio of investments"}, {"id": "V-geometry_lines_angles-55", "q": "Two parallel lines are cut by a transversal. One of the interior angles formed is 120 deg. A ray bisects its co-interior angle. What angle does this ray make with the transversal?", "o": ["120 deg", "60 deg", "30 deg", "45 deg"], "a": 2, "x": "Co-interior angles add to 180 deg, so the co-interior angle is 180 - 120 = 60 deg. The bisector splits it into two equal angles of 30 deg, so the ray makes 30 deg with the transversal.", "cn": "Corresponding and vertically opposite angles are equal; co-interior (same-side) angles add to 180 deg.", "sl": "Authored item for a concept (new scenario and wording)", "t": "Angles on parallel lines"}, {"id": "V-venn_two_sets-51", "q": "In a class of 80 students, 40 play cricket, 38 play football and 12 play both. How many play neither?", "o": ["2", "14", "20", "26"], "a": 1, "x": "Play at least one = 40 + 38 - 12 (both counted twice) = 66. Neither = 80 - 66 = 14.", "cn": "At least one = A + B - both. Neither = total - at least one.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two overlapping groups"}, {"id": "V-inequality_word-51", "q": "A courier service charges Rs 25 fixed plus Rs 12 per parcel. With a budget of Rs 157, at most how many parcels can be sent?", "o": ["11", "10", "13", "12"], "a": 0, "x": "Fixed + per-parcel x n <= budget: 25 + 12n <= 157, so n <= (157 - 25)/12 = 11. Largest whole number: 11.", "cn": "Set up fixed + rate x n <= budget, subtract the fixed part, divide, then take the largest whole number that still fits.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Word problem with an upper limit"}, {"id": "V-word_arrangements-51", "q": "In how many different ways can the letters of the word PLANET be arranged?", "o": ["1440", "720", "726", "360"], "a": 1, "x": "6 letters, all different: 6! = 720.", "cn": "n distinct letters can be arranged in n! ways. Divide by the factorial of each repeated count.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Arrangements of letters"}, {"id": "V-compound_interest_2yr-51", "q": "A school keeps Rs 4000 in a savings scheme for 2 years at 5% per year, interest compounded yearly. How much compound interest will it earn?", "o": ["Rs 400", "Rs 4410", "Rs 460", "Rs 410"], "a": 3, "x": "Amount after 2 years = 4000 x 1.05 x 1.05 = Rs 4410. Compound interest = 4410 - 4000 = Rs 410. (Simple interest would be Rs 400.)", "cn": "Compound interest grows on the new amount each year: amount = P x (1 + R/100) for each year. Interest = amount - principal.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Compound interest for 2 years"}, {"id": "V-boats_streams-166", "q": "A ferry can travel at 10 km/h in still water. The river current flows at 6 km/h. How many hours will the ferry take to travel 80 km downstream?", "o": ["20 hours", "5 hours", "6 hours", "8 hours"], "a": 1, "x": "Downstream speed = 10 + 6 = 16 km/h. Time = distance / speed = 80 / 16 = 5 hours.", "cn": "Downstream speeds add (boat + stream), upstream speeds subtract. Time = distance / effective speed, not distance / still-water speed.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Downstream time"}, {"id": "V-logarithm_basic-52", "q": "If log base b of 64 = 3, what is the value of b?", "o": ["16", "8", "2", "4"], "a": 3, "x": "log base b of 64 = 3 means b^3 = 64. Since 4^3 = 4 x 4 x 4 = 64, the base b is 4.", "cn": "log base b of N = the power p with b^p = N.", "sl": "Authored item for a concept (new scenario and wording)", "t": "Evaluate or invert a logarithm"}, {"id": "V-pipes_cistern_two-51", "q": "A large hose can fill a water tanker in 12 hours and a smaller hose needs 18 hours to fill the same tanker. If both hoses run together, in how many hours will the tanker be full?", "o": ["15 hours", "30 hours", "7.2 hours", "8.2 hours"], "a": 2, "x": "Together they fill 1/12 + 1/18 of the tanker per hour, so the time is 12 x 18 / (12 + 18) = 7.2 hours.", "cn": "Add the rates (fraction of the tank per hour), not the times. Time together = (x x y)/(x + y).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two pipes together"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
