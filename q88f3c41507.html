<script>const D={"id":"q88f3c41507","date":"2026-11-18","type":"QA","level":1,"qs":[{"id":"A-remainder_basic-r20261118","q":"When a positive integer N is divided by 9, the remainder is 4. What is the remainder when 5N is divided by 9?","o":["4","5","2","8"],"a":2,"x":"If N leaves remainder 4 on division by 9, then 5N leaves the same remainder as 5 x 4 = 20. Since 20 = 18 + 2, the remainder is 2.","cn":"Use the stated conditions.","sl":"Original practice item","t":"remainder_basic"},{"id":"A-compound_interest_2yr-r20261118","q":"A sum of Rs 8,000 is invested at compound interest, compounded annually. The rate is 10% for the first year and 20% for the second year. What is the amount after two years?","o":["Rs 10,560","Rs 10,400","Rs 9,600","Rs 11,200"],"a":0,"x":"After one year the amount is 8000 x 1.10 = 8800. After the second year it is 8800 x 1.20 = 10560.","cn":"Use the stated conditions.","sl":"Original practice item","t":"compound_interest_2yr"},{"id":"A-linear_inequality_one-r20261118","q":"What is the smallest integer x that satisfies 3x - 7 > 20?","o":["9","10","8","11"],"a":1,"x":"Add 7 to get 3x > 27, so x > 9. The smallest integer greater than 9 is 10.","cn":"Use the stated conditions.","sl":"Original practice item","t":"linear_inequality_one"},{"id":"A-geometry_quad_angles-r20261118","q":"In convex quadrilateral ABCD, diagonal AC makes angle BAC = 38\u00b0, angle CAD = 47\u00b0, angle BCA = 60\u00b0 and angle ACD = 55\u00b0. Angle ABC is 82\u00b0. What is angle ADC?","o":["72\u00b0","88\u00b0","98\u00b0","78\u00b0"],"a":3,"x":"In triangle ABC, 38+60+82=180\u00b0. In triangle ACD, angle ADC = 180-47-55 = 78\u00b0. The quadrilateral angles are A=85\u00b0, B=82\u00b0, C=115\u00b0 and D=78\u00b0, totaling 360\u00b0.","cn":"Use the stated conditions.","sl":"Original practice item","t":"geometry_quad_angles"},{"id":"A-trains_cross_pole-r20261118r2","q":"Two signal poles A and B are 520 metres apart. A train crosses pole A in 16 seconds. Its front reaches pole B 24 seconds after its rear leaves pole A. At the same constant speed, how long is the train?","o":["208 m","195 m","234 m","260 m"],"a":0,"x":"Let the train length be L metres and its speed be v m/s. Crossing pole A in 16 seconds gives L=16v. When the rear leaves pole A, the front is already L metres beyond A, so it must cover 520-L metres to reach B. Thus 520-L=24v. Substituting v=L/16 gives 520-L=1.5L, so 520=2.5L and L=208 metres.","cn":"Use the stated conditions.","sl":"Original practice item","t":"trains_cross_pole"},{"id":"A-pipes_cistern_two-r20261118","q":"Pipe A can fill a tank in 10 hours. Pipe B can empty the full tank in 15 hours. With both pipes open, how long will it take to fill the empty tank?","o":["12 hours","30 hours","18 hours","25 hours"],"a":1,"x":"The net rate is 1/10 - 1/15 = 1/30 of the tank per hour, so filling takes 30 hours.","cn":"Use the stated conditions.","sl":"Original practice item","t":"pipes_cistern_two"},{"id":"A-boats_streams-r20261118","q":"A boat travels at 15 km/h in still water and the stream flows at 3 km/h. The boat goes 36 km downstream and returns the same 36 km upstream. What is the total travel time?","o":["4 hours","4.5 hours","6 hours","5 hours"],"a":3,"x":"Downstream speed is 18 km/h, taking 36/18=2 hours. Upstream speed is 12 km/h, taking 36/12=3 hours. Total time is 5 hours.","cn":"Use the stated conditions.","sl":"Original practice item","t":"boats_streams"},{"id":"A-average_new_member-r20261118","q":"The average weight of 9 members of a group is 54 kg. When a new member joins, the average weight of all 10 members becomes 55 kg. What is the new member's weight?","o":["55 kg","59 kg","64 kg","60 kg"],"a":2,"x":"The original total is 9 x 54 = 486 kg. The new total is 10 x 55 = 550 kg. The new member weighs 550-486=64 kg.","cn":"Use the stated conditions.","sl":"Original practice item","t":"average_new_member"},{"id":"A-factor_count-r20261118","q":"How many positive factors does 72 have?","o":["8","12","10","14"],"a":1,"x":"72 = 2^3 x 3^2, so the number of positive factors is (3+1)(2+1)=12.","cn":"Use the stated conditions.","sl":"Original practice item","t":"factor_count"},{"id":"A-races-r20261118","q":"In a 1000 m race, A beats B by 100 m. In another 1000 m race, B beats C by 100 m. If A and C run 1000 m at the same relative speeds, by how many metres does A beat C?","o":["190 m","180 m","200 m","210 m"],"a":0,"x":"When A runs 1000 m, B runs 900 m. B and C cover distances in the ratio 1000:900, so when B has run 900 m, C has run 810 m. A beats C by 1000-810=190 m.","cn":"Use the stated conditions.","sl":"Original practice item","t":"races"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
