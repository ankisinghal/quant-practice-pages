<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quant practice q8a90ef6617</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Quant practice q8a90ef6617</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "q8a90ef6617", "date": "2026-10-26", "type": "QA", "level": 1, "qs": [{"id": "V-pipes_cistern_two-45", "q": "One tap fills a cistern in 15 hours and another tap fills it in 30 hours. If both taps are opened together, in how many hours will the cistern be full?", "o": ["10 hours", "11 hours", "45 hours", "22.5 hours"], "a": 0, "x": "Together they fill 1/15 + 1/30 of the tank per hour, so the time is 15 x 30 / (15 + 30) = 10 hours.", "cn": "Add the rates (fraction of the tank per hour), not the times. Time together = (x x y)/(x + y).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two pipes together"}, {"id": "V-logarithm_basic-45", "q": "If log base 5 of x = 4, what is the value of x?", "o": ["3125", "9", "20", "625"], "a": 3, "x": "log base 5 of x = 4 means x = 5^4 = 625.", "cn": "log base b of N = the power p with b^p = N.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Evaluate or invert a logarithm"}, {"id": "V-mensuration_rect-45", "q": "A rectangle's length is 2 times its breadth and its perimeter is 42 cm. Find the area of the rectangle.", "o": ["98 sq cm", "42 sq cm", "49 sq cm", "147 sq cm"], "a": 0, "x": "Perimeter = 2 x (length + width) = 2 x (2w + w) = 6w = 42, so width w = 7 cm and length = 14 cm. Area = 14 x 7 = 98 sq cm.", "cn": "Put length and width in terms of one letter, use the perimeter to solve, then multiply for the area.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Rectangle: length as a multiple of width"}, {"id": "V-l0_percent_of-45", "q": "What is 60% of 60?", "o": ["66", "36", "72", "24"], "a": 1, "x": "60% of 60 = 60/100 x 60 = 36.", "cn": "Percent means per hundred: p% of n = p/100 x n.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Percentage of a number (L0)"}, {"id": "V-l0_ratio_share-45", "q": "Rs 90 are shared between Asha and Tina in the ratio 4 : 5. How many does Asha get?", "o": ["Rs 45", "Rs 50", "Rs 30", "Rs 40"], "a": 3, "x": "Total parts = 4 + 5 = 9. One part = 90 / 9 = 10. Asha gets 4 x 10 = 40.", "cn": "Add the ratio parts, find the value of one part, then multiply.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Sharing in a ratio (L0)"}, {"id": "V-l0_speed_distance-45", "q": "A cyclist travels at 15 km per hour for 5 hours. How far does it travel?", "o": ["90 km", "20 km", "75 km", "60 km"], "a": 2, "x": "Distance = speed x time = 15 x 5 = 75 km.", "cn": "Distance = speed x time.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Distance = speed x time (L0)"}, {"id": "V-l0_profit_simple-45", "q": "An article bought for Rs 100 is sold for Rs 120. What is the profit percent?", "o": ["25%", "30%", "20%", "15%"], "a": 2, "x": "Profit = 120 - 100 = 20. Profit percent = 20/100 x 100 = 20%.", "cn": "Profit percent = profit / cost price x 100 (always on the cost price).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Profit percent, one step (L0)"}, {"id": "V-quad_root_k-45", "q": "One root of the equation x^2 - 12x + k = 0 is 5. What is the value of k?", "o": ["35", "40", "28", "12"], "a": 0, "x": "Put x = 5: 25 - 60 + k = 0, so k = 35. (The other root is 7, and 5 x 7 = 35.)", "cn": "A root satisfies the equation. Substitute it, or use: product of roots = k, sum of roots = coefficient.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Using a known root of a quadratic"}, {"id": "V-l0_average-145", "q": "Find the average of 34, 42, 34, 34, 36.", "o": ["38", "36", "37", "35"], "a": 1, "x": "Sum = 180. Number of values = 5. Average = 180 / 5 = 36.", "cn": "Average = sum of the values / number of values.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Average of numbers (L0)"}, {"id": "V-trains_cross_pole-145", "q": "How long does a train 720 m long, moving at 108 km/h, take to cross a lamp post?", "o": ["48 seconds", "22 seconds", "26 seconds", "24 seconds"], "a": 3, "x": "Speed = 108 km/h = 108 x 5/18 = 30 m/s. Time to pass a pole = length / speed = 720 / 30 = 24 seconds.", "cn": "Passing a pole means covering the train's own length. Convert km/h to m/s by multiplying by 5/18.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Train passing a pole"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
