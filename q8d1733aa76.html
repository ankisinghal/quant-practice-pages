<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Quant practice q8d1733aa76</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>

<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "q8d1733aa76", "date": "2026-11-28", "type": "QA", "level": 1, "qs": [{"id": "V-probability_dice-11", "q": "Two fair dice are thrown together. What is the probability that the sum of the numbers is 10? (Options are fractions out of 36.)", "o": ["3/36", "2/36", "5/36", "4/36"], "a": 0, "x": "Total outcomes = 36. Pairs with sum 10: (4,6), (5,5), (6,4), which is 3 outcomes. Probability = 3/36.", "cn": "Probability = favourable outcomes / total outcomes. Two dice have 36 equally likely outcomes; list the pairs that give the sum.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two dice, sum probability"}, {"id": "V-boats_streams-10", "q": "A motorboat can travel at 14 km/h in still water. If the speed of the stream is 5 km/h, how many hours will it take to go 57 km downstream?", "o": ["4 hours", "6.33333 hours", "3 hours", "4.07143 hours"], "a": 2, "x": "Downstream speed = 14 + 5 = 19 km/h. Time = distance / speed = 57 / 19 = 3 hours.", "cn": "Downstream speeds add (boat + stream), upstream speeds subtract. Time = distance / effective speed, not distance / still-water speed.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Downstream time"}, {"id": "V-arithmetic_progression-7", "q": "In the AP 11, 16, 21, ..., which term is in position 11?", "o": ["61", "62", "56", "66"], "a": 0, "x": "nth term = a + (n - 1) x d = 11 + (11 - 1) x 5 = 11 + 50 = 61.", "cn": "The nth term of an AP is a + (n-1)d. Count the gaps between terms: there are n-1 of them, not n.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "AP nth term"}, {"id": "V-logarithm_basic-8", "q": "What is the value of log base 3 of 9?", "o": ["1", "4", "2", "3"], "a": 2, "x": "log base 3 of 9 asks: 3 to what power gives 9? Since 3^2 = 9, the answer is 2.", "cn": "log base b of N = the power p with b^p = N.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Evaluate or invert a logarithm"}, {"id": "V-coordinate_distance-7", "q": "What is the distance between the points (-2, -3) and (-5, -7)?", "o": ["4", "7", "10", "5"], "a": 3, "x": "Distance = root of ((-3)^2 + (-4)^2) = root of (9 + 16) = root of 25 = 5.", "cn": "Distance = square root of ((x2 - x1)^2 + (y2 - y1)^2). Signs do not matter after squaring.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Distance between two points"}, {"id": "V-pct_up_down-8", "q": "The salary of a worker increases by 50% and then decreases by 15%. What is the net percentage change?", "o": ["35% increase", "27.5% increase", "35% decrease", "28.5% increase"], "a": 1, "x": "Rise 50% then fall 15%: net = 50 - 15 - (50 x 15)/100 = 27.5%, so a 27.5% increase.", "cn": "Percent changes multiply. If a quantity rises by x% and then falls by y% (x and y as positive numbers), net change = x - y - xy/100 percent. With signed changes it is x + y + xy/100.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Successive increase and decrease"}, {"id": "V-quad_root_k-24", "q": "One root of the equation x^2 - 6x + k = 0 is 4. What is the value of k?", "o": ["12", "6", "10", "8"], "a": 3, "x": "Put x = 4: 16 - 24 + k = 0, so k = 8. (The other root is 2, and 4 x 2 = 8.)", "cn": "A root satisfies the equation. Substitute it, or use: product of roots = k, sum of roots = coefficient.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Using a known root of a quadratic"}, {"id": "V-pipes_cistern_two-17", "q": "Pipe A can fill a tank in 4 hours and pipe B can fill it in 12 hours. How long will both pipes together take to fill the tank?", "o": ["16 hours", "8 hours", "3 hours", "4 hours"], "a": 2, "x": "Together they fill 1/4 + 1/12 of the tank per hour, so the time is 4 x 12 / (4 + 12) = 3 hours.", "cn": "Add the rates (fraction of the tank per hour), not the times. Time together = (x x y)/(x + y).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two pipes together"}, {"id": "V-geometric_progression-7", "q": "The first term of a geometric progression is 5 and the common ratio is 2. What is its 4th term?", "o": ["20", "30", "80", "40"], "a": 3, "x": "nth term = a x r^(n-1) = 5 x 2^(4-1) = 5 x 8 = 40.", "cn": "The nth term of a GP is a x r^(n-1). The exponent is n-1, one less than the position.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "GP nth term"}, {"id": "V-surds_indices-7", "q": "What is the value of (3^3 x 3^2) / 3^3?", "o": ["243", "9", "27", "3"], "a": 1, "x": "Add powers on multiplying, subtract on dividing: 3^(3 + 2 - 3) = 3^2 = 9.", "cn": "Same base: a^m x a^n = a^(m+n) and a^m / a^n = a^(m-n). Do the powers step by step.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Product and quotient of powers"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=async()=>{const b=document.getElementById("copy"),c=document.getElementById("code").textContent;try{await navigator.clipboard.writeText(c);b.textContent="Copied"}catch(e){b.textContent="Copy failed - code selected; copy it manually";const r=document.createRange();r.selectNodeContents(document.getElementById("code"));const s=window.getSelection();s.removeAllRanges();s.addRange(r)}};
</script></body></html>
