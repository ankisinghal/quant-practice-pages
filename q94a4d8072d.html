{"id": "V-pipes_cistern_two-45", "q": "One tap fills a cistern in 15 hours and another tap fills it in 30 hours. If both taps are opened together, in how many hours will the cistern be full?", "o": ["22.5 hours", "45 hours", "11 hours", "10 hours"], "a": 3, "x": "Together they fill 1/15 + 1/30 of the tank per hour, so the time is 15 x 30 / (15 + 30) = 10 hours.", "cn": "Add the rates (fraction of the tank per hour), not the times. Time together = (x x y)/(x + y).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two pipes together"},
{"id": "V-logarithm_basic-45", "q": "If log base 5 of x = 4, what is the value of x?", "o": ["3125", "9", "20", "625"], "a": 3, "x": "log base 5 of x = 4 means x = 5^4 = 625.", "cn": "log base b of N = the power p with b^p = N.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Evaluate or invert a logarithm"},
{"id": "V-mensuration_rect-45", "q": "A rectangle's length is 2 times its breadth and its perimeter is 42 cm. Find the area of the rectangle.", "o": ["42 sq cm", "147 sq cm", "98 sq cm", "49 sq cm"], "a": 2, "x": "Perimeter = 2 x (length + width) = 2 x (2w + w) = 6w = 42, so width w = 7 cm and length = 14 cm. Area = 14 x 7 = 98 sq cm.", "cn": "Put length and width in terms of one letter, use the perimeter to solve, then multiply for the area.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Rectangle: length as a multiple of width"},
{"id": "V-l0_percent_of-45", "q": "What is 60% of 60?", "o": ["36", "24", "66", "72"], "a": 0, "x": "60% of 60 = 60/100 x 60 = 36.", "cn": "Percent means per hundred: p% of n = p/100 x n.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Percentage of a number (L0)"},
{"id": "V-l0_ratio_share-45", "q": "Rs 90 are shared between Asha and Tina in the ratio 4 : 5. How many does Asha get?", "o": ["Rs 40", "Rs 50", "Rs 45", "Rs 30"], "a": 0, "x": "Total parts = 4 + 5 = 9. One part = 90 / 9 = 10. Asha gets 4 x 10 = 40.", "cn": "Add the ratio parts, find the value of one part, then multiply.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Sharing in a ratio (L0)"},
{"id": "V-l0_speed_distance-45", "q": "A cyclist travels at 15 km per hour for 5 hours. How far does it travel?", "o": ["60 km", "90 km", "75 km", "20 km"], "a": 2, "x": "Distance = speed x time = 15 x 5 = 75 km.", "cn": "Distance = speed x time.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Distance = speed x time (L0)"},
{"id": "V-l0_profit_simple-45", "q": "An article bought for Rs 100 is sold for Rs 120. What is the profit percent?", "o": ["25%", "20%", "30%", "15%"], "a": 1, "x": "Profit = 120 - 100 = 20. Profit percent = 20/100 x 100 = 20%.", "cn": "Profit percent = profit / cost price x 100 (always on the cost price).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Profit percent, one step (L0)"},
{"id": "V-quad_root_k-45", "q": "One root of the equation x^2 - 12x + k = 0 is 5. What is the value of k?", "o": ["40", "12", "35", "28"], "a": 2, "x": "Put x = 5: 25 - 60 + k = 0, so k = 35. (The other root is 7, and 5 x 7 = 35.)", "cn": "A root satisfies the equation. Substitute it, or use: product of roots = k, sum of roots = coefficient.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Using a known root of a quadratic"},
