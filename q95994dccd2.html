<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Quant practice q95994dccd2</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "q95994dccd2", "date": "2026-11-15", "type": "QA", "level": 1, "qs": [{"id": "V-l0_percent_of-17", "q": "Find 75% of 60.", "o": ["90", "15", "50", "45"], "a": 3, "x": "75% of 60 = 75/100 x 60 = 45.", "cn": "Percent means per hundred: p% of n = p/100 x n.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Percentage of a number (L0)"}, {"id": "V-l0_speed_distance-19", "q": "A train travels at 60 km per hour for 5 hours. How far does it travel?", "o": ["240 km", "65 km", "360 km", "300 km"], "a": 3, "x": "Distance = speed x time = 60 x 5 = 300 km.", "cn": "Distance = speed x time.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Distance = speed x time (L0)"}, {"id": "V-l0_profit_simple-28", "q": "An article bought for Rs 500 is sold for Rs 650. What is the profit percent?", "o": ["30%", "35%", "40%", "25%"], "a": 0, "x": "Profit = 650 - 500 = 150. Profit percent = 150/500 x 100 = 30%.", "cn": "Profit percent = profit / cost price x 100 (always on the cost price).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Profit percent, one step (L0)"}, {"id": "V-pct_markup_discount-17", "q": "A shopkeeper marks a shirt 60% above its cost price and then gives a 10% discount on the marked price. What is the profit percent?", "o": ["44%", "39%", "49%", "50%"], "a": 0, "x": "Take cost = 100. Marked price = 160. Selling price = 160 x 90/100 = 144. Profit = 44%.", "cn": "Successive percentages multiply: they do not add or subtract. Discount is on the marked price, profit is on the cost price.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Mark-up and discount"}, {"id": "V-algebra_identity-16", "q": "Given a + b = 14 and ab = 48, find a^2 + b^2.", "o": ["292", "196", "100", "148"], "a": 2, "x": "x^2 + y^2 = (x + y)^2 - 2xy = 14^2 - 2 x 48 = 196 - 96 = 100.", "cn": "Use the identity x^2 + y^2 = (x + y)^2 - 2xy instead of finding x and y separately.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Square of a sum identity"}, {"id": "V-mixture_add_water-18", "q": "A 48 litre mixture has syrup and water in the ratio 7 : 5. How many litres of water must be added to make the ratio 1 : 1?", "o": ["12 litres", "8 litres", "10 litres", "6 litres"], "a": 1, "x": "Syrup = 28 L and water = 20 L. For 1 : 1 the water must also be 28 L, so add 28-20 = 8 L.", "cn": "Adding water does not change the other part. Keep it fixed and make the other part equal to it.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Adding to change a ratio"}, {"id": "V-quad_root_k-15", "q": "6 is a root of x^2 - 9x + k = 0. Find k.", "o": ["24", "15", "9", "18"], "a": 3, "x": "Put x = 6: 36 - 54 + k = 0, so k = 18. (The other root is 3, and 6 x 3 = 18.)", "cn": "A root satisfies the equation. Substitute it, or use: product of roots = k, sum of roots = coefficient.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Using a known root of a quadratic"}, {"id": "V-l0_area_rect-15", "q": "A rectangular card is 25 cm long and 6 cm wide. What is its area?", "o": ["31 sq cm", "150 sq cm", "300 sq cm", "62 sq cm"], "a": 1, "x": "Area of a rectangle = length x width = 25 x 6 = 150 sq cm.", "cn": "Area of a rectangle = length x width. Perimeter is a different thing (the distance around).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Area of a rectangle (L0)"}, {"id": "V-l0_simple_interest-13", "q": "What is the simple interest on Rs 2000 at 8% per year for 4 years?", "o": ["Rs 1280", "Rs 2640", "Rs 640", "Rs 160"], "a": 2, "x": "Simple interest = P x R x T / 100 = 2000 x 8 x 4 / 100 = Rs 640.", "cn": "Simple interest = principal x rate x time / 100. It is the interest only, not the total amount.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Simple interest, one step (L0)"}, {"id": "A-l0_lcm-an20261115-1", "q": "Two lights flash every 18 seconds and every 30 seconds. They flash together now. After how many seconds will they first flash together again?", "o": ["180 seconds", "90 seconds", "48 seconds", "60 seconds"], "a": 1, "x": "The first common flash is after LCM(18,30). Since 18 = 2 x 3^2 and 30 = 2 x 3 x 5, their LCM is 2 x 3^2 x 5 = 90 seconds.", "cn": "LCM = the smallest number that both numbers divide into. Do not just multiply the numbers unless they share no factor.", "sl": "Original practice item", "t": "LCM of two numbers (L0)"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
