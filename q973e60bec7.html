<script>const D={"id": "q973e60bec7", "date": "2026-10-21", "type": "QA", "level": 1, "qs": [{"id": "V-time_work_two-31", "q": "Ravi can finish a job in 15 days and Sana can finish it in 30 days. Working together, in how many days will they finish it?", "o": ["11 days", "45 days", "22.5 days", "10 days"], "a": 3, "x": "Rates are 1/15 and 1/30 per day. Together 1/15 + 1/30 = 45/450, so the time is 450/45 = 10 days.", "cn": "Add the work done per day (rates), not the days. Time together = (a x b)/(a + b).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two workers together"}, {"id": "V-algebra_identity-31", "q": "If x + y = 10 and xy = 24, what is the value of x^2 + y^2?", "o": ["148", "76", "52", "100"], "a": 2, "x": "x^2 + y^2 = (x + y)^2 - 2xy = 10^2 - 2 x 24 = 100 - 48 = 52.", "cn": "Use the identity x^2 + y^2 = (x + y)^2 - 2xy instead of finding x and y separately.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Square of a sum identity"}, {"id": "V-trains_cross_pole-31", "q": "A train 200 metres long is running at 36 km/h. In how much time will it pass a pole?", "o": ["18 seconds", "20 seconds", "40 seconds", "22 seconds"], "a": 1, "x": "Speed = 36 km/h = 36 x 5/18 = 10 m/s. Time to pass a pole = length / speed = 200 / 10 = 20 seconds.", "cn": "Passing a pole means covering the train's own length. Convert km/h to m/s by multiplying by 5/18.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Train passing a pole"}, {"id": "V-partnership_two-31", "q": "A and B started a business investing Rs 6000 and Rs 14000. Out of a total profit of Rs 4000, what is A's share?", "o": ["Rs 1200", "Rs 1600", "Rs 2800", "Rs 2000"], "a": 0, "x": "Both investments run for the same period, so the profit is shared in the ratio 3 : 7. A's share = 4000 x 3/10 = Rs 1200.", "cn": "When money is invested for the same time, profit is divided in the ratio of the investments.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Sharing a profit in the ratio of investments"}, {"id": "V-ratio_combining-31", "q": "If a : b = 1 : 2 and b : c = 1 : 2, then a : c = ?", "o": ["4 : 1", "1 : 4", "2 : 4", "2 : 2"], "a": 1, "x": "a : c = (a : b) x (b : c) = (1 x 1) : (2 x 2) = 1 : 4 = 1 : 4.", "cn": "Multiply the two ratios term by term, then reduce to lowest terms.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Combining two ratios"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
