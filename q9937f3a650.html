<script>const D={"id": "q9937f3a650", "date": "2026-10-29", "type": "QA", "level": 1, "qs": [{"id": "V-trains_cross_pole-150", "q": "An express train 225 metres long is moving at 54 km/h. How much time will it take to go past a signal pole?", "o": ["13 seconds", "15 seconds", "30 seconds", "17 seconds"], "a": 1, "x": "Passing the pole means covering the train's own length: 54 km/h = 54 x 5/18 = 15 m/s, so time = 225/15 = 15 seconds.", "cn": "Passing a pole means covering the train's own length. Convert km/h to m/s by multiplying by 5/18.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Train passing a pole"}, {"id": "V-boats_streams-50", "q": "A motorboat moves at 15 km/h in still water. The river current flows at 3 km/h. How many hours will the boat take to travel 54 km downstream?", "o": ["4 hours", "3 hours", "4.5 hours", "3.6 hours"], "a": 1, "x": "Downstream speed = 15 + 3 = 18 km/h, so time = 54/18 = 3 hours.", "cn": "Downstream speeds add (boat + stream), upstream speeds subtract. Time = distance / effective speed, not distance / still-water speed.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Downstream time"}, {"id": "V-logarithm_basic-50", "q": "Find the value of log base 5 of 25.", "o": ["3", "4", "1", "2"], "a": 3, "x": "5^2 = 25, so log base 5 of 25 = 2.", "cn": "log base b of N = the power p with b^p = N.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Evaluate or invert a logarithm"}, {"id": "V-time_work_two-14", "q": "Meena can weave a carpet in 6 days and Arun can weave it in 9 days. Working together, in how many days will they finish the carpet?", "o": ["7.5 days", "15 days", "3.6 days", "4.6 days"], "a": 2, "x": "In 1 day they weave 1/6 + 1/9 = 3/18 + 2/18 = 5/18 of the carpet, so together they need 18/5 = 3.6 days.", "cn": "Add the work done per day (rates), not the days. Time together = (a x b)/(a + b).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two workers together"}, {"id": "V-algebra_identity-50", "q": "Given a + b = 17 and ab = 52, find the value of a^2 + b^2.", "o": ["185", "289", "393", "237"], "a": 0, "x": "a^2 + b^2 = (a+b)^2 - 2ab = 289 - 104 = 185.", "cn": "Use the identity x^2 + y^2 = (x + y)^2 - 2xy instead of finding x and y separately.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Square of a sum identity"}, {"id": "V-word_arrangements-50", "q": "How many distinct arrangements can be made using all the letters of the word APPLE?", "o": ["30", "65", "120", "60"], "a": 3, "x": "APPLE has 5 letters with P repeated twice, so arrangements = 5!/2! = 60.", "cn": "n distinct letters can be arranged in n! ways. Divide by the factorial of each repeated count.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Arrangements of letters"}, {"id": "V-compound_interest_2yr-50", "q": "Aman invests Rs 2000 for 2 years at 5% per year, interest compounded yearly. What compound interest does he earn?", "o": ["Rs 255", "Rs 2205", "Rs 205", "Rs 200"], "a": 2, "x": "Amount = 2000 x 1.05 x 1.05 = 2205, so CI = 2205 - 2000 = Rs 205.", "cn": "Compound interest grows on the new amount each year: amount = P x (1 + R/100) for each year. Interest = amount - principal.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Compound interest for 2 years"}, {"id": "V-venn_two_sets-50", "q": "In a society of 100 families, 45 subscribe to a newspaper, 38 subscribe to a magazine, and 12 subscribe to both. How many families subscribe to neither?", "o": ["29", "35", "17", "41"], "a": 0, "x": "Subscribing to at least one = 45 + 38 - 12 = 71, so neither = 100 - 71 = 29.", "cn": "At least one = A + B - both. Neither = total - at least one.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two overlapping groups"}, {"id": "V-inequality_word-50", "q": "A taxi charges Rs 25 fixed plus Rs 18 per km. With a budget of Rs 259, at most how many km can Meera travel?", "o": ["12", "13", "15", "14"], "a": 1, "x": "25 + 18k <= 259, so 18k <= 234, so k <= 13. At most 13 km.", "cn": "Set up fixed + rate x n <= budget, subtract the fixed part, divide, then take the largest whole number that still fits.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Word problem with an upper limit"}, {"id": "V-geometry_lines_angles-50", "q": "Two parallel lines are cut by a transversal. One of the angles formed is 100 degrees. What is its corresponding angle?", "o": ["100 deg", "80 deg", "110 deg", "90 deg"], "a": 0, "x": "Corresponding angles formed by a transversal across parallel lines are equal, so the corresponding angle is 100 degrees.", "cn": "Corresponding and vertically opposite angles are equal; co-interior (same-side) angles add to 180 deg.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Angles on parallel lines"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
