<h1>Quant practice qa8ec0be3da</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>

<script>const D={"id": "qa8ec0be3da", "date": "2026-11-02", "type": "QA", "level": 1, "qs": [{"id": "A-time_work_two-b1", "q": "A and B working together can finish a job in 6 days. A alone can finish it in 15 days. They work together for 3 days, then A leaves. In how many more days will B finish the remaining work?", "o": ["7.5 days", "4 days", "8 days", "5 days"], "a": 3, "x": "Together they do 1/6 of the job per day and A alone does 1/15, so B's rate is 1/6 - 1/15 = 5/30 - 2/30 = 3/30 = 1/10 per day. In 3 days together they finish 3 x 1/6 = 1/2 of the job. B needs (1/2) / (1/10) = 5 more days.", "cn": "Work with rates (fraction per day). Subtract to get B's rate, track the finished part, then divide the remaining part by B's rate.", "sl": "Authored item for a concept (new construction and wording)", "t": "Two workers together"}, {"id": "A-algebra_identity-b1", "q": "If a - b = 4 and ab = 21, what is the value of a^2 + b^2?", "o": ["46", "64", "58", "100"], "a": 2, "x": "(a - b)^2 = a^2 - 2ab + b^2, so 16 = a^2 + b^2 - 42. That gives a^2 + b^2 = 16 + 42 = 58.", "cn": "Use (a - b)^2 = a^2 - 2ab + b^2 and rearrange for a^2 + b^2 instead of finding a and b separately.", "sl": "Authored item for a concept (new construction and wording)", "t": "Square of a difference identity"}, {"id": "A-trains_cross_pole-b1", "q": "A train 270 metres long crosses a pole in 15 seconds. What is the speed of the train in km/h?", "o": ["60 km/h", "64.8 km/h", "54 km/h", "72 km/h"], "a": 1, "x": "Crossing a pole means covering its own length: speed = 270 / 15 = 18 m/s. Convert to km/h: 18 x 18/5 = 64.8 km/h.", "cn": "Passing a pole covers the train's own length. Convert m/s to km/h by multiplying by 18/5.", "sl": "Authored item for a concept (new construction and wording)", "t": "Train passing a pole"}, {"id": "A-boats_streams-b1", "q": "A boat goes 24 km downstream in 2 hours and the same 24 km upstream in 4 hours. What is the speed of the stream?", "o": ["6 km/h", "2 km/h", "4 km/h", "3 km/h"], "a": 3, "x": "Downstream speed = 24/2 = 12 km/h; upstream speed = 24/4 = 6 km/h. Stream speed = (12 - 6) / 2 = 3 km/h.", "cn": "Stream speed = (downstream speed - upstream speed) / 2; boat speed in still water = (downstream + upstream) / 2.", "sl": "Authored item for a concept (new construction and wording)", "t": "Downstream and upstream speeds"}, {"id": "A-pipes_cistern_two-b1", "q": "Pipe A can fill a tank in 12 hours and pipe B can fill it in 18 hours. Pipe A is opened alone for 3 hours, and then pipe B is also opened. How much longer does the tank take to fill after B is opened?", "o": ["5.4 hours", "7.2 hours", "4.5 hours", "6 hours"], "a": 0, "x": "In 3 hours A fills 3/12 = 1/4 of the tank, leaving 3/4. Together the pipes fill 1/12 + 1/18 = 3/36 + 2/36 = 5/36 per hour. Time for the rest = (3/4) / (5/36) = 27/5 = 5.4 hours.", "cn": "Work with rates. Find the part already filled, then divide the remaining part by the combined rate.", "sl": "Authored item for a concept (new construction and wording)", "t": "Two pipes together"}, {"id": "A-logarithm_basic-b1", "q": "What is the value of log base 2 of 16 plus log base 2 of 32?", "o": ["12", "7", "9", "45"], "a": 2, "x": "log base 2 of 16 = 4 (since 2^4 = 16) and log base 2 of 32 = 5 (since 2^5 = 32). The sum is 4 + 5 = 9. (This is also log base 2 of 16 x 32 = log base 2 of 512 = 9.)", "cn": "log base b of N is the power p with b^p = N. A sum of two logs with the same base is the log of the product.", "sl": "Authored item for a concept (new construction and wording)", "t": "Evaluate or invert a logarithm"}, {"id": "A-races-b1", "q": "In a 100 m race, A beats B by 25 m. If B runs 100 metres in 24 seconds, how long does A take to run the 100 metres?", "o": ["18 seconds", "24 seconds", "16 seconds", "20 seconds"], "a": 0, "x": "B's speed is 100/24 m/s. When A finishes, B has covered 75 m, which takes B 75 x 24/100 = 18 seconds. Both run for the same time, so A takes 18 seconds.", "cn": "The winner's time equals the time the loser needs for the distance actually covered at the finish.", "sl": "Authored item for a concept (new construction and wording)", "t": "Race margin and time"}, {"id": "A-compound_interest_2yr-b1", "q": "At what rate of compound interest per year will Rs 5000 amount to Rs 5618 in 2 years, compounded yearly?", "o": ["8%", "5%", "12%", "6%"], "a": 3, "x": "5618 / 5000 = 1.1236 = (1.06)^2. So the yearly multiplier is 1.06, which means the rate is 6% per year.", "cn": "Amount = principal x (1 + r/100)^2 for 2 years. Divide, then recognise the squared multiplier.", "sl": "Authored item for a concept (new construction and wording)", "t": "Compound interest for 2 years"}, {"id": "A-venn_two_sets-b1", "q": "In a class of 60 students, 35 play cricket, 28 play football and 12 play both. How many students play only cricket?", "o": ["23", "16", "28", "47"], "a": 0, "x": "Only cricket = cricket total - both = 35 - 12 = 23. (The 12 who play both are already inside the 35.)", "cn": "Only-one group = that group's total minus the overlap. Neither = total - (A + B - both).", "sl": "Authored item for a concept (new construction and wording)", "t": "Two overlapping groups"}, {"id": "A-word_arrangements-b1", "q": "In how many different ways can the letters of the word PENCIL be arranged so that the two vowels always stay together?", "o": ["120", "240", "720", "48"], "a": 1, "x": "PENCIL has 6 distinct letters with vowels E and I. Bundle the vowels as one unit: the unit plus P, N, C, L gives 5 units, arranged in 5! = 120 ways. The vowels swap inside in 2! = 2 ways. Total = 120 x 2 = 240.", "cn": "For 'stay together', bundle the letters into one unit, arrange the units, then multiply by arrangements inside the bundle.", "sl": "Authored item for a concept (new construction and wording)", "t": "Arrangements of letters"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
