<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quant practice qb2cde3d577</title>

<h1>Quant practice qb2cde3d577</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "qb2cde3d577", "date": "2026-10-26", "type": "QA", "level": 1,"qs":[
{"id": "V-di_growth-39", "q": "Sales (in units) of three products:\nProduct   2024   2025\nS   160   240\nP   120   156\nR   100   160\nThe percentage growth of R from 2024 to 2025 is higher than that of P by how many percentage points?", "o": ["90", "30", "24", "35"], "a": 1, "x": "R grew 60/100 = 60%. P grew 36/120 = 30%. The difference is 60 - 30 = 30 percentage points.", "cn": "Percentage growth = change / old value x 100. A difference between two growth rates is in percentage points.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Percentage growth and percentage-point gap"},
{"id": "V-mensuration_rect-139", "q": "A rectangle's length is 4 times its breadth and its perimeter is 120 cm. Find the area of the rectangle.", "o": ["240 sq cm", "576 sq cm", "720 sq cm", "144 sq cm"], "a": 1, "x": "Perimeter = 2 x (length + width) = 2 x (4w + w) = 10w = 120, so width w = 12 cm and length = 48 cm. Area = 48 x 12 = 576 sq cm.", "cn": "Put length and width in terms of one letter, use the perimeter to solve, then multiply for the area.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Rectangle: length as a multiple of width"},
{"id": "V-remainder_basic-39", "q": "What is the remainder when 23 + 23 is divided by 9?", "o": ["5", "2", "3", "1"], "a": 3, "x": "23 + 23 = 46. 46 = 9 x 5 + 1, so the remainder is 1.", "cn": "Work with remainders first: the remainder of a sum or product is the remainder of the remainders' sum or product.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Remainder of a sum or product"},
{"id": "V-divisibility_check-39", "q": "The three-digit number 3_4 is divisible by 9. What digit fills the blank?", "o": ["5", "4", "3", "2"], "a": 3, "x": "Divisibility by 9 needs the digit sum divisible by 9: 3 + d + 4 = 7 + d. The next multiple of 9 after 7 is 9, so d = 2.", "cn": "Divisibility by 9: digit sum divisible by 9. Divisibility by 11: alternating digit sum is 0 or a multiple of 11.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Divisibility by 9 or 11"},
{"id": "V-factor_count-39", "q": "How many positive factors does 100 have?", "o": ["10", "11", "9", "8"], "a": 2, "x": "100 = 2^2 x 5^2. Number of factors = (2 + 1) x (2 + 1) = 9.", "cn": "Write the number in prime factors p^a x q^b; the factor count is (a+1)(b+1). Listing only works for small numbers.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Counting positive factors"},
{"id": "V-linear_inequality_one-39", "q": "Solve for x: 3x - 5 < 7.", "o": ["x < 4", "x < 3", "x > 4", "x < 5"], "a": 0, "x": "Add 5 to both sides: 3x < 12. Divide by 3: x < 4. Dividing by a positive number keeps the sign.", "cn": "Move constants to one side, divide by the coefficient, and flip the sign ONLY when multiplying or dividing by a negative.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Solve a linear inequality"},
{"id": "V-function_evaluation-39", "q": "If f(x) = 2x, what is the value of f(7)?", "o": ["11", "19", "16", "14"], "a": 3, "x": "f(7) = 2 x 7 = 14.", "cn": "Substitute the number for x everywhere and follow the order of operations.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Evaluate f(x) at a point"},
{"id": "V-statistics_median-39", "q": "The scores of a player in 9 matches are 33, 30, 18, 11, 35, 53, 20, 36, 39. What is the median score?", "o": ["33", "35", "30", "31"], "a": 0, "x": "Arrange in order: 11, 18, 20, 30, 33, 35, 36, 39, 53. The middle (5th) value is 33.", "cn": "Median = the middle value after arranging in order. With an odd count it is the single middle value.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Median of a data set"},
{"id": "V-geometry_lines_angles-39", "q": "Two parallel lines are cut by a transversal. One angle is 55 deg. What is its co-interior angle?", "o": ["125 deg", "75 deg", "65 deg", "90 deg"], "a": 0, "x": "Co-interior angles on parallel lines add to 180 deg: 180 - 55 = 125 deg.", "cn": "Corresponding and vertically opposite angles are equal; co-interior (same-side) angles add to 180 deg.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Angles on parallel lines"},
{"id": "V-geometry_quad_angles-39", "q": "In quadrilateral PQRS, angles P = 90 deg, Q = 95 deg and R = 95 deg. What is angle S?", "o": ["100 deg", "80 deg", "90 deg", "70 deg"], "a": 1, "x": "Angles of a quadrilateral add to 360 deg: S = 360 - 90 - 95 - 95 = 80 deg.", "cn": "A quadrilateral's angles add to 360 deg (two triangles). For a parallelogram, adjacent angles add to 180 deg.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Angle sum of a quadrilateral"}
]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
