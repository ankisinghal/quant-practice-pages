<h1>Quant practice qb38f8151e4</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>

<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "qb38f8151e4", "date": "2026-11-08", "type": "QA", "level": 1, "qs": [{"id": "V-quad_root_k-7", "q": "One root of the equation x^2 - 4x + k = 0 is 3. What is the value of k?", "o": ["3", "2", "4", "6"], "a": 0, "x": "Put x = 3: 9 - 12 + k = 0, so k = 3. (The other root is 1, and 3 x 1 = 3.)", "cn": "A root satisfies the equation. Substitute it, or use: product of roots = k, sum of roots = coefficient.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Using a known root of a quadratic"}, {"id": "V-mensuration_rect-4", "q": "A rectangle's length is 2 times its breadth and its perimeter is 48 cm. Find the area of the rectangle.", "o": ["192 sq cm", "48 sq cm", "64 sq cm", "128 sq cm"], "a": 3, "x": "Perimeter = 2 x (length + width) = 2 x (2w + w) = 6w = 48, so width w = 8 cm and length = 16 cm. Area = 16 x 8 = 128 sq cm.", "cn": "Put length and width in terms of one letter, use the perimeter to solve, then multiply for the area.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Rectangle: length as a multiple of width"}, {"id": "V-l0_average-4", "q": "Find the average of 34, 34, 44, 46, 42.", "o": ["40", "41", "39", "42"], "a": 0, "x": "Sum = 200. Number of values = 5. Average = 200 / 5 = 40.", "cn": "Average = sum of the values / number of values.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Average of numbers (L0)"}, {"id": "V-l0_ratio_share-4", "q": "Rs 150 are shared between Mira and Ravi in the ratio 3 : 2. How many does Mira get?", "o": ["Rs 75", "Rs 60", "Rs 120", "Rs 90"], "a": 3, "x": "Total parts = 3 + 2 = 5. One part = 150 / 5 = 30. Mira gets 3 x 30 = 90.", "cn": "Add the ratio parts, find the value of one part, then multiply.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Sharing in a ratio (L0)"}, {"id": "V-pipes_cistern_two-7", "q": "One tap fills a cistern in 8 hours and another tap fills it in 24 hours. If both taps are opened together, in how many hours will the cistern be full?", "o": ["32 hours", "16 hours", "6 hours", "7 hours"], "a": 2, "x": "Together they fill 1/8 + 1/24 of the tank per hour, so the time is 8 x 24 / (8 + 24) = 6 hours.", "cn": "Add the rates (fraction of the tank per hour), not the times. Time together = (x x y)/(x + y).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two pipes together"}, {"id": "V-venn_two_sets-4", "q": "In a group of 100 people, 50 like tea, 42 like coffee and 10 like both. How many like neither?", "o": ["23", "18", "8", "28"], "a": 1, "x": "Like at least one = 50 + 42 - 10 (both counted twice) = 82. Neither = 100 - 82 = 18.", "cn": "At least one = A + B - both. Neither = total - at least one.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two overlapping groups"}, {"id": "V-geometry_quad_angles-4", "q": "In quadrilateral PQRS, angles P = 80 deg, Q = 110 deg and R = 100 deg. What is angle S?", "o": ["110 deg", "80 deg", "60 deg", "70 deg"], "a": 3, "x": "Angles of a quadrilateral add to 360 deg: S = 360 - 80 - 110 - 100 = 70 deg.", "cn": "A quadrilateral's angles add to 360 deg (two triangles). For a parallelogram, adjacent angles add to 180 deg.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Angle sum of a quadrilateral"}, {"id": "V-average_new_member-4", "q": "The mean of 5 marks is 32. A new mark is added and the mean goes up by 3. Find the new mark.", "o": ["53", "50", "35", "47"], "a": 1, "x": "New total = (5+1) x (32+3) = 210. Old total = 5 x 32 = 160. The new number is 210 - 160 = 50.", "cn": "Total = average x count. The new value is the new total minus the old total.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Average after a new value is added"}, {"id": "V-pct_up_down-4", "q": "The price of a phone increases by 40% and then decreases by 15%. What is the net percentage change?", "o": ["25% increase", "20% increase", "19% increase", "25% decrease"], "a": 2, "x": "Rise 40% then fall 15%: net = 40 - 15 - (40 x 15)/100 = 19%, so a 19% increase.", "cn": "Percent changes multiply. If a quantity rises by x% and then falls by y% (x and y as positive numbers), net change = x - y - xy/100 percent. With signed changes it is x + y + xy/100.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Successive increase and decrease"}, {"id": "V-compound_interest_2yr-5", "q": "Find the compound interest on Rs 8000 for 2 years at 20% per year, compounded yearly.", "o": ["Rs 3200", "Rs 3720", "Rs 3520", "Rs 11520"], "a": 2, "x": "Amount after 2 years = 8000 x 1.2 x 1.2 = Rs 11520. Compound interest = 11520 - 8000 = Rs 3520. (Simple interest would be Rs 3200.)", "cn": "Compound interest grows on the new amount each year: amount = P x (1 + R/100) for each year. Interest = amount - principal.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Compound interest for 2 years"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
