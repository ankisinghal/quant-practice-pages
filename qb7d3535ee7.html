<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quant practice qb7d3535ee7</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Quant practice qb7d3535ee7</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "qb7d3535ee7", "date": "2026-11-18", "type": "QA", "level": 1, "qs": [{"id": "V-l0_percent_of-21", "q": "Find 40% of 200.", "o": ["120", "80", "160", "100"], "a": 1, "x": "40% of 200 = 40/100 x 200 = 80.", "cn": "Percent means per hundred: p% of n = p/100 x n.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Percentage of a number (L0)"}, {"id": "V-l0_speed_distance-25", "q": "A train travels at 30 km per hour for 4 hours. How far does it travel?", "o": ["150 km", "34 km", "90 km", "120 km"], "a": 3, "x": "Distance = speed x time = 30 x 4 = 120 km.", "cn": "Distance = speed x time.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Distance = speed x time (L0)"}, {"id": "V-l0_profit_simple-42", "q": "An article bought for Rs 200 is sold for Rs 240. What is the profit percent?", "o": ["20%", "25%", "15%", "30%"], "a": 0, "x": "Profit = 240 - 200 = 40. Profit percent = 40/200 x 100 = 20%.", "cn": "Profit percent = profit / cost price x 100 (always on the cost price).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Profit percent, one step (L0)"}, {"id": "V-pct_markup_discount-25", "q": "The marked price of a watch is 40% more than its cost. It is sold after allowing a discount of 20%. Find the profit percent.", "o": ["17%", "20%", "12%", "7%"], "a": 2, "x": "Take cost = 100. Marked price = 140. Selling price = 140 x 80/100 = 112. Profit = 12%.", "cn": "Successive percentages multiply: they do not add or subtract. Discount is on the marked price, profit is on the cost price.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Mark-up and discount"}, {"id": "V-algebra_identity-20", "q": "Given a + b = 15 and ab = 50, find a^2 + b^2.", "o": ["225", "175", "325", "125"], "a": 3, "x": "x^2 + y^2 = (x + y)^2 - 2xy = 15^2 - 2 x 50 = 225 - 100 = 125.", "cn": "Use the identity x^2 + y^2 = (x + y)^2 - 2xy instead of finding x and y separately.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Square of a sum identity"}, {"id": "V-mixture_add_water-22", "q": "A 20 litre mixture has syrup and water in the ratio 3 : 2. How many litres of water must be added to make the ratio 1 : 1?", "o": ["2 litres", "4 litres", "8 litres", "6 litres"], "a": 1, "x": "Syrup = 12 L and water = 8 L. For 1 : 1 the water must also be 12 L, so add 12-8 = 4 L.", "cn": "Adding water does not change the other part. Keep it fixed and make the other part equal to it.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Adding to change a ratio"}, {"id": "V-quad_root_k-18", "q": "One root of the equation x^2 - 9x + k = 0 is 5. What is the value of k?", "o": ["20", "16", "9", "25"], "a": 0, "x": "Put x = 5: 25 - 45 + k = 0, so k = 20. (The other root is 4, and 5 x 4 = 20.)", "cn": "A root satisfies the equation. Substitute it, or use: product of roots = k, sum of roots = coefficient.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Using a known root of a quadratic"}, {"id": "V-l0_area_rect-21", "q": "A rectangular card is 25 cm long and 9 cm wide. What is its area?", "o": ["68 sq cm", "34 sq cm", "225 sq cm", "450 sq cm"], "a": 2, "x": "Area of a rectangle = length x width = 25 x 9 = 225 sq cm.", "cn": "Area of a rectangle = length x width. Perimeter is a different thing (the distance around).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Area of a rectangle (L0)"}, {"id": "V-l0_simple_interest-19", "q": "What is the simple interest on Rs 5000 at 8% per year for 4 years?", "o": ["Rs 1600", "Rs 3200", "Rs 6600", "Rs 400"], "a": 0, "x": "Simple interest = P x R x T / 100 = 5000 x 8 x 4 / 100 = Rs 1600.", "cn": "Simple interest = principal x rate x time / 100. It is the interest only, not the total amount.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Simple interest, one step (L0)"}, {"id": "A-l0_lcm-an20261118-1", "q": "A ribbon must be cut into pieces that are each exactly 26 cm long, and the same original ribbon can also be cut into pieces that are each exactly 39 cm long, with no ribbon left over in either case. What is the SMALLEST possible length of the original ribbon?", "o": ["65 cm", "78 cm", "52 cm", "156 cm"], "a": 1, "x": "The ribbon length must be a common multiple of 26 and 39. LCM(26,39)=78, so the smallest possible length is 78 cm.", "cn": "LCM = the smallest number that both numbers divide into. Do not just multiply the numbers unless they share no factor.", "sl": "Original practice item", "t": "LCM of two numbers (L0)"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
