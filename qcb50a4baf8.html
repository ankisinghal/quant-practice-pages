<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quant practice qcb50a4baf8</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Quant practice qcb50a4baf8</h1><p>5 questions &middot; level L0 &middot; about 10 to 15 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "qcb50a4baf8", "date": "2026-10-12", "type": "QA", "level": 0, "qs": [{"id": "V-l0_percent_of-12", "q": "What is 50% of 300?", "o": ["150", "160", "175", "300"], "a": 0, "x": "50% of 300 = 50/100 x 300 = 150.", "cn": "Percent means per hundred: p% of n = p/100 x n.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Percentage of a number (L0)"}, {"id": "V-l0_ratio_share-12", "q": "Rs 120 are shared between Imran and Mira in the ratio 2 : 4. How many does Imran get?", "o": ["Rs 60", "Rs 20", "Rs 80", "Rs 40"], "a": 3, "x": "Total parts = 2 + 4 = 6. One part = 120 / 6 = 20. Imran gets 2 x 20 = 40.", "cn": "Add the ratio parts, find the value of one part, then multiply.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Sharing in a ratio (L0)"}, {"id": "V-l0_average-12", "q": "Find the average of 48, 36, 36, 40.", "o": ["39", "40", "41", "42"], "a": 1, "x": "Sum = 160. Number of values = 4. Average = 160 / 4 = 40.", "cn": "Average = sum of the values / number of values.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Average of numbers (L0)"}, {"id": "V-l0_speed_distance-12", "q": "A car travels at 30 km per hour for 5 hours. How far does it travel?", "o": ["120 km", "180 km", "150 km", "35 km"], "a": 2, "x": "Distance = speed x time = 30 x 5 = 150 km.", "cn": "Distance = speed x time.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Distance = speed x time (L0)"}, {"id": "V-l0_profit_simple-12", "q": "An article bought for Rs 250 is sold for Rs 325. What is the profit percent?", "o": ["25%", "35%", "40%", "30%"], "a": 3, "x": "Profit = 325 - 250 = 75. Profit percent = 75/250 x 100 = 30%.", "cn": "Profit percent = profit / cost price x 100 (always on the cost price).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Profit percent, one step (L0)"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="QL|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
