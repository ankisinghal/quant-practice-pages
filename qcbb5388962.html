<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quant practice qcbb5388962</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Quant practice qcbb5388962</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "qcbb5388962", "date": "2026-11-27", "type": "QA", "level": 1, "qs": [{"id": "V-algebra_identity-24", "q": "If x + y = 20 and xy = 75, what is the value of x^2 + y^2?", "o": ["325", "550", "400", "250"], "a": 3, "x": "x^2 + y^2 = (x + y)^2 - 2xy = 20^2 - 2 x 75 = 400 - 150 = 250.", "cn": "Use the identity x^2 + y^2 = (x + y)^2 - 2xy instead of finding x and y separately.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Square of a sum identity"}, {"id": "V-divisibility_check-7", "q": "The four-digit number 678_ is divisible by 11. What digit fills the blank?", "o": ["0", "7", "9", "8"], "a": 1, "x": "Divisibility by 11 needs (sum of odd-place digits) - (sum of even-place digits) to be 0 or a multiple of 11: (6 + 8) - (7 + d) = 7 - d = 0, so d = 7.", "cn": "Divisibility by 9: digit sum divisible by 9. Divisibility by 11: alternating digit sum is 0 or a multiple of 11.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Divisibility by 9 or 11"}, {"id": "V-factor_count-11", "q": "How many positive factors does 36 have?", "o": ["11", "9", "8", "10"], "a": 1, "x": "36 = 2^2 x 3^2. Number of factors = (2 + 1) x (2 + 1) = 9.", "cn": "Write the number in prime factors p^a x q^b; the factor count is (a+1)(b+1). Listing only works for small numbers.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Counting positive factors"}, {"id": "V-inequality_word-6", "q": "A taxi charges Rs 25 fixed plus Rs 8 per km. With a budget of Rs 97, at most how many km are possible?", "o": ["10", "8", "9", "11"], "a": 2, "x": "Fixed + per-unit x n <= budget: 25 + 8n <= 97, so n <= (97 - 25)/8 = 9. Largest whole number: 9.", "cn": "Set up fixed + rate x n <= budget, subtract the fixed part, divide, then take the largest whole number that still fits.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Word problem with an upper limit"}, {"id": "V-geometry_triangle_angles-7", "q": "In triangle ABC, angle A = 35 deg and angle B = 55 deg. What is angle C?", "o": ["90 deg", "95 deg", "85 deg", "100 deg"], "a": 0, "x": "Angles of a triangle add to 180 deg: C = 180 - 35 - 55 = 90 deg.", "cn": "Interior angles of a triangle add to 180 deg; an exterior angle equals the sum of the two opposite interior angles.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Angle sum of a triangle"}, {"id": "V-mixture_add_water-25", "q": "A 60 litre mixture has juice and water in the ratio 7 : 5. How many litres of water must be added to make the ratio 1 : 1?", "o": ["10 litres", "12 litres", "8 litres", "14 litres"], "a": 0, "x": "Juice = 35 L and water = 25 L. For 1 : 1 the water must also be 35 L, so add 35-25 = 10 L.", "cn": "Adding water does not change the other part. Keep it fixed and make the other part equal to it.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Adding to change a ratio"}, {"id": "V-units_digit-7", "q": "What is the units digit of 9^14?", "o": ["7", "9", "3", "1"], "a": 3, "x": "Units digits of powers of 9 repeat as 9, 1. 14 divided by 2 leaves remainder 0; a remainder of 0 means it sits at the last place of the cycle, so the digit is 1.", "cn": "Units digits of powers repeat in a short cycle. Find the remainder of the power divided by the cycle length.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Units digit of a power"}, {"id": "V-di_growth-7", "q": "Sales (in books) of three products:\nProduct   2024   2025\nR   300   525\nT   100   120\nS   400   440\nThe percentage growth of R from 2024 to 2025 is higher than that of T by how many percentage points?", "o": ["95", "205", "60", "55"], "a": 3, "x": "R grew 225/300 = 75%. T grew 20/100 = 20%. The difference is 75 - 20 = 55 percentage points.", "cn": "Percentage growth = change / old value x 100. A difference between two growth rates is in percentage points.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Percentage growth and percentage-point gap"}, {"id": "V-ages_ratio_sum-8", "q": "The ages of Meena and Ravi are in the ratio 3 : 4 and their ages add up to 28 years. What will Meena's age be after 6 years?", "o": ["18 years", "12 years", "14 years", "22 years"], "a": 0, "x": "Total parts = 3 + 4 = 7, so one part = 28 / 7 = 4 years. Meena is 3 x 4 = 12 years now, so 12 + 6 = 18 years after 6 years.", "cn": "Split the total in the ratio to get the present ages first, then add the years that pass.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Ages from a ratio and a total"}, {"id": "V-venn_two_sets-9", "q": "In a group of 80 people, 45 like tea, 30 like coffee and 10 like both. How many like neither?", "o": ["20", "15", "25", "5"], "a": 1, "x": "Like at least one = 45 + 30 - 10 (both counted twice) = 65. Neither = 80 - 65 = 15.", "cn": "At least one = A + B - both. Neither = total - at least one.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two overlapping groups"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=async()=>{const b=document.getElementById("copy"),c=document.getElementById("code").textContent;try{await navigator.clipboard.writeText(c);b.textContent="Copied"}catch(e){b.textContent="Copy failed - code selected; copy it manually";const r=document.createRange();r.selectNodeContents(document.getElementById("code"));const s=window.getSelection();s.removeAllRanges();s.addRange(r)}};
</script></body></html>
