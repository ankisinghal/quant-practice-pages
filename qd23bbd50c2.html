changed)", "t": "Divisibility by 9 or 11"}, {"id": "V-factor_count-60", "q": "How many positive factors does 675 have?", "o": ["14", "12", "11", "13"], "a": 1, "x": "675 = 3^3 x 5^2. Number of factors = (3 + 1) x (2 + 1) = 12.", "cn": "Write the number in prime factors p^a x q^b; the factor count is (a+1)(b+1). Listing only works for small numbers.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Counting positive factors"}, {"id": "V-linear_inequality_one-60", "q": "Solve for x: 2x - 9 < 1.", "o": ["x > 5", "x < 6", "x < 4", "x < 5"], "a": 3, "x": "Add 9 to both sides: 2x < 10. Divide by 2: x < 5. Dividing by a positive number keeps the sign.", "cn": "Move constants to one side, divide by the coefficient, and flip the sign ONLY when multiplying or dividing by a negative.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Solve a linear inequality"}, {"id": "V-quad_root_k-60", "q": "One root of the equation x^2 - 9x + k = 0 is 2. What is the value of k?", "o": ["9", "7", "14", "16"], "a": 2, "x": "Put x = 2: 4 - 18 + k = 0, so k = 14. (The other root is 7, and 2 x 7 = 14.)", "cn": "A root satisfies the equation. Substitute it, or use: product of roots = k, sum of roots = coefficient.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Using a known root of a quadratic"}, {"id": "V-mensuration_rect-60", "q": "A rectangle's length is 2 times its breadth and its perimeter is 54 cm. Find the area of the rectangle.", "o": ["162 sq cm", "81 sq cm", "243 sq cm", "54 sq cm"], "a": 0, "x": "Perimeter = 2 x (length + width) = 2 x (2w + w) = 6w = 54, so width w = 9 cm and length = 18 cm. Area = 18 x 9 = 162 sq cm.", "cn": "Put length and width in terms of one letter, use the perimeter to solve, then multiply for the area.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Rectangle: length as a multiple of width"}, {"id": "V-l0_average-60", "q": "Find the average of 32, 40, 24, 24, 30.", "o": ["32", "30", "31", "29"], "a": 1, "x": "Sum = 150. Number of values = 5. Average = 150 / 5 = 30.", "cn": "Average = sum of the values / number of values.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Average of numbers (L0)"}, {"id": "V-l0_ratio_share-61", "q": "80 pencils are shared between Tina and Ravi in the ratio 3 : 5. How many does Tina get?", "o": ["20", "50", "30", "40"], "a": 2, "x": "Total parts = 3 + 5 = 8. One part = 80 / 8 = 10. Tina gets 3 x 10 = 30.", "cn": "Add the ratio parts, find the value of one part, then multiply.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Sharing in a ratio (L0)"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
