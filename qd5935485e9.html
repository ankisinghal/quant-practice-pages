<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quant practice qd5935485e9</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Quant practice qd5935485e9</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "qd5935485e9", "date": "2026-11-06", "type": "QA", "level": 1, "qs": [{"id": "V-quad_root_k-4", "q": "One root of the equation x^2 - 8x + k = 0 is 6. What is the value of k?", "o": ["10", "8", "12", "18"], "a": 2, "x": "Put x = 6: 36 - 48 + k = 0, so k = 12. (The other root is 2, and 6 x 2 = 12.)", "cn": "A root satisfies the equation. Substitute it, or use: product of roots = k, sum of roots = coefficient.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Using a known root of a quadratic"}, {"id": "V-mensuration_rect-3", "q": "The length of a rectangle is 3 times its width. If the perimeter of the rectangle is 96 cm, what is its area?", "o": ["432 sq cm", "576 sq cm", "468 sq cm", "144 sq cm"], "a": 0, "x": "Perimeter = 2 x (length + width) = 2 x (3w + w) = 8w = 96, so width w = 12 cm and length = 36 cm. Area = 36 x 12 = 432 sq cm.", "cn": "Put length and width in terms of one letter, use the perimeter to solve, then multiply for the area.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Rectangle: length as a multiple of width"}, {"id": "V-l0_average-3", "q": "Find the average of 18, 16, 16, 8, 12.", "o": ["13", "14", "16", "15"], "a": 1, "x": "Sum = 70. Number of values = 5. Average = 70 / 5 = 14.", "cn": "Average = sum of the values / number of values.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Average of numbers (L0)"}, {"id": "V-l0_ratio_share-3", "q": "180 pencils are shared between Tina and Asha in the ratio 5 : 4. How many does Tina get?", "o": ["80", "120", "90", "100"], "a": 3, "x": "Total parts = 5 + 4 = 9. One part = 180 / 9 = 20. Tina gets 5 x 20 = 100.", "cn": "Add the ratio parts, find the value of one part, then multiply.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Sharing in a ratio (L0)"}, {"id": "V-pipes_cistern_two-6", "q": "Pipe A can fill a tank in 9 hours and pipe B can fill it in 18 hours. How long will both pipes together take to fill the tank?", "o": ["6 hours", "13.5 hours", "27 hours", "7 hours"], "a": 0, "x": "Together they fill 1/9 + 1/18 of the tank per hour, so the time is 9 x 18 / (9 + 18) = 6 hours.", "cn": "Add the rates (fraction of the tank per hour), not the times. Time together = (x x y)/(x + y).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two pipes together"}, {"id": "V-venn_two_sets-3", "q": "In a group of 80 people, 50 like tea, 42 like coffee and 12 like both. How many like neither?", "o": ["0", "12", "80", "6"], "a": 0, "x": "Like at least one = 50 + 42 - 12 (both counted twice) = 80. Neither = 80 - 80 = 0.", "cn": "At least one = A + B - both. Neither = total - at least one.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two overlapping groups"}, {"id": "V-geometry_quad_angles-3", "q": "In quadrilateral PQRS, angles P = 80 deg, Q = 95 deg and R = 115 deg. What is angle S?", "o": ["110 deg", "80 deg", "70 deg", "60 deg"], "a": 2, "x": "Angles of a quadrilateral add to 360 deg: S = 360 - 80 - 95 - 115 = 70 deg.", "cn": "A quadrilateral's angles add to 360 deg (two triangles). For a parallelogram, adjacent angles add to 180 deg.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Angle sum of a quadrilateral"}, {"id": "V-average_new_member-3", "q": "The mean of 4 marks is 58. A new mark is added and the mean goes up by 3. Find the new mark.", "o": ["61", "70", "73", "76"], "a": 2, "x": "New total = (4+1) x (58+3) = 305. Old total = 4 x 58 = 232. The new number is 305 - 232 = 73.", "cn": "Total = average x count. The new value is the new total minus the old total.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Average after a new value is added"}, {"id": "V-pct_up_down-3", "q": "The price of a phone increases by 30% and then decreases by 15%. What is the net percentage change?", "o": ["11.5% increase", "15% increase", "15% decrease", "10.5% increase"], "a": 3, "x": "Rise 30% then fall 15%: net = 30 - 15 - (30 x 15)/100 = 10.5%, so a 10.5% increase.", "cn": "Percent changes multiply. If a quantity rises by x% and then falls by y% (x and y as positive numbers), net change = x - y - xy/100 percent. With signed changes it is x + y + xy/100.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Successive increase and decrease"}, {"id": "V-compound_interest_2yr-4", "q": "Find the compound interest on Rs 4000 for 2 years at 20% per year, compounded yearly.", "o": ["Rs 1960", "Rs 5760", "Rs 1600", "Rs 1760"], "a": 3, "x": "Amount after 2 years = 4000 x 1.2 x 1.2 = Rs 5760. Compound interest = 5760 - 4000 = Rs 1760. (Simple interest would be Rs 1600.)", "cn": "Compound interest grows on the new amount each year: amount = P x (1 + R/100) for each year. Interest = amount - principal.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Compound interest for 2 years"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
