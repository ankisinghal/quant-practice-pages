<script>const D={"id":"qd5edfaf3a5","date":"2026-11-21","type":"QA","level":1,"qs":[{"id":"A-speed_conversion-r20261121","q":"A cyclist covers 900 m in 3 minutes. What is the cyclist's average speed in km/h?","o":["12 km/h","18 km/h","15 km/h","21 km/h"],"a":1,"x":"900 m is 0.9 km and 3 minutes is 1/20 hour. Speed = 0.9 / (1/20) = 18 km/h.","cn":"Use the stated conditions.","sl":"Original practice item","t":"speed_conversion"},{"id":"A-compound_interest_2yr-r20261121","q":"A sum of Rs 25,000 is invested at compound interest, compounded annually. The rate is 6% in the first year and 4% in the second year. What is the total interest earned in the two years?","o":["Rs 2,560","Rs 2,500","Rs 2,060","Rs 2,660"],"a":0,"x":"After one year the amount is 25000 x 1.06 = 26500. Second-year interest is 4% of 26500 = 1060. Total interest = 1500 + 1060 = 2560.","cn":"Use the stated conditions.","sl":"Original practice item","t":"compound_interest_2yr"},{"id":"A-linear_equation_one-r20261121","q":"If 5(x - 2) = 3x + 14, what is the value of x?","o":["10","11","14","12"],"a":3,"x":"5x - 10 = 3x + 14, so 2x = 24 and x = 12.","cn":"Use the stated conditions.","sl":"Original practice item","t":"linear_equation_one"},{"id":"A-geometry_triangle_angles-r20261121","q":"The three interior angles of a triangle are in the ratio 2 : 3 : 4. What is the largest angle?","o":["60\u00b0","90\u00b0","80\u00b0","100\u00b0"],"a":2,"x":"The parts total 9, so one part is 180/9 = 20 degrees. The largest angle is 4 x 20 = 80 degrees.","cn":"Use the stated conditions.","sl":"Original practice item","t":"geometry_triangle_angles"},{"id":"A-trains_relative_speed-r20261121","q":"A 180 m train travelling at 54 km/h meets a 120 m train travelling at 36 km/h in the opposite direction. How long do they take to cross each other completely?","o":["12 seconds","9 seconds","10 seconds","15 seconds"],"a":0,"x":"Relative speed is 54 + 36 = 90 km/h = 25 m/s. Total distance is 180 + 120 = 300 m, so time = 300/25 = 12 seconds.","cn":"Use the stated conditions.","sl":"Original practice item","t":"trains_relative_speed"},{"id":"A-statistics_mode-r20261121v2","q":"The practice scores of a swimmer are 14, 18, 14, 20, 18, 14 and 22. What is the mode of the scores?","o":["16","18","14","20"],"a":2,"x":"The score 14 occurs three times, more often than any other score, so the mode is 14.","cn":"Use the stated conditions.","sl":"Original practice item","t":"statistics_mode"},{"id":"A-ratio_share-r20261121v3","q":"A 84 cm ribbon is cut into two pieces in the ratio 3 : 4. What is the length of the longer piece?","o":["36 cm","42 cm","56 cm","48 cm"],"a":3,"x":"The ratio has 3 + 4 = 7 parts. Each part is 84/7 = 12 cm, so the longer 4-part piece is 48 cm.","cn":"Use the stated conditions.","sl":"Original practice item","t":"ratio_share"},{"id":"A-probability_bag-r20261121v3","q":"A bag contains 5 red balls and 7 blue balls. One ball is drawn at random. What is the probability that it is blue?","o":["5/12","7/12","1/2","2/3"],"a":1,"x":"There are 12 balls in all and 7 are blue, so the probability is 7/12.","cn":"Use the stated conditions.","sl":"Original practice item","t":"probability_bag"},{"id":"A-lcm_hcf-r20261121","q":"What is the sum of the LCM and HCF of 18 and 30?","o":["90","102","108","96"],"a":3,"x":"The LCM of 18 and 30 is 90 and the HCF is 6, so the sum is 96.","cn":"Use the stated conditions.","sl":"Original practice item","t":"lcm_hcf"},{"id":"A-decimal_fraction-r20261121v2","q":"Write 0.625 as a fraction in its lowest terms.","o":["5/8","3/5","7/12","13/20"],"a":0,"x":"0.625 = 625/1000. Dividing numerator and denominator by 125 gives 5/8.","cn":"Use the stated conditions.","sl":"Original practice item","t":"decimal_fraction"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
