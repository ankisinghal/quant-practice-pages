<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quant practice qd85af9c307</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Quant practice qd85af9c307</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "qd85af9c307", "date": "2026-11-09", "type": "QA", "level": 1, "qs": [{"id": "V-l0_percent_of-6", "q": "Find 10% of 60.", "o": ["12", "11", "6", "54"], "a": 2, "x": "10% of 60 = 10/100 x 60 = 6.", "cn": "Percent means per hundred: p% of n = p/100 x n.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Percentage of a number (L0)"}, {"id": "V-l0_speed_distance-6", "q": "A cyclist travels at 15 km per hour for 4 hours. How far does it travel?", "o": ["45 km", "60 km", "75 km", "19 km"], "a": 1, "x": "Distance = speed x time = 15 x 4 = 60 km.", "cn": "Distance = speed x time.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Distance = speed x time (L0)"}, {"id": "V-l0_profit_simple-6", "q": "An article bought for Rs 800 is sold for Rs 1000. What is the profit percent?", "o": ["20%", "30%", "35%", "25%"], "a": 3, "x": "Profit = 1000 - 800 = 200. Profit percent = 200/800 x 100 = 25%.", "cn": "Profit percent = profit / cost price x 100 (always on the cost price).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Profit percent, one step (L0)"}, {"id": "V-pct_markup_discount-6", "q": "The marked price of a shirt is 20% more than its cost. It is sold after allowing a discount of 5%. Find the profit percent.", "o": ["15%", "14%", "9%", "19%"], "a": 1, "x": "Take cost = 100. Marked price = 120. Selling price = 120 x 95/100 = 114. Profit = 14%.", "cn": "Successive percentages multiply: they do not add or subtract. Discount is on the marked price, profit is on the cost price.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Mark-up and discount"}, {"id": "V-algebra_identity-8", "q": "Given a + b = 14 and ab = 45, find a^2 + b^2.", "o": ["106", "286", "151", "196"], "a": 0, "x": "x^2 + y^2 = (x + y)^2 - 2xy = 14^2 - 2 x 45 = 196 - 90 = 106.", "cn": "Use the identity x^2 + y^2 = (x + y)^2 - 2xy instead of finding x and y separately.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Square of a sum identity"}, {"id": "V-mixture_add_water-7", "q": "A 64 litre mixture has juice and water in the ratio 5 : 3. How many litres of water must be added to make the ratio 1 : 1?", "o": ["18 litres", "14 litres", "20 litres", "16 litres"], "a": 3, "x": "Juice = 40 L and water = 24 L. For 1 : 1 the water must also be 40 L, so add 40-24 = 16 L.", "cn": "Adding water does not change the other part. Keep it fixed and make the other part equal to it.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Adding to change a ratio"}, {"id": "V-quad_root_k-8", "q": "6 is a root of x^2 - 7x + k = 0. Find k.", "o": ["12", "7", "5", "6"], "a": 3, "x": "Put x = 6: 36 - 42 + k = 0, so k = 6. (The other root is 1, and 6 x 1 = 6.)", "cn": "A root satisfies the equation. Substitute it, or use: product of roots = k, sum of roots = coefficient.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Using a known root of a quadratic"}, {"id": "V-l0_area_rect-6", "q": "A room is 20 m long and 10 m wide. What is its area?", "o": ["400 sq m", "30 sq m", "200 sq m", "60 sq m"], "a": 2, "x": "Area of a rectangle = length x width = 20 x 10 = 200 sq m.", "cn": "Area of a rectangle = length x width. Perimeter is a different thing (the distance around).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Area of a rectangle (L0)"}, {"id": "V-l0_simple_interest-7", "q": "What is the simple interest on Rs 8000 at 10% per year for 3 years?", "o": ["Rs 4800", "Rs 10400", "Rs 2400", "Rs 800"], "a": 2, "x": "Simple interest = P x R x T / 100 = 8000 x 10 x 3 / 100 = Rs 2400.", "cn": "Simple interest = principal x rate x time / 100. It is the interest only, not the total amount.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Simple interest, one step (L0)"}, {"id": "V-l0_lcm-21", "q": "Find the LCM of 4 and 6.", "o": ["12", "24", "16", "2"], "a": 0, "x": "Multiples of 4: 4, 8, 12, ... Multiples of 6: 6, 12, ... The smallest common multiple is 12.", "cn": "LCM = the smallest number that both numbers divide into. Do not just multiply the numbers unless they share no factor.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "LCM of two numbers (L0)"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
