<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>

<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "qd9d101fb31", "date": "2026-10-29", "type": "QA", "level": 1, "qs": [{"id": "V-l0_sum_diff-48", "q": "Two numbers add up to 68. Their difference is 16. Find the bigger number.", "o": ["32", "42", "34", "26"], "a": 1, "x": "Larger = (sum + difference) / 2 = (68 + 16) / 2 = 84 / 2 = 42. (Smaller = 42 - 16 = 26.)", "cn": "Larger number = (sum + difference) / 2; smaller = (sum - difference) / 2.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Sum and difference (L0)"}, {"id": "V-remainder_basic-48", "q": "What is the remainder when 25 x 17 is divided by 9?", "o": ["1", "3", "2", "4"], "a": 2, "x": "Remainders multiply: 25 = 9 x 2 + 7 and 17 = 9 x 1 + 8. So the remainder is (7 x 8) mod 9 = 56 mod 9 = 2.", "cn": "Work with remainders first: the remainder of a sum or product is the remainder of the remainders' sum or product.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Remainder of a sum or product"}, {"id": "V-divisibility_check-48", "q": "The four-digit number 236_ is divisible by 11. What digit fills the blank?", "o": ["7", "6", "8", "5"], "a": 3, "x": "Divisibility by 11 needs (sum of odd-place digits) - (sum of even-place digits) to be 0 or a multiple of 11: (2 + 6) - (3 + d) = 5 - d = 0, so d = 5.", "cn": "Divisibility by 9: digit sum divisible by 9. Divisibility by 11: alternating digit sum is 0 or a multiple of 11.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Divisibility by 9 or 11"}, {"id": "V-factor_count-48", "q": "How many positive factors does 200 have?", "o": ["11", "13", "12", "14"], "a": 2, "x": "200 = 2^3 x 5^2. Number of factors = (3 + 1) x (2 + 1) = 12.", "cn": "Write the number in prime factors p^a x q^b; the factor count is (a+1)(b+1). Listing only works for small numbers.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Counting positive factors"}, {"id": "V-linear_inequality_one-48", "q": "Solve for x: 4x - 3 > 37.", "o": ["x > 11", "x < 10", "x > 9", "x > 10"], "a": 3, "x": "Add 3 to both sides: 4x > 40. Divide by 4: x > 10. Dividing by a positive number keeps the sign.", "cn": "Move constants to one side, divide by the coefficient, and flip the sign ONLY when multiplying or dividing by a negative.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Solve a linear inequality"}, {"id": "V-function_evaluation-48", "q": "If f(x) = x^2 - 5x + 3, what is the value of f(7)?", "o": ["12", "14", "22", "17"], "a": 3, "x": "f(7) = 7^2 - 5 x 7 + 3 = 49 - 35 + 3 = 17.", "cn": "Substitute the number for x everywhere and follow the order of operations.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Evaluate f(x) at a point"}, {"id": "V-statistics_median-48", "q": "The scores of a player in 7 matches are 50, 39, 12, 59, 7, 42, 45. What is the median score?", "o": ["40", "42", "44", "36"], "a": 1, "x": "Arrange in order: 7, 12, 39, 42, 45, 50, 59. The middle (4th) value is 42.", "cn": "Median = the middle value after arranging in order. With an odd count it is the single middle value.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Median of a data set"}, {"id": "V-geometry_lines_angles-48", "q": "Two parallel lines are cut by a transversal. One angle is 70 deg. What is its co-interior angle?", "o": ["60 deg", "110 deg", "90 deg", "80 deg"], "a": 1, "x": "Co-interior angles on parallel lines add to 180 deg: 180 - 70 = 110 deg.", "cn": "Corresponding and vertically opposite angles are equal; co-interior (same-side) angles add to 180 deg.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Angles on parallel lines"}, {"id": "V-geometry_quad_angles-48", "q": "In quadrilateral PQRS, angles P = 90 deg, Q = 110 deg and R = 115 deg. What is angle S?", "o": ["45 deg", "35 deg", "55 deg", "135 deg"], "a": 0, "x": "Angles of a quadrilateral add to 360 deg: S = 360 - 90 - 110 - 115 = 45 deg.", "cn": "A quadrilateral's angles add to 360 deg (two triangles). For a parallelogram, adjacent angles add to 180 deg.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Angle sum of a quadrilateral"}, {"id": "V-ages_ratio_sum-48", "q": "The ages of Ravi and Tara are in the ratio 2 : 5 and their ages add up to 35 years. What will Ravi's age be after 5 years?", "o": ["15 years", "20 years", "10 years", "30 years"], "a": 0, "x": "Total parts = 2 + 5 = 7, so one part = 35 / 7 = 5 years. Ravi is 2 x 5 = 10 years now, so 10 + 5 = 15 years after 5 years.", "cn": "Split the total in the ratio to get the present ages first, then add the years that pass.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Ages from a ratio and a total"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
