<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quant practice qddb0cba63c</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Quant practice qddb0cba63c</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "qddb0cba63c", "date": "2026-11-04", "type": "QA", "level": 1, "qs": [{"id": "V-profit_loss_percent-81", "q": "Riya buys a table for Rs 600 and sells it for Rs 660. Find her profit percent.", "o": ["5%", "10%", "15%", "9.09091%"], "a": 1, "x": "Profit = 660 - 600 = 60. Profit percent = 60 / 600 x 100 = 10%.", "cn": "Profit percent is always on the cost price, not on the selling price. Divide the gain by the cost and multiply by 100.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Profit percent on cost"}, {"id": "V-geometry_triangle_angles-81", "q": "In triangle ABC, angle A = 55 deg and angle B = 45 deg. What is angle C?", "o": ["75 deg", "80 deg", "100 deg", "85 deg"], "a": 1, "x": "Angles of a triangle add to 180 deg: C = 180 - 55 - 45 = 80 deg.", "cn": "Interior angles of a triangle add to 180 deg; an exterior angle equals the sum of the two opposite interior angles.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Angle sum of a triangle"}, {"id": "V-remainder_basic-81", "q": "What is the remainder when 13 x 26 is divided by 9?", "o": ["5", "7", "4", "6"], "a": 0, "x": "Remainders multiply: 13 = 9 x 1 + 4 and 26 = 9 x 2 + 8. So the remainder is (4 x 8) mod 9 = 32 mod 9 = 5.", "cn": "Work with remainders first: the remainder of a sum or product is the remainder of the remainders' sum or product.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Remainder of a sum or product"}, {"id": "V-divisibility_check-81", "q": "The four-digit number 216_ is divisible by 11. What digit fills the blank?", "o": ["9", "0", "7", "8"], "a": 2, "x": "Divisibility by 11 needs (sum of odd-place digits) - (sum of even-place digits) to be 0 or a multiple of 11: (2 + 6) - (1 + d) = 7 - d = 0, so d = 7.", "cn": "Divisibility by 9: digit sum divisible by 9. Divisibility by 11: alternating digit sum is 0 or a multiple of 11.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Divisibility by 9 or 11"}, {"id": "V-factor_count-81", "q": "How many positive factors does 24 have?", "o": ["10", "7", "9", "8"], "a": 3, "x": "24 = 2^3 x 3^1. Number of factors = (3 + 1) x (1 + 1) = 8.", "cn": "Write the number in prime factors p^a x q^b; the factor count is (a+1)(b+1). Listing only works for small numbers.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Counting positive factors"}, {"id": "V-linear_inequality_one-81", "q": "Solve for x: 3x - 8 > 1.", "o": ["x > 4", "x > 3", "x > 2", "x < 3"], "a": 1, "x": "Add 8 to both sides: 3x > 9. Divide by 3: x > 3. Dividing by a positive number keeps the sign.", "cn": "Move constants to one side, divide by the coefficient, and flip the sign ONLY when multiplying or dividing by a negative.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Solve a linear inequality"}, {"id": "A-geometry_quad_angles-c1", "q": "In a quadrilateral, the first three interior angles are 70, 95 and 110 degrees. An exterior angle at the fourth vertex forms a straight line with the fourth interior angle. What is that exterior angle?", "o": ["95 degrees", "85 degrees", "105 degrees", "110 degrees"], "a": 0, "x": "The fourth interior angle is 360 - (70 + 95 + 110) = 85 degrees. Its adjacent exterior angle is 180 - 85 = 95 degrees.", "cn": "Find the missing interior angle first, then use the straight-line sum of 180 degrees.", "sl": "Authored item for a concept (new construction and wording)", "t": "Geometry Quad Angles"}, {"id": "A-geometry_lines_angles-c1", "q": "Two straight lines intersect. One angle is 30 degrees more than its adjacent angle. What is the smaller of these two angles?", "o": ["75 degrees", "150 degrees", "60 degrees", "105 degrees"], "a": 0, "x": "Let the smaller angle be x. The adjacent angle is x + 30. They form a straight line, so 2x + 30 = 180 and x = 75 degrees.", "cn": "Adjacent angles on a straight line add to 180 degrees; vertically opposite angles are equal.", "sl": "Authored item for a concept (new construction and wording)", "t": "Geometry Lines Angles"}, {"id": "A-average_new_member-c1", "q": "A group of 5 volunteers has an average age of 24 years. One new volunteer joins, raising the average age by 2 years. How many years older is the new volunteer than the original average?", "o": ["36 years", "2 years", "12 years", "10 years"], "a": 2, "x": "Original total age = 5 x 24 = 120. New total = 6 x 26 = 156, so the new volunteer is 36. The difference from the original average is 36 - 24 = 12 years.", "cn": "An increase in the average applies across the entire new group; distinguish the new value from its excess over the old average.", "sl": "Authored item for a concept (new construction and wording)", "t": "Average New Member"}, {"id": "A-pct_up_down-c1", "q": "A bicycle price is increased by 25%. What percentage discount on the increased price will bring it back to the original price?", "o": ["25%", "80%", "5%", "20%"], "a": 3, "x": "Take the original price as 100. It becomes 125. A reduction of 25 on a base of 125 is 25/125 x 100 = 20%.", "cn": "A reversal percentage uses the changed value as its base, not the original value.", "sl": "Authored item for a concept (new construction and wording)", "t": "Pct Up Down"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
