<h1>Quant practice qe2fd398da0</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>

<script>const D={"id": "qe2fd398da0", "date": "2026-11-11", "type": "QA", "level": 1, "qs": [{"id": "A-average_new_member-r20261111", "q": "A team of 8 players has an average age of 17 years. Two new players join. One is 4 years older than the other. The average age of all 10 players is now 18 years. How old is the younger new player?", "o": ["18 years", "22 years", "20 years", "24 years"], "a": 2, "x": "The original age total is 136 and the new total is 180. The two new ages sum to 44. If younger is x, then x+(x+4)=44, so x=20.", "cn": "Total = average x count. The new value is the new total minus the old total.", "sl": "Original practice item", "t": "Average after a new value is added"}, {"id": "A-remainder_basic-r20261111", "q": "An integer N leaves remainder 4 when divided by 7. What remainder does 3N + 5 leave when divided by 7?", "o": ["3", "1", "4", "5"], "a": 0, "x": "Write N=7k+4. Then 3N+5=21k+17, which leaves remainder 3.", "cn": "Work with remainders first: the remainder of a sum or product is the remainder of the remainders' sum or product.", "sl": "Original practice item", "t": "Remainder of a sum or product"}, {"id": "V-factor_count-7", "q": "How many positive factors does 28 have?", "o": ["5", "7", "8", "6"], "a": 3, "x": "28 = 2^2 x 7^1. Number of factors = (2 + 1) x (1 + 1) = 6.", "cn": "Write the number in prime factors p^a x q^b; the factor count is (a+1)(b+1). Listing only works for small numbers.", "sl": "Original practice item", "t": "Counting positive factors"}, {"id": "A-pct_up_down-r20261111", "q": "A quantity is increased by r% and then decreased by the same r%, where 0 < r < 100. The final quantity is 96% of the original quantity. What is r?", "o": ["16", "20", "4", "40"], "a": 1, "x": "The combined multiplier is (1+r/100)(1-r/100)=1-r^2/10000. Set this to 0.96: r^2=400. As r is positive, r=20.", "cn": "Percent changes multiply. If a quantity rises by x% and then falls by y% (x and y as positive numbers), net change = x - y - xy/100 percent. With signed changes it is x + y + xy/100.", "sl": "Original practice item", "t": "Successive increase and decrease"}, {"id": "A-venn_two_sets-r20261111", "q": "At a workshop of 90 participants, everyone could choose a pottery session, a robotics session, both, or neither. Eighteen chose neither, and 50 chose exactly one of the two sessions. How many chose both sessions?", "o": ["18", "32", "22", "40"], "a": 2, "x": "The union has 90-18=72 participants. Exactly one accounts for 50 of them. Thus both = 72-50 = 22.", "cn": "At least one = A + B - both. Neither = total - at least one.", "sl": "Original practice item", "t": "Two overlapping groups"}, {"id": "A-pipes_cistern_two-r20261111", "q": "Pipe A fills an empty tank in 6 hours and pipe B fills it in 8 hours. They are opened alternately for one hour each: A for the first hour, B for the second hour, A for the third, and so on. Only one pipe is open at a time. Starting with an empty tank, how long will it take to become full?", "o": ["6 hours 45 minutes", "6 hours 30 minutes", "6 hours 51 minutes", "7 hours"], "a": 0, "x": "Each two-hour cycle fills 1/6+1/8=7/24 of the tank. Three cycles (6 hours) fill 7/8. A then fills the remaining 1/8 at 1/6 tank per hour, needing 3/4 hour. Total: 6 hours 45 minutes.", "cn": "Add the rates (fraction of the tank per hour), not the times. Time together = (x x y)/(x + y).", "sl": "Original practice item", "t": "Two pipes together"}, {"id": "A-compound_interest_2yr-r20261111", "q": "A deposit earns compound interest at 10% per year, compounded yearly. The interest earned in the second year alone is Rs 660. What was the original deposit?", "o": ["Rs 660", "Rs 6600", "Rs 7260", "Rs 6000"], "a": 3, "x": "If principal is P, first-year closing balance is 1.1P. Second-year interest is 0.1 x 1.1P=0.11P=660, so P=6000.", "cn": "Compound interest grows on the new amount each year: amount = P x (1 + R/100) for each year. Interest = amount - principal.", "sl": "Original practice item", "t": "Compound interest for 2 years"}, {"id": "A-geometry_quad_angles-r20261111", "q": "In a convex quadrilateral, the interior angle at A is 80 degrees. The exterior angle at B is 70 degrees. The interior angles at C and D are in the ratio 2 : 3. What is the interior angle at D?", "o": ["110 degrees", "102 degrees", "126 degrees", "68 degrees"], "a": 1, "x": "The interior angle at B is 110 degrees. C+D=360-80-110=170 degrees. D is 3/5 of 170, or 102 degrees.", "cn": "A quadrilateral's angles add to 360 deg (two triangles). For a parallelogram, adjacent angles add to 180 deg.", "sl": "Original practice item", "t": "Angle sum of a quadrilateral"}, {"id": "A-l0_ratio_share-r20261111", "q": "Asha and Bina share some counters in the ratio 5 : 3. Asha then gives 12 counters to Bina, leaving them with equal numbers. How many counters did they share altogether?", "o": ["96", "120", "48", "64"], "a": 0, "x": "If each ratio part is k, then 5k-12=3k+12, so k=12. The total is 8k=96.", "cn": "Add the ratio parts, find the value of one part, then multiply.", "sl": "Original practice item", "t": "Sharing in a ratio (L0)"}, {"id": "A-linear_inequality_one-r20261111", "q": "Solve for x: (5 - 2x)/3 is at least 7.", "o": ["x <= 8", "x >= -8", "x >= 8", "x <= -8"], "a": 3, "x": "Multiply by 3: 5-2x>=21. Thus -2x>=16. Dividing by negative 2 reverses the inequality: x<=-8.", "cn": "Move constants to one side, divide by the coefficient, and flip the sign ONLY when multiplying or dividing by a negative.", "sl": "Original practice item", "t": "Solve a linear inequality"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
