<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quant practice qe7404fafde</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Quant practice qe7404fafde</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "qe7404fafde", "date": "2026-11-29", "type": "QA", "level": 1, "qs": [{"id": "V-function_evaluation-6", "q": "If f(x) = 3x + 1, what is the value of f(5)?", "o": ["17", "16", "21", "13"], "a": 1, "x": "f(5) = 3 x 5 + 1 = 15 + 1 = 16.", "cn": "Substitute the number for x everywhere and follow the order of operations.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Evaluate f(x) at a point"}, {"id": "V-mensuration_rect-9", "q": "A rectangle's length is 3 times its breadth and its perimeter is 48 cm. Find the area of the rectangle.", "o": ["36 sq cm", "72 sq cm", "144 sq cm", "108 sq cm"], "a": 3, "x": "Perimeter = 2 x (length + width) = 2 x (3w + w) = 8w = 48, so width w = 6 cm and length = 18 cm. Area = 18 x 6 = 108 sq cm.", "cn": "Put length and width in terms of one letter, use the perimeter to solve, then multiply for the area.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Rectangle: length as a multiple of width"}, {"id": "V-linear_inequality_one-7", "q": "Solve for x: 5x - 4 > 36.", "o": ["x > 9", "x < 8", "x > 7", "x > 8"], "a": 3, "x": "Add 4 to both sides: 5x > 40. Divide by 5: x > 8. Dividing by a positive number keeps the sign.", "cn": "Move constants to one side, divide by the coefficient, and flip the sign ONLY when multiplying or dividing by a negative.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Solve a linear inequality"}, {"id": "V-geometry_lines_angles-9", "q": "Two parallel lines are cut by a transversal. One angle is 80 deg. What is its corresponding angle?", "o": ["90 deg", "70 deg", "80 deg", "100 deg"], "a": 2, "x": "Corresponding angles on parallel lines are equal, so the required angle is 80 deg.", "cn": "Corresponding and vertically opposite angles are equal; co-interior (same-side) angles add to 180 deg.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Angles on parallel lines"}, {"id": "V-geometry_quad_angles-7", "q": "In quadrilateral PQRS, angles P = 90 deg, Q = 95 deg and R = 100 deg. What is angle S?", "o": ["65 deg", "105 deg", "75 deg", "85 deg"], "a": 2, "x": "Angles of a quadrilateral add to 360 deg: S = 360 - 90 - 95 - 100 = 75 deg.", "cn": "A quadrilateral's angles add to 360 deg (two triangles). For a parallelogram, adjacent angles add to 180 deg.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Angle sum of a quadrilateral"}, {"id": "V-pct_markup_discount-29", "q": "A shopkeeper marks a pair of shoes 50% above its cost price and then gives a 15% discount on the marked price. What is the profit percent?", "o": ["22.5%", "27.5%", "35%", "32.5%"], "a": 1, "x": "Take cost = 100. Marked price = 150. Selling price = 150 x 85/100 = 127.5. Profit = 27.5%.", "cn": "Successive percentages multiply: they do not add or subtract. Discount is on the marked price, profit is on the cost price.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Mark-up and discount"}, {"id": "V-average_new_member-6", "q": "The average of 9 numbers is 20. When one more number is included, the average rises by 3. What is the number that was included?", "o": ["23", "53", "50", "47"], "a": 2, "x": "New total = (9+1) x (20+3) = 230. Old total = 9 x 20 = 180. The new number is 230 - 180 = 50.", "cn": "Total = average x count. The new value is the new total minus the old total.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Average after a new value is added"}, {"id": "V-simple_interest-3", "q": "Rs 16000 is lent at 12% simple interest per annum. Find the interest earned in 5 years.", "o": ["Rs 7680", "Rs 9600", "Rs 960", "Rs 11520"], "a": 1, "x": "SI = P x R x T / 100 = 16000 x 12 x 5 / 100 = Rs 9600.", "cn": "Simple interest uses the original principal every year: SI = PRT/100.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Simple interest amount"}, {"id": "V-compound_interest_2yr-15", "q": "Find the compound interest on Rs 10000 for 2 years at 20% per year, compounded yearly.", "o": ["Rs 4400", "Rs 4000", "Rs 4600", "Rs 14400"], "a": 0, "x": "Amount after 2 years = 10000 x 1.2 x 1.2 = Rs 14400. Compound interest = 14400 - 10000 = Rs 4400. (Simple interest would be Rs 4000.)", "cn": "Compound interest grows on the new amount each year: amount = P x (1 + R/100) for each year. Interest = amount - principal.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Compound interest for 2 years"}, {"id": "V-profit_loss_percent-4", "q": "A shopkeeper buys an article for Rs 300 and sells it for Rs 360. What is the profit percent?", "o": ["25%", "15%", "16.6667%", "20%"], "a": 3, "x": "Profit = 360 - 300 = 60. Profit percent = 60 / 300 x 100 = 20%.", "cn": "Profit percent is always on the cost price, not on the selling price. Divide the gain by the cost and multiply by 100.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Profit percent on cost"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=async()=>{const b=document.getElementById("copy"),c=document.getElementById("code").textContent;try{await navigator.clipboard.writeText(c);b.textContent="Copied"}catch(e){b.textContent="Copy failed - code selected; copy it manually";const r=document.createRange();r.selectNodeContents(document.getElementById("code"));const s=window.getSelection();s.removeAllRanges();s.addRange(r)}};
</script></body></html>
