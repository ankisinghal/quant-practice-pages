<script>const D={"id": "qe8746544a1", "date": "2026-11-12", "type": "QA", "level": 1, "qs": [{"id": "V-l0_percent_of-10", "q": "What is 10% of 200?", "o": ["40", "25", "20", "180"], "a": 2, "x": "10% of 200 = 10/100 x 200 = 20.", "cn": "Percent means per hundred: p% of n = p/100 x n.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Percentage of a number (L0)"}, {"id": "V-l0_speed_distance-10", "q": "A cyclist travels at 15 km per hour for 2 hours. How far does it travel?", "o": ["17 km", "45 km", "15 km", "30 km"], "a": 3, "x": "Distance = speed x time = 15 x 2 = 30 km.", "cn": "Distance = speed x time.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Distance = speed x time (L0)"}, {"id": "V-l0_profit_simple-11", "q": "An article bought for Rs 500 is sold for Rs 600. What is the profit percent?", "o": ["25%", "15%", "30%", "20%"], "a": 3, "x": "Profit = 600 - 500 = 100. Profit percent = 100/500 x 100 = 20%.", "cn": "Profit percent = profit / cost price x 100 (always on the cost price).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Profit percent, one step (L0)"}, {"id": "V-pct_markup_discount-12", "q": "The marked price of a shirt is 50% more than its cost. It is sold after allowing a discount of 10%. Find the profit percent.", "o": ["40%", "41%", "35%", "30%"], "a": 2, "x": "Take cost = 100. Marked price = 150. Selling price = 150 x 90/100 = 135. Profit = 35%.", "cn": "Successive percentages multiply: they do not add or subtract. Discount is on the marked price, profit is on the cost price.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Mark-up and discount"}, {"id": "V-algebra_identity-13", "q": "Given a + b = 19 and ab = 88, find a^2 + b^2.", "o": ["185", "273", "361", "537"], "a": 0, "x": "x^2 + y^2 = (x + y)^2 - 2xy = 19^2 - 2 x 88 = 361 - 176 = 185.", "cn": "Use the identity x^2 + y^2 = (x + y)^2 - 2xy instead of finding x and y separately.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Square of a sum identity"}, {"id": "V-mixture_add_water-10", "q": "A 24 litre mixture has syrup and water in the ratio 5 : 1. How many litres of water must be added to make the ratio 1 : 1?", "o": ["14 litres", "16 litres", "20 litres", "18 litres"], "a": 1, "x": "Syrup = 20 L and water = 4 L. For 1 : 1 the water must also be 20 L, so add 20-4 = 16 L.", "cn": "Adding water does not change the other part. Keep it fixed and make the other part equal to it.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Adding to change a ratio"}, {"id": "V-quad_root_k-12", "q": "2 is a root of x^2 - 9x + k = 0. Find k.", "o": ["9", "7", "14", "16"], "a": 2, "x": "Put x = 2: 4 - 18 + k = 0, so k = 14. (The other root is 7, and 2 x 7 = 14.)", "cn": "A root satisfies the equation. Substitute it, or use: product of roots = k, sum of roots = coefficient.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Using a known root of a quadratic"}, {"id": "V-l0_area_rect-9", "q": "A sheet of paper is 24 cm long and 8 cm wide. What is its area?", "o": ["384 sq cm", "32 sq cm", "64 sq cm", "192 sq cm"], "a": 3, "x": "Area of a rectangle = length x width = 24 x 8 = 192 sq cm.", "cn": "Area of a rectangle = length x width. Perimeter is a different thing (the distance around).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Area of a rectangle (L0)"}, {"id": "V-l0_simple_interest-10", "q": "What is the simple interest on Rs 5000 at 5% per year for 3 years?", "o": ["Rs 750", "Rs 5750", "Rs 250", "Rs 1500"], "a": 0, "x": "Simple interest = P x R x T / 100 = 5000 x 5 x 3 / 100 = Rs 750.", "cn": "Simple interest = principal x rate x time / 100. It is the interest only, not the total amount.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Simple interest, one step (L0)"}, {"id": "A-l0_lcm-an20261112-1", "q": "Two signal lights flash together at 9:00:00. One then flashes every 14 seconds and the other every 21 seconds. At what time will they next flash together?", "o": ["9:00:42", "9:00:35", "9:00:07", "9:01:00"], "a": 0, "x": "The next shared interval is LCM(14,21)=42 seconds, so the next shared flash is at 9:00:42.", "cn": "LCM = the smallest number that both numbers divide into. Do not just multiply the numbers unless they share no factor.", "sl": "Original practice item", "t": "LCM of two numbers (L0)"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
