<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quant practice qec5a341cf3</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Quant practice qec5a341cf3</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "qec5a341cf3", "date": "2026-11-13", "type": "QA", "level": 1, "qs": [{"id": "V-l0_percent_of-11", "q": "What is 75% of 240?", "o": ["360", "180", "185", "60"], "a": 1, "x": "75% of 240 = 75/100 x 240 = 180.", "cn": "Percent means per hundred: p% of n = p/100 x n.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Percentage of a number (L0)"}, {"id": "V-l0_speed_distance-11", "q": "A cyclist travels at 10 km per hour for 2 hours. How far does it travel?", "o": ["12 km", "30 km", "10 km", "20 km"], "a": 3, "x": "Distance = speed x time = 10 x 2 = 20 km.", "cn": "Distance = speed x time.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Distance = speed x time (L0)"}, {"id": "V-l0_profit_simple-21", "q": "An article bought for Rs 200 is sold for Rs 220. What is the profit percent?", "o": ["20%", "15%", "5%", "10%"], "a": 3, "x": "Profit = 220 - 200 = 20. Profit percent = 20/200 x 100 = 10%.", "cn": "Profit percent = profit / cost price x 100 (always on the cost price).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Profit percent, one step (L0)"}, {"id": "V-pct_markup_discount-14", "q": "A shopkeeper marks a pair of shoes 20% above its cost price and then gives a 15% discount on the marked price. What is the profit percent?", "o": ["6%", "5%", "2%", "7%"], "a": 2, "x": "Take cost = 100. Marked price = 120. Selling price = 120 x 85/100 = 102. Profit = 2%.", "cn": "Successive percentages multiply: they do not add or subtract. Discount is on the marked price, profit is on the cost price.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Mark-up and discount"}, {"id": "V-algebra_identity-14", "q": "Given a + b = 14 and ab = 33, find a^2 + b^2.", "o": ["163", "130", "196", "262"], "a": 1, "x": "x^2 + y^2 = (x + y)^2 - 2xy = 14^2 - 2 x 33 = 196 - 66 = 130.", "cn": "Use the identity x^2 + y^2 = (x + y)^2 - 2xy instead of finding x and y separately.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Square of a sum identity"}, {"id": "V-mixture_add_water-12", "q": "A 30 litre mixture has juice and water in the ratio 3 : 2. How many litres of water must be added to make the ratio 1 : 1?", "o": ["4 litres", "8 litres", "6 litres", "10 litres"], "a": 2, "x": "Juice = 18 L and water = 12 L. For 1 : 1 the water must also be 18 L, so add 18-12 = 6 L.", "cn": "Adding water does not change the other part. Keep it fixed and make the other part equal to it.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Adding to change a ratio"}, {"id": "V-quad_root_k-13", "q": "5 is a root of x^2 - 9x + k = 0. Find k.", "o": ["20", "9", "16", "25"], "a": 0, "x": "Put x = 5: 25 - 45 + k = 0, so k = 20. (The other root is 4, and 5 x 4 = 20.)", "cn": "A root satisfies the equation. Substitute it, or use: product of roots = k, sum of roots = coefficient.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Using a known root of a quadratic"}, {"id": "V-l0_area_rect-10", "q": "A sheet of paper is 12 cm long and 8 cm wide. What is its area?", "o": ["96 sq cm", "192 sq cm", "20 sq cm", "40 sq cm"], "a": 0, "x": "Area of a rectangle = length x width = 12 x 8 = 96 sq cm.", "cn": "Area of a rectangle = length x width. Perimeter is a different thing (the distance around).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Area of a rectangle (L0)"}, {"id": "V-l0_simple_interest-11", "q": "What is the simple interest on Rs 3000 at 10% per year for 4 years?", "o": ["Rs 2400", "Rs 300", "Rs 4200", "Rs 1200"], "a": 3, "x": "Simple interest = P x R x T / 100 = 3000 x 10 x 4 / 100 = Rs 1200.", "cn": "Simple interest = principal x rate x time / 100. It is the interest only, not the total amount.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Simple interest, one step (L0)"}, {"id": "A-l0_lcm-an20261113-1", "q": "A teacher has some identical stickers. Packing them in groups of 9 leaves none over, and packing them in groups of 15 also leaves none over. What is the smallest possible number of stickers?", "o": ["3", "45", "24", "135"], "a": 1, "x": "The smallest possible count is LCM(9,15). Since 9 = 3 x 3 and 15 = 3 x 5, the LCM is 3 x 3 x 5 = 45.", "cn": "LCM = the smallest number that both numbers divide into. Do not just multiply the numbers unless they share no factor.", "sl": "Original practice item", "t": "LCM of two numbers (L0)"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
