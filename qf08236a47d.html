<h1>Logic practice qf08236a47d</h1><p>8 questions &middot; level L1 &middot; about 15 to 20 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>

<script>const D={"id": "qf08236a47d", "date": "2026-10-12", "type": "LR", "level": 1, "qs": [{"id": "L001", "q": "What comes next in the series 3, 8, 15, 24, 35, ?", "o": ["47", "45", "49", "48"], "a": 3, "x": "The gaps are 5, 7, 9, 11, so the next gap is 13 and 35 + 13 = 48. Each term is also n^2 - 1 for n = 2, 3, 4, ... and n = 7 gives 48.", "cn": "Find the gaps between terms. If the gaps themselves form a pattern (here 5, 7, 9, 11), continue that pattern.", "sl": "Original question (checked by code)", "t": "Number series"}, {"id": "L002", "q": "What comes next in the series B, E, H, K, ?", "o": ["O", "N", "P", "M"], "a": 1, "x": "Each letter is 3 places after the one before: B, E, H, K, then N.", "cn": "Turn letters into their alphabet positions (A=1, B=2 ...). Find the constant step, then convert back.", "sl": "Original question (checked by code)", "t": "Letter series"}, {"id": "L003", "q": "In a certain code, CAT is written as ECV. How is DOG written in that code?", "o": ["FPI", "GRJ", "FQI", "EPH"], "a": 2, "x": "Each letter moves 2 places forward: C to E, A to C, T to V. So D to F, O to Q, G to I, giving FQI.", "cn": "In a letter code, check how each letter moves. The same shift applies to every letter of the new word.", "sl": "Original question (checked by code)", "t": "Coding-decoding"}, {"id": "L004", "q": "Pointing to a man, Riya says, \"He is the son of my mother's only brother.\" How is the man related to Riya?", "o": ["Cousin", "Brother", "Nephew", "Uncle"], "a": 0, "x": "Riya's mother's brother is Riya's maternal uncle. His son is Riya's cousin.", "cn": "Break the relation into steps. Mother's brother is the maternal uncle, and his children are your cousins.", "sl": "Original question (checked by code)", "t": "Blood relations"}, {"id": "L005", "q": "Meera walks 6 km north, then turns right and walks 8 km, then turns right again and walks 6 km. How far and in which direction is she from her starting point?", "o": ["8 km east", "14 km east", "8 km west", "10 km north-east"], "a": 0, "x": "Turning right from north means east, so she goes 8 km east. Turning right again means south, so she goes 6 km south, which cancels the 6 km north. She is 8 km east of the start.", "cn": "Track each move with north, east, south and west. A right turn from north faces east, then south. Opposite moves cancel.", "sl": "Original question (checked by code)", "t": "Directions"}, {"id": "L006", "q": "Statements: All pens are books. Some books are bags.\nConclusions:\nI. Some pens are bags.\nII. Some bags are books.\nWhich conclusion follows?", "o": ["Both follow", "Only II follows", "Neither follows", "Only I follows"], "a": 1, "x": "\"Some books are bags\" can be turned around to \"Some bags are books\", so II follows. The pens could all sit in the part of books that has no bags, so I need not be true.", "cn": "\"Some A are B\" can be reversed to \"Some B are A\". A conclusion follows only if it is true in every possible picture, not just in one.", "sl": "Original question (checked by code)", "t": "Syllogism"}, {"id": "L007", "q": "Five friends A, B, C, D and E sit in a row facing north. A sits at the left end. C sits in the middle. E does not sit next to C. B does not sit next to A. Who sits immediately to the left of E?", "o": ["D", "C", "B", "A"], "a": 2, "x": "A is at position 1 and C at position 3. E cannot be at 2 or 4, so E is at 5. B cannot be at 2 (next to A), so B is at 4 and D is at 2. The person immediately left of E (position 4) is B.", "cn": "Fix the sure positions first, then use each negative clue to remove options until one arrangement is left.", "sl": "Original question (checked by code)", "t": "Seating arrangement"}, {"id": "L008", "q": "Four people P, Q, R and S have different heights. P is taller than Q. R is shorter than Q. S is taller than P. Who is the second tallest?", "o": ["S", "Q", "R", "P"], "a": 3, "x": "S > P, P > Q and Q > R, so the order from tallest is S, P, Q, R. The second tallest is P.", "cn": "Chain the comparisons into one line (S > P > Q > R), then read off the position asked.", "sl": "Original question (checked by code)", "t": "Ordering"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/8";document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="QL|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/8|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};

</script></body></html>
