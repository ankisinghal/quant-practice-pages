00 litres"], "a": 0, "x": "The volume is 3 x 2 x 1.5 = 9 cubic metres, which is 9 x 1000 = 9000 litres.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "volume_cuboid"}, {"id": "A-trapezium_area-r20261125", "q": "The two parallel sides of a trapezium are 12 cm and 18 cm, and the perpendicular distance between them is 10 cm. What is its area?", "o": ["140 sq cm", "160 sq cm", "150 sq cm", "300 sq cm"], "a": 2, "x": "The area of a trapezium is half the sum of the parallel sides times the distance between them: (12 + 18)/2 x 10 = 150 sq cm.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "trapezium_area"}, {"id": "A-rhombus_area-r20261125", "q": "The diagonals of a rhombus are 24 cm and 10 cm. What is its area?", "o": ["240 sq cm", "120 sq cm", "60 sq cm", "100 sq cm"], "a": 1, "x": "The area of a rhombus is half the product of its diagonals: (24 x 10)/2 = 120 sq cm.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "rhombus_area"}, {"id": "A-fraction_largest-r20261125", "q": "Which of the following fractions is the largest?", "o": ["5/8", "11/16", "3/5", "7/10"], "a": 3, "x": "In decimals: 7/10 = 0.700, 5/8 = 0.625, 11/16 = 0.6875 and 3/5 = 0.600. The largest is 7/10.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "fraction_largest"}, {"id": "A-hcf_lcm_product-r20261125", "q": "The HCF of two numbers is 14 and their LCM is 420. If one of the numbers is 84, what is the other number?", "o": ["70", "60", "98", "105"], "a": 0, "x": "The product of two numbers equals the product of their HCF and LCM: 14 x 420 = 5880, and 5880 / 84 = 70. Check: HCF of 84 and 70 is 14 and their LCM is 420.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "hcf_lcm_product"}, {"id": "A-consumption_cut-r20261125", "q": "The price of rice increases by 25%. By what percentage should a family reduce its consumption of rice so that its expenditure on rice stays the same?", "o": ["25%", "20%", "15%", "30%"], "a": 1, "x": "If consumption falls by 20%, expenditure becomes 1.25 x 0.80 = 1.00 of the original, so it stays the same.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "consumption_cut"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
