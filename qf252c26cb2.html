<script>const D={"id": "qf252c26cb2", "date": "2026-11-12", "type": "QA", "level": 1, "qs": [{"id": "A-word_arrangements-r20261112", "q": "In how many arrangements of all the letters of the word CANDLE are the first AND last letters vowels?", "o": ["120", "48", "24", "96"], "a": 1, "x": "The vowels A and E occupy the two ends in 2 ways. The four distinct consonants fill the middle in 4! = 24 ways. Total: 2 x 24 = 48.", "cn": "Use the information stated in the question and check each step.", "sl": "Original practice item", "t": "Word Arrangements"}, {"id": "A-time_work_two-r20261112", "q": "Worker A completes three times as much work per day as worker B. Together they finish a job in 8 days. How many days would A alone need for that job?", "o": ["10 2/3 days", "24 days", "32 days", "6 days"], "a": 0, "x": "The rate ratio A:B is 3:1. A does 3/4 of the combined rate, which is 1/8 job per day. A works at 3/32 job per day, so the time needed is 32/3 days, or 10 2/3 days.", "cn": "Use the information stated in the question and check each step.", "sl": "Original practice item", "t": "Time Work Two"}, {"id": "A-algebra_identity-r20261112", "q": "For real numbers a and b, a + b = 14 and a - b = 2. What is 4ab?", "o": ["196", "200", "96", "192"], "a": 3, "x": "Use 4ab = (a+b)^2 - (a-b)^2 = 196 - 4 = 192.", "cn": "Use the information stated in the question and check each step.", "sl": "Original practice item", "t": "Algebra Identity"}, {"id": "A-remainder_basic-r20261112v2", "q": "When 83 is divided by a positive integer d, the quotient is 6 and the remainder is 5. What is d?", "o": ["12", "14", "13", "18"], "a": 2, "x": "83 = 6d + 5, so 6d = 78 and d = 13. Remainder 5 is less than 13.", "cn": "Use the stated quantities and show each step.", "sl": "Original practice item", "t": "Remainder Basic"}, {"id": "A-compound_interest_2yr-r20261112v2", "q": "A deposit earns compound interest at the same annual rate, compounded yearly. Its interest for the first year is Rs 1100 and for the second year alone is Rs 1210. What is the annual interest rate?", "o": ["10%", "11%", "20%", "5%"], "a": 0, "x": "The second-year interest is the first-year interest multiplied by 1 + r/100. The ratio 1210/1100 is 1.10, so the annual rate is 10%.", "cn": "Use the stated quantities and show each step.", "sl": "Original practice item", "t": "Compound Interest 2Yr"}, {"id": "A-pct_up_down-r20261112v2", "q": "Two identical deposits each start at Rs 1000. Deposit A first increases by 20% and then decreases by 10%. Deposit B first decreases by 10% and then increases by 20%. By how many rupees does A's final value exceed B's final value?", "o": ["Rs 100", "Rs 20", "Rs 0", "Rs 200"], "a": 2, "x": "Both final amounts multiply 1000 by 1.2 and 0.9, in either order. Both become 1080, so the difference is 0.", "cn": "Use the stated quantities and show each step.", "sl": "Original practice item", "t": "Pct Up Down"}, {"id": "A-venn_two_sets-r20261112v2", "q": "In a club of 50 members, 32 play chess and 29 play badminton. What is the SMALLEST possible number who play both?", "o": ["0", "21", "29", "11"], "a": 3, "x": "The union cannot exceed 50, so the overlap is at least 32 + 29 - 50 = 11. This is possible when every member plays at least one game.", "cn": "Use the stated quantities and show each step.", "sl": "Original practice item", "t": "Venn Two Sets"}, {"id": "A-geometry_quad_angles-r20261112v2", "q": "In a quadrilateral, angle A equals angle C, while angle B is twice angle D. Angles A and B add up to 210 degrees, and angle C is 90 degrees. What is angle D?", "o": ["120 degrees", "60 degrees", "30 degrees", "90 degrees"], "a": 1, "x": "A = C = 90 degrees. Therefore B = 210 - 90 = 120 degrees. Since B = 2D, D = 60 degrees. The angle sum is 90 + 120 + 90 + 60 = 360 degrees.", "cn": "Use the stated quantities and show each step.", "sl": "Original practice item", "t": "Geometry Quad Angles"}, {"id": "A-linear_inequality_one-r20261112v2", "q": "How many POSITIVE integers satisfy 3x + 2 < 20?", "o": ["5", "4", "6", "7"], "a": 0, "x": "3x < 18, so x < 6. The positive integer solutions are 1, 2, 3, 4 and 5.", "cn": "Use the stated quantities and show each step.", "sl": "Original practice item", "t": "Linear Inequality One"}, {"id": "A-average_new_member-r20261112v2", "q": "A group of 6 students has an average score of 15. One student leaves and is replaced by a new student whose score is 9 higher than the departing student. What is the new group average?", "o": ["15.5", "16", "16.5", "24"], "a": 2, "x": "The score total increases by 9 while the count stays 6, so the mean increases by 9/6 = 1.5, to 16.5.", "cn": "Use the stated quantities and show each step.", "sl": "Original practice item", "t": "Average New Member"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
