<script>const D={"id": "qf59d767349", "date": "2026-11-16", "type": "QA", "level": 1, "qs": [{"id": "A-algebra_identity-r20261116", "q": "For real numbers a and b, a + b = 17 and a - b = 3. What is a^2 - b^2?", "o": ["20", "289", "42", "51"], "a": 3, "x": "a^2 - b^2 = (a+b)(a-b) = 17 x 3 = 51.", "cn": "Use only the stated conditions.", "sl": "Original practice item", "t": "algebra_identity"}, {"id": "A-remainder_basic-r20261116", "q": "A positive integer N leaves remainder 5 when divided by 6. What remainder does N leave when divided by 3?", "o": ["0", "1", "2", "5"], "a": 2, "x": "N = 6k + 5 = 3(2k+1) + 2. Its remainder on division by 3 is 2.", "cn": "Use only the stated conditions.", "sl": "Original practice item", "t": "remainder_basic"}, {"id": "A-compound_interest_2yr-r20261116", "q": "Rs 10000 is deposited for two years. Interest is compounded at each year end: 10% for the first year and 20% for the second year. No money is added or withdrawn. What is the TOTAL interest earned over the two years?", "o": ["Rs 13200", "Rs 2000", "Rs 3000", "Rs 3200"], "a": 3, "x": "After year one the balance is 10000 x 1.10 = 11000. After year two it is 11000 x 1.20 = 13200. Total interest is 13200 - 10000 = Rs 3200.", "cn": "Use only the stated conditions.", "sl": "Original practice item", "t": "compound_interest_2yr"}, {"id": "A-linear_inequality_one-r20261116", "q": "Solve for x: 5 - 3x is greater than or equal to 20.", "o": ["x <= -5", "x <= 5", "x >= -5", "x >= 5"], "a": 0, "x": "Subtract 5 to get -3x >= 15. Dividing by -3 reverses the inequality, giving x <= -5.", "cn": "Use only the stated conditions.", "sl": "Original practice item", "t": "linear_inequality_one"}, {"id": "A-geometry_quad_angles-r20261116", "q": "In a convex quadrilateral ABCD, diagonal AC forms triangles ABC and ACD. Angle BAC = 50 degrees, angle BCA = 50 degrees, angle CAD = 35 degrees, and angle ACD = 40 degrees. What is the interior angle at D?", "o": ["105 degrees", "115 degrees", "85 degrees", "95 degrees"], "a": 0, "x": "Triangle ABC is consistent: its angles at A and C are 50 degrees each, so its angle at B is 80 degrees. In triangle ACD, angles CAD and ACD are 35 and 40 degrees, so angle ADC = 180 - 35 - 40 = 105 degrees. This is the quadrilateral interior angle at D.", "cn": "Use only the stated conditions.", "sl": "Original practice item", "t": "geometry_quad_angles"}, {"id": "A-venn_two_sets-r20261116", "q": "In a club, 18 members play only chess, 12 play only tennis and 9 play both. One member is chosen from those who play AT LEAST ONE of the two games. How many members are in this selection pool?", "o": ["21", "30", "39", "48"], "a": 2, "x": "Those who play at least one are the three disjoint groups: chess only, tennis only and both. Their total is 18 + 12 + 9 = 39.", "cn": "Use only the stated conditions.", "sl": "Original practice item", "t": "venn_two_sets"}, {"id": "A-trains_cross_pole-r20261116", "q": "A train travels at a constant 54 km/h. After its front passes a pole, its MIDPOINT takes 8 seconds to reach the same pole. How long is the entire train?", "o": ["120 metres", "240 metres", "432 metres", "480 metres"], "a": 1, "x": "54 km/h is 15 m/s. The front-to-midpoint distance, half the train length, is 15 x 8 = 120 metres. The full length is 240 metres.", "cn": "Use only the stated conditions.", "sl": "Original practice item", "t": "trains_cross_pole"}, {"id": "A-pipes_cistern_two-r20261116", "q": "An inlet fills a tank in 6 hours. An outlet empties a full tank in 9 hours. Both are opened together when the tank is empty. Assuming constant rates, how many hours will the tank take to fill?", "o": ["15 hours", "18 hours", "3 hours", "3.6 hours"], "a": 1, "x": "The net filling rate is 1/6 - 1/9 = 1/18 of the tank per hour. It therefore fills in 18 hours.", "cn": "Use only the stated conditions.", "sl": "Original practice item", "t": "pipes_cistern_two"}, {"id": "A-boats_streams-r20261116", "q": "A boat travels at 10 km/h in still water and the current is 2 km/h. It travels 24 km downstream and then returns the same 24 km upstream. How long does the complete trip take?", "o": ["4 hours", "4.8 hours", "5 hours", "6 hours"], "a": 2, "x": "Downstream speed is 12 km/h and upstream speed is 8 km/h. The times are 24/12 = 2 hours and 24/8 = 3 hours, totalling 5 hours.", "cn": "Use only the stated conditions.", "sl": "Original practice item", "t": "boats_streams"}, {"id": "A-average_new_member-r20261116", "q": "Six members have an average age of 20 years. A new member joins. A second new member then joins, aged 28. The average age of all eight members is 22 years. How old is the FIRST new member?", "o": ["20 years", "24 years", "28 years", "36 years"], "a": 2, "x": "The original total is 6 x 20 = 120. The final total is 8 x 22 = 176. The first new member is 176 - 120 - 28 = 28 years old.", "cn": "Use only the stated conditions.", "sl": "Original practice item", "t": "average_new_member"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
