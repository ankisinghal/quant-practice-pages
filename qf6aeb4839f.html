<script>const D={"id":"qf6aeb4839f","date":"2026-10-26","type":"QA","level":1,"qs":[
{"id":"V-di_growth-41","q":"Sales (in books) of three products:\nProduct   2023   2024\nQ   100   150\nR   300   360\nT   150   210\nThe percentage growth of Q from 2023 to 2024 is higher than that of T by how many percentage points?","o":["15","10","90","20"],"a":1,"x":"Q grew 50/100 = 50%. T grew 60/150 = 40%. The difference is 50 - 40 = 10 percentage points.","cn":"Percentage growth = change / old value x 100. A difference between two growth rates is in percentage points.","sl":"Original variant of a concept (numbers and wording changed)","t":"Percentage growth and percentage-point gap"},
{"id":"V-mensuration_rect-41","q":"The length of a rectangle is 2 times its width. If the perimeter of the rectangle is 36 cm, what is its area?","o":["108 sq cm","84 sq cm","72 sq cm","36 sq cm"],"a":2,"x":"Perimeter = 2 x (length + width) = 2 x (2w + w) = 6w = 36, so width w = 6 cm and length = 12 cm. Area = 12 x 6 = 72 sq cm.","cn":"Put length and width in terms of one letter, use the perimeter to solve, then multiply for the area.","sl":"Original variant of a concept (numbers and wording changed)","t":"Rectangle: length as a multiple of width"},
{"id":"V-l0_percent_of-41","q":"What is 40% of 60?","o":["44","36","48","24"],"a":3,"x":"40% of 60 = 40/100 x 60 = 24.","cn":"Percent means per hundred: p% of n = p/100 x n.","sl":"Original variant of a concept (numbers and wording changed)","t":"Percentage of a number (L0)"},
{"id":"V-l0_speed_distance-41","q":"A train travels at 45 km per hour for 2 hours. How far does it travel?","o":["47 km","135 km","90 km","45 km"],"a":2,"x":"Distance = speed x time = 45 x 2 = 90 km.","cn":"Distance = speed x time.","sl":"Original variant of a concept (numbers and wording changed)","t":"Distance = speed x time (L0)"},
{"id":"V-l0_profit_simple-41","q":"An article bought for Rs 100 is sold for Rs 130. What is the profit percent?","o":["25%","40%","35%","30%"],"a":3,"x":"Profit = 130 - 100 = 30. Profit percent = 30/100 x 100 = 30%.","cn":"Profit percent = profit / cost price x 100 (always on the cost price).","sl":"Original variant of a concept (numbers and wording changed)","t":"Profit percent, one step (L0)"},
{"id":"V-l0_simple_interest-41","q":"What is the simple interest on Rs 8000 at 8% per year for 3 years?","o":["Rs 640","Rs 1920","Rs 3840","Rs 9920"],"a":1,"x":"Simple interest = P x R x T / 100 = 8000 x 8 x 3 / 100 = Rs 1920.","cn":"Simple interest = principal x rate x time / 100. It is the interest only, not the total amount.","sl":"Original variant of a concept (numbers and wording changed)","t":"Simple interest, one step (L0)"},
{"id":"V-l0_lcm-41","q":"Find the LCM of 6 and 8.","o":["2","48","30","24"],"a":3,"x":"Multiples of 6: 6, 12, 18, ... Multiples of 8: 8, 16, ... The smallest common multiple is 24.","cn":"LCM = the smallest number that both numbers divide into. Do not just multiply the numbers unless they share no factor.","sl":"Original variant of a concept (numbers and wording changed)","t":"LCM of two numbers (L0)"},
{"id":"V-algebra_identity-41","q":"Given a + b = 25 and ab = 154, find a^2 + b^2.","o":["471","317","625","933"],"a":1,"x":"x^2 + y^2 = (x + y)^2 - 2xy = 25^2 - 2 x 154 = 625 - 308 = 317.","cn":"Use the identity x^2 + y^2 = (x + y)^2 - 2xy instead of finding x and y separately.","sl":"Original variant of a concept (numbers and wording changed)","t":"Square of a sum identity"},
{"id":"V-quad_root_k-41","q":"4 is a root of x^2 - 7x + k = 0. Find k.","o":["16","9","12","7"],"a":2,"x":"Put x = 4: 16 - 28 + k = 0, so k = 12. (The other root is 3, and 4 x 3 = 12.)","cn":"A root satisfies the equation. Substitute it, or use: product of roots = k, sum of roots = coefficient.","sl":"Original variant of a concept (numbers and wording changed)","t":"Using a known root of a quadratic"},
{"id":"V-mixture_add_water-41","q":"A 72 litre mixture has syrup and water in the ratio 7 : 5. How many litres of water must be added to make the ratio 1 : 1?","o":["12 litres","10 litres","14 litres","16 litres"],"a":0,"x":"Syrup = 42 L and water = 30 L. For 1 : 1 the water must also be 42 L, so add 42-30 = 12 L.","cn":"Adding water does not change the other part. Keep it fixed and make the other part equal to it.","sl":"Original variant of a concept (numbers and wording changed)","t":"Adding to change a ratio"}
]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});

document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
