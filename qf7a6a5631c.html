<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quant practice qf7a6a5631c</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Quant practice qf7a6a5631c</h1><p>5 questions &middot; level L1 &middot; about 10 to 15 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "qf7a6a5631c", "date": "2026-10-12", "type": "QA", "level": 1, "qs": [{"id": "V-pct_markup_discount-13", "q": "The marked price of a bag is 45% more than its cost. It is sold after allowing a discount of 10%. Find the profit percent.", "o": ["35%", "30.5%", "25.5%", "35.5%"], "a": 1, "x": "Take cost = 100. Marked price = 145. Selling price = 145 x 90/100 = 130.5. Profit = 30.5%.", "cn": "Successive percentages multiply: they do not add or subtract. Discount is on the marked price, profit is on the cost price.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Mark-up and discount"}, {"id": "V-mixture_add_water-13", "q": "A 50 litre mixture has juice and water in the ratio 4 : 1. How many litres of water must be added to make the ratio 1 : 1?", "o": ["28 litres", "30 litres", "34 litres", "32 litres"], "a": 1, "x": "Juice = 40 L and water = 10 L. For 1 : 1 the water must also be 40 L, so add 40-10 = 30 L.", "cn": "Adding water does not change the other part. Keep it fixed and make the other part equal to it.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Adding to change a ratio"}, {"id": "Q002", "q": "The sum of two positive numbers is 34 and the difference of their squares is 204. What is their product?", "o": ["280", "264", "289", "300"], "a": 0, "x": "x^2 - y^2 = (x+y)(x-y) = 204, so x-y = 204/34 = 6. Then x = 20, y = 14 and the product is 280.", "cn": "Use x^2 - y^2 = (x+y)(x-y) to find the difference, then solve the two equations.", "sl": "Original question (checked by code)", "t": "Algebra"}, {"id": "Q005", "q": "One root of the equation x^2 - 5x + k = 0 is 2. What is the value of k?", "o": ["4", "10", "6", "3"], "a": 2, "x": "Put x = 2: 4 - 10 + k = 0, so k = 6. (The other root is then 3, and 2 x 3 = 6 matches the product of roots.)", "cn": "A root satisfies the equation. Substitute it, or use: product of roots = k.", "sl": "Original question (checked by code)", "t": "Quadratic equations"}, {"id": "Q008", "q": "The length of a rectangle is 6 cm more than its breadth, and its perimeter is 36 cm. What is its area?", "o": ["60 sq cm", "80 sq cm", "54 sq cm", "72 sq cm"], "a": 3, "x": "Length + breadth = 18 and length - breadth = 6, so length = 12 and breadth = 6. Area = 72 sq cm.", "cn": "Use length + breadth from the perimeter and the given difference to find both sides, then area = length x breadth.", "sl": "Original question (checked by code)", "t": "Mensuration"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="QL|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
