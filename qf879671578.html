<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quant practice qf879671578</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Quant practice qf879671578</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "qf879671578", "date": "2026-11-25", "type": "QA", "level": 1, "qs": [{"id": "V-function_evaluation-5", "q": "If f(x) = 3x + 4, what is the value of f(4)?", "o": ["13", "20", "21", "16"], "a": 3, "x": "f(4) = 3 x 4 + 4 = 12 + 4 = 16.", "cn": "Substitute the number for x everywhere and follow the order of operations.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Evaluate f(x) at a point"}, {"id": "V-geometric_progression-6", "q": "The first term of a geometric progression is 3 and the common ratio is 3. What is its 4th term?", "o": ["27", "84", "81", "243"], "a": 2, "x": "nth term = a x r^(n-1) = 3 x 3^(4-1) = 3 x 27 = 81.", "cn": "The nth term of a GP is a x r^(n-1). The exponent is n-1, one less than the position.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "GP nth term"}, {"id": "V-geometry_lines_angles-6", "q": "Two parallel lines are cut by a transversal. One angle is 40 deg. What is its corresponding angle?", "o": ["40 deg", "90 deg", "50 deg", "140 deg"], "a": 0, "x": "Corresponding angles on parallel lines are equal, so the required angle is 40 deg.", "cn": "Corresponding and vertically opposite angles are equal; co-interior (same-side) angles add to 180 deg.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Angles on parallel lines"}, {"id": "V-geometry_quad_angles-6", "q": "In quadrilateral PQRS, angles P = 80 deg, Q = 110 deg and R = 85 deg. What is angle S?", "o": ["95 deg", "85 deg", "90 deg", "75 deg"], "a": 1, "x": "Angles of a quadrilateral add to 360 deg: S = 360 - 80 - 110 - 85 = 85 deg.", "cn": "A quadrilateral's angles add to 360 deg (two triangles). For a parallelogram, adjacent angles add to 180 deg.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Angle sum of a quadrilateral"}, {"id": "V-linear_inequality_one-5", "q": "Solve for x: 2x - 1 > 13.", "o": ["x < 7", "x > 8", "x > 6", "x > 7"], "a": 3, "x": "Add 1 to both sides: 2x > 14. Divide by 2: x > 7. Dividing by a positive number keeps the sign.", "cn": "Move constants to one side, divide by the coefficient, and flip the sign ONLY when multiplying or dividing by a negative.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Solve a linear inequality"}, {"id": "V-mensuration_rect-7", "q": "A rectangle's length is 3 times its breadth and its perimeter is 64 cm. Find the area of the rectangle.", "o": ["64 sq cm", "256 sq cm", "192 sq cm", "96 sq cm"], "a": 2, "x": "Perimeter = 2 x (length + width) = 2 x (3w + w) = 8w = 64, so width w = 8 cm and length = 24 cm. Area = 24 x 8 = 192 sq cm.", "cn": "Put length and width in terms of one letter, use the perimeter to solve, then multiply for the area.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Rectangle: length as a multiple of width"}, {"id": "V-pipes_cistern_two-10", "q": "Pipe A can fill a tank in 6 hours and pipe B can fill it in 9 hours. How long will both pipes together take to fill the tank?", "o": ["3.6 hours", "4.6 hours", "7.5 hours", "15 hours"], "a": 0, "x": "Together they fill 1/6 + 1/9 of the tank per hour, so the time is 6 x 9 / (6 + 9) = 3.6 hours.", "cn": "Add the rates (fraction of the tank per hour), not the times. Time together = (x x y)/(x + y).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two pipes together"}, {"id": "V-pct_up_down-7", "q": "The price of a phone increases by 45% and then decreases by 10%. What is the net percentage change?", "o": ["35% increase", "30.5% increase", "31.5% increase", "35% decrease"], "a": 1, "x": "Rise 45% then fall 10%: net = 45 - 10 - (45 x 10)/100 = 30.5%, so a 30.5% increase.", "cn": "Percent changes multiply. If a quantity rises by x% and then falls by y% (x and y as positive numbers), net change = x - y - xy/100 percent. With signed changes it is x + y + xy/100.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Successive increase and decrease"}, {"id": "V-quad_root_k-20", "q": "One root of the equation x^2 - 8x + k = 0 is 3. What is the value of k?", "o": ["15", "8", "10", "18"], "a": 0, "x": "Put x = 3: 9 - 24 + k = 0, so k = 15. (The other root is 5, and 3 x 5 = 15.)", "cn": "A root satisfies the equation. Substitute it, or use: product of roots = k, sum of roots = coefficient.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Using a known root of a quadratic"}, {"id": "V-surds_indices-6", "q": "Simplify: 2^6 x 2^5 / 2^7", "o": ["2048", "32", "16", "8"], "a": 2, "x": "Add powers on multiplying, subtract on dividing: 2^(6 + 5 - 7) = 2^4 = 16.", "cn": "Same base: a^m x a^n = a^(m+n) and a^m / a^n = a^(m-n). Do the powers step by step.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Product and quotient of powers"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=async()=>{const b=document.getElementById("copy"),c=document.getElementById("code").textContent;try{await navigator.clipboard.writeText(c);b.textContent="Copied"}catch(e){b.textContent="Copy failed - code selected; copy it manually";const r=document.createRange();r.selectNodeContents(document.getElementById("code"));const s=window.getSelection();s.removeAllRanges();s.addRange(r)}};
</script></body></html>
