<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quant practice qe4adb23997</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Quant practice qe4adb23997</h1><p>5 questions &middot; level L0 &middot; about 10 to 15 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "qe4adb23997", "date": "2026-10-15", "type": "QA", "level": 0, "qs": [{"id": "V-time_work_two-17", "q": "A can finish a job in 12 days and B can finish it in 24 days. Working together, in how many days will they finish it?", "o": ["8 days", "36 days", "9 days", "18 days"], "a": 0, "x": "Rates are 1/12 and 1/24 per day. Together 1/12 + 1/24 = 36/288, so the time is 288/36 = 8 days.", "cn": "Add the work done per day (rates), not the days. Time together = (a x b)/(a + b).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two workers together"}, {"id": "V-units_digit-22", "q": "Find the last digit of 3 raised to the power 36.", "o": ["9", "3", "7", "1"], "a": 3, "x": "Units digits of powers of 3 repeat as 3, 9, 7, 1. 36 leaves remainder 4 in a cycle of 4, so the digit is 1.", "cn": "Units digits of powers repeat in a short cycle. Find the remainder of the power divided by the cycle length.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Units digit of a power"}, {"id": "V-l0_area_rect-17", "q": "A field is 15 m long and 8 m wide. What is its area?", "o": ["240 sq m", "46 sq m", "120 sq m", "23 sq m"], "a": 2, "x": "Area of a rectangle = length x width = 15 x 8 = 120 sq m.", "cn": "Area of a rectangle = length x width. Perimeter is a different thing (the distance around).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Area of a rectangle (L0)"}, {"id": "V-l0_simple_interest-17", "q": "What is the simple interest on Rs 1000 at 5% per year for 2 years?", "o": ["Rs 200", "Rs 100", "Rs 50", "Rs 1100"], "a": 1, "x": "Simple interest = P x R x T / 100 = 1000 x 5 x 2 / 100 = Rs 100.", "cn": "Simple interest = principal x rate x time / 100. It is the interest only, not the total amount.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Simple interest, one step (L0)"}, {"id": "V-l0_lcm-17", "q": "Find the LCM of 6 and 15.", "o": ["36", "90", "30", "3"], "a": 2, "x": "Multiples of 6: 6, 12, 18, ... Multiples of 15: 15, 30, ... The smallest common multiple is 30.", "cn": "LCM = the smallest number that both numbers divide into. Do not just multiply the numbers unless they share no factor.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "LCM of two numbers (L0)"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
