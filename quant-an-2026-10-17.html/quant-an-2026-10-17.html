<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quant practice q8ef88dec8f</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>

<script>const D={"id": "q8ef88dec8f", "date": "2026-10-17", "type": "QA", "level": 0, "qs": [{"id": "V-time_work_two-18", "q": "A can finish a job in 30 days and B can finish it in 45 days. Working together, in how many days will they finish it?", "o": ["19 days", "37.5 days", "75 days", "18 days"], "a": 3, "x": "Rates are 1/30 and 1/45 per day. Together 1/30 + 1/45 = 75/1350, so the time is 1350/75 = 18 days.", "cn": "Add the work done per day (rates), not the days. Time together = (a x b)/(a + b).", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Two workers together"}, {"id": "V-units_digit-36", "q": "What is the units digit of 9^24?", "o": ["9", "3", "1", "7"], "a": 2, "x": "Units digits of powers of 9 repeat as 9, 1. 24 divided by 2 leaves remainder 0; a remainder of 0 means it sits at the last place of the cycle, so the digit is 1.", "cn": "Units digits of powers repeat in a short cycle. Find the remainder of the power divided by the cycle length.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Units digit of a power"}, {"id": "V-l0_fraction_of-24", "q": "A class has 60 students. 3/5 of them play cricket. How many students play cricket?", "o": ["100", "12", "36", "24"], "a": 2, "x": "To find 3/5 of 60: divide 60 by 5 to get 12, then multiply by 3: 12 x 3 = 36.", "cn": "A fraction of a quantity: divide by the bottom number, then multiply by the top number.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Fraction of a quantity"}, {"id": "V-l0_linear_eq-25", "q": "A number multiplied by 6 gives 66. What is the number?", "o": ["60", "11", "72", "12"], "a": 1, "x": "The number is 66 / 6 = 11. Check: 6 x 11 = 66.", "cn": "Multiplication is undone by division: divide the result by the multiplier.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "One-step equation"}, {"id": "V-l0_unitary-26", "q": "10 pens cost Rs 160. At the same rate, what will 5 pens cost?", "o": ["Rs 80", "Rs 64", "Rs 16", "Rs 96"], "a": 0, "x": "One pen costs 160 / 10 = Rs 16. So 5 cost 5 x 16 = Rs 80.", "cn": "First find the cost of one (divide), then multiply by how many you need.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Unitary method (price)"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
