<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quant practice q9ca7603f48</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Quant practice q9ca7603f48</h1><p>5 questions &middot; level L0 &middot; about 10 to 15 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "q9ca7603f48", "date": "2026-10-21", "type": "QA", "level": 0, "qs": [{"id": "V-l0_percent_of-27", "q": "Find 50% of 120.", "o": ["120", "85", "70", "60"], "a": 3, "x": "50% of 120 = 50/100 x 120 = 60.", "cn": "Percent means per hundred: p% of n = p/100 x n.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Percentage of a number (L0)"}, {"id": "V-l0_speed_distance-27", "q": "A bus travels at 50 km per hour for 3 hours. How far does it travel?", "o": ["150 km", "53 km", "100 km", "200 km"], "a": 0, "x": "Distance = speed x time = 50 x 3 = 150 km.", "cn": "Distance = speed x time.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Distance = speed x time (L0)"}, {"id": "V-l0_discount-27", "q": "A shirt has a marked price of Rs 200. The shop gives a 20% discount. What is the selling price?", "o": ["Rs 240", "Rs 180", "Rs 160", "Rs 40"], "a": 2, "x": "Discount = 20% of 200 = Rs 40. Selling price = 200 - 40 = Rs 160.", "cn": "Discount is taken off the marked price: selling price = marked price - discount.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Discount to selling price (L0)"}, {"id": "V-l0_consecutive_sum-27", "q": "The sum of 3 consecutive whole numbers is 72. What is the smallest of them?", "o": ["25", "23", "24", "22"], "a": 1, "x": "For 3 consecutive numbers the middle one is the average: 72 / 3 = 24. The smallest is 24 - 1 = 23.", "cn": "Consecutive numbers differ by 1. The middle one is the average, or set up a small equation.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Consecutive numbers"}, {"id": "V-l0_square_root-27", "q": "What is the square root of 225?", "o": ["15", "17", "16", "14"], "a": 0, "x": "15 x 15 = 225, so the square root of 225 is 15.", "cn": "Find the number that multiplied by itself gives the given number. Try nearby round numbers first.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Square root"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
