<script>const D={"id": "qd9e0bce645", "date": "2026-10-22", "type": "QA", "level": 0, "qs": [{"id": "V-l0_ratio_share-32", "q": "140 marbles are shared between Imran and Mira in the ratio 4 : 3. How many does Imran get?", "o": ["80", "70", "100", "60"], "a": 0, "x": "Total parts = 4 + 3 = 7. One part = 140 / 7 = 20. Imran gets 4 x 20 = 80.", "cn": "Add the ratio parts, find the value of one part, then multiply.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Sharing in a ratio (L0)"}, {"id": "V-l0_average-32", "q": "Find the average of 44, 30, 40, 42, 44.", "o": ["42", "39", "41", "40"], "a": 3, "x": "Sum = 200. Number of values = 5. Average = 200 / 5 = 40.", "cn": "Average = sum of the values / number of values.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Average of numbers (L0)"}, {"id": "V-l0_discount-32", "q": "A shirt has a marked price of Rs 800. The shop gives a 25% discount. What is the selling price?", "o": ["Rs 200", "Rs 600", "Rs 1000", "Rs 775"], "a": 1, "x": "Discount = 25% of 800 = Rs 200. Selling price = 800 - 200 = Rs 600.", "cn": "Discount is taken off the marked price: selling price = marked price - discount.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Discount to selling price (L0)"}, {"id": "V-l0_bodmas-32", "q": "Find the value of 12 + 3 x 2 - 8.", "o": ["22", "10", "12", "26"], "a": 1, "x": "Multiply first: 3 x 2 = 6. Then 12 + 6 = 18, and 18 - 8 = 10.", "cn": "Do multiplication before addition and subtraction. Working left to right ignores that rule.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Order of operations (L0)"}, {"id": "V-l0_square_root-32", "q": "What is the square root of 841?", "o": ["28", "30", "29", "31"], "a": 2, "x": "29 x 29 = 841, so the square root of 841 is 29.", "cn": "Find the number that multiplied by itself gives the given number. Try nearby round numbers first.", "sl": "Original variant of a concept (numbers and wording changed)", "t": "Square root (L0)"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};

</script></body></html>
